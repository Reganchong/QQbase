<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>龍山寺 Supabase 資料庫測試</title>

<style>

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f5f5f7;

    margin: 0;

    padding: 30px 15px;
}

.box {

    max-width: 520px;

    margin: 50px auto;

    background: white;

    padding: 25px;

    border-radius: 16px;

    box-shadow:
        0 4px 16px
        rgba(0,0,0,.08);
}

h2 {

    color: #1a365d;

    text-align: center;
}

button {

    width: 100%;

    padding: 14px;

    margin-top: 12px;

    border: none;

    border-radius: 8px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

#insertBtn {

    background: #2b6cb0;

    color: white;
}

#readBtn {

    background: #38a169;

    color: white;
}

#loginBtn {

    background: #dd6b20;

    color: white;
}

#status {

    margin-top: 18px;

    padding: 12px;

    background: #edf2f7;

    border-radius: 8px;

    font-family: monospace;

    white-space: pre-wrap;

    font-size: 13px;

    line-height: 1.5;
}

</style>

</head>

<body>

<div class="box">

<h2>
🏛️ Supabase 資料庫測試
</h2>

<button id="insertBtn">
➕ 寫入第一筆測試作品
</button>

<button id="readBtn">
🔍 讀取測試作品
</button>

<button id="loginBtn">
🔐 回登入頁
</button>

<div id="status">
正在確認登入狀態……
</div>

</div>


<script type="module">

import { supabase }
from "./supabase-client.js";


const statusEl =
document.getElementById(
    "status"
);


let currentSession =
null;


/* ==================================
   Session 檢查
================================== */

async function checkSession() {

    const {
        data: {
            session
        },

        error

    } =
    await supabase.auth
        .getSession();


    if (error) {

        statusEl.innerText =
            "❌ Session 錯誤\n\n" +
            error.message;

        return false;
    }


    if (!session) {

        statusEl.innerText =

            "❌ 此頁目前沒有讀到登入 Session。\n\n" +

            "目前網址：\n" +

            window.location.href +

            "\n\n請先進入 login.html 登入。";


        return false;
    }


    currentSession =
        session;


    statusEl.innerText =

        "✅ 已保持登入\n\n" +

        "帳號：\n" +

        session.user.email +

        "\n\nUser ID：\n" +

        session.user.id;


    return true;
}


await checkSession();


/* ==================================
   INSERT
================================== */

document
.getElementById("insertBtn")
.onclick =
async function () {


    if (!(await checkSession())) {

        return;

    }


    statusEl.innerText =
        "📡 正在寫入 survey_records……";


    const testRecord = {

        record_code:
            "LS-SH-W-MR-11-001",

        temple_code:
            "LS",

        area:
            "SH",

        direction:
            "W",

        roof_position:
            "MR",

        component_code:
            "11",

        serial:
            "001",

        crafts:
            ["CP"],

        title:
            "資料庫連線測試作品",

        note:
            "此筆資料為 Supabase 系統測試紀錄。"

    };


    const {
        data,
        error
    } =
    await supabase

        .from(
            "survey_records"
        )

        .insert(
            testRecord
        )

        .select();


    if (error) {

        statusEl.innerText =

            "❌ 寫入失敗\n\n" +

            "錯誤：\n" +
            error.message +

            "\n\nCode：\n" +
            (error.code || "無");


        console.error(error);

        return;
    }


    statusEl.innerText =

        "🎉 寫入成功！\n\n" +

        JSON.stringify(
            data,
            null,
            2
        );

};


/* ==================================
   SELECT
================================== */

document
.getElementById("readBtn")
.onclick =
async function () {


    if (!(await checkSession())) {

        return;

    }


    statusEl.innerText =
        "📡 正在讀取資料……";


    const {
        data,
        error
    } =
    await supabase

        .from(
            "survey_records"
        )

        .select("*")

        .eq(
            "record_code",
            "LS-SH-W-MR-11-001"
        );


    if (error) {

        statusEl.innerText =

            "❌ 讀取失敗\n\n" +

            error.message;

        return;
    }


    statusEl.innerText =

        "✅ 查詢成功！\n\n" +

        "找到：" +
        data.length +
        " 筆\n\n" +

        JSON.stringify(
            data,
            null,
            2
        );

};


/* ==================================
   回登入
================================== */

document
.getElementById("loginBtn")
.onclick =
function () {

    window.location.href =
        "./login.html";

};

</script>

</body>
</html>
