<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龍山寺普查系統 - 完整調查表</title>
<style>
:root{
    --orange:#c4785a;
    --gray:#7a7671;
    --green:#5c634b;
    --bg:#f7f5f2;
    --soft:#f1ede8;
    --border:#d7d0c8;
    --text:#2f2d2b;
    --sub:#6b6762;
}
*{box-sizing:border-box}
body{
    margin:0;padding:16px;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
.container{
    max-width:1100px;margin:auto;background:white;border:1px solid var(--border);
    border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.07);overflow:hidden;
}
header{
    padding:20px 22px;border-bottom:1px solid var(--border);
    display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
}
h1{margin:0;color:var(--green);font-size:22px}
.record-code{font-family:ui-monospace,monospace;color:var(--orange);font-weight:800;word-break:break-all}
.status{font-size:12px;color:var(--sub)}
.status.ok{color:var(--green);font-weight:700}.status.bad{color:#b13e3e;font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{
    border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;
    text-decoration:none;font-size:14px;
}
.primary{background:var(--orange);color:#fff}
.secondary{background:var(--gray);color:#fff}
.green{background:var(--green);color:#fff}
.tabs{
    display:flex;gap:0;overflow:auto;border-bottom:1px solid var(--border);background:var(--soft)
}
.tab{
    min-width:max-content;padding:13px 16px;cursor:pointer;color:var(--sub);
    border-bottom:3px solid transparent;font-weight:700;font-size:13px;
}
.tab.active{color:var(--green);border-bottom-color:var(--orange);background:#fff}
.panel{display:none;padding:22px}.panel.active{display:block}
.section{
    border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;
}
.section h2{font-size:17px;color:var(--green);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
label.field{display:block;font-size:13px;font-weight:700;color:var(--sub)}
input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;margin-top:6px;padding:10px 11px;border:1px solid var(--border);
    border-radius:8px;background:#fff;font-size:14px;color:var(--text);
}
textarea{min-height:95px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{
    display:flex;gap:6px;align-items:center;border:1px solid var(--border);
    background:#fbfaf8;border-radius:8px;padding:8px 10px;font-size:13px
}
.readonly{background:#f1ede8!important}
.photo-grid,.repair-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.photo-card,.repair-card{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fbfaf8}
.photo-card img{width:100%;height:150px;object-fit:cover;border-radius:8px;background:#eee}
.photo-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.photo-actions button{padding:7px 9px;font-size:12px}
.danger{background:#b84e4e;color:#fff}
.photo-form{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;background:#fbfaf8}
.photo-form h2{font-size:17px;color:var(--green);margin:0 0 14px}
.photo-preview{display:none;margin-top:10px}
.photo-preview img{max-width:100%;max-height:260px;border-radius:8px}
.small{font-size:12px;color:var(--sub)}
.notice{padding:12px;border-radius:9px;background:#fbf4ef;color:#8d503b;margin-bottom:15px}
.bottom-save{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:#fbfaf8;position:sticky;bottom:0}
@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}.panel{padding:15px}}
</style>
</head>
<body>
<div class="container">
<header>
    <div>
        <h1>艋舺龍山寺屋頂建築裝飾工藝作品調查表</h1>
        <div id="recordCode" class="record-code">讀取中……</div>
        <div id="status" class="status">正在確認登入與資料……</div>
    </div>
    <div class="toolbar">
        <a href="query.html" class="btn secondary">← 回資料查詢</a>
        <button id="saveTop" class="primary">💾 儲存全部</button>
    </div>
</header>

<div class="tabs" id="tabs">
    <div class="tab active" data-panel="basic">1 基本資料</div>
    <div class="tab" data-panel="material">2 年代與材料</div>
    <div class="tab" data-panel="subject">3 題材典故</div>
    <div class="tab" data-panel="condition">4 保存狀況</div>
    <div class="tab" data-panel="conservation">5 修護建議</div>
    <div class="tab" data-panel="photos">6 影像紀錄</div>
    <div class="tab" data-panel="repairs">7 修繕紀錄</div>
</div>

<!-- 1 -->
<section class="panel active" id="basic">
<div class="section">
<h2>基本資料</h2>
<div class="grid">
<label class="field">題材名稱<input id="title" type="text"></label>
<label class="field">登錄編號<input id="record_code" class="readonly" type="text" readonly></label>
<label class="field">殿區
<select id="area">
<option value="SH">三川殿 (SH)</option><option value="FL">前殿龍門 (FL)</option><option value="FR">前殿虎門 (FR)</option>
<option value="LC">左下山前廊 (LC)</option><option value="RC">右下山前廊 (RC)</option><option value="XL">左下山護室 (XL)</option>
<option value="XR">右下山護室 (XR)</option><option value="GL">左過水廊 (GL)</option><option value="GR">右過水廊 (GR)</option>
<option value="TL">左頂山護室 (TL)</option><option value="TR">右頂山護室 (TR)</option><option value="BT">鐘樓 (BT)</option>
<option value="DT">鼓樓 (DT)</option><option value="YH">後殿月老廳 (YH)</option><option value="HH">後殿華佗廳 (HH)</option>
<option value="RL">後殿龍門 (RL)</option><option value="RR">後殿虎門 (RR)</option><option value="TH">天上聖母殿 (TH)</option>
<option value="GH">關聖帝君殿 (GH)</option><option value="WH">文昌帝君殿 (WH)</option><option value="PL">牌樓 (PL)</option>
</select></label>
<label class="field">屋面朝向
<select id="direction"><option value="E">東</option><option value="W">西</option><option value="S">南</option><option value="N">北</option></select>
</label>
<label class="field">屋面部位
<select id="roof_position"><option value="MR">正脊</option><option value="DR">垂脊</option><option value="HR">戧脊</option><option value="ER">圍脊</option><option value="AR">角脊</option><option value="SR">燕尾</option><option value="SD">水車堵</option><option value="GD">山花</option><option value="WD">牆堵</option></select>
</label>
<label class="field">構件代碼<input id="component_code" type="text"></label>
<label class="field">檢視人員<input id="inspector" type="text"></label>
<label class="field">檢視單位<input id="inspection_unit" type="text"></label>
<label class="field">檢視日期<input id="inspection_date" type="date"></label>
<label class="field">作者／落款<input id="author_signature" type="text"></label>
<div class="full">
<label class="field">裝飾屬性</label>
<div class="checks">
<label class="check"><input type="radio" name="ageClass" value="50年以上">製成年代逾 50 年以上</label>
<label class="check"><input type="radio" name="ageClass" value="未達50年">製成年代未達 50 年</label>
</div>
</div>
<div class="full">
<label class="field">工藝類型（可複選）</label>
<div class="checks">
<label class="check"><input type="checkbox" name="crafts" value="CP">剪黏</label>
<label class="check"><input type="checkbox" name="crafts" value="CS">泥塑</label>
<label class="check"><input type="checkbox" name="crafts" value="JP">交趾陶</label>
</div>
</div>
<div class="full">
<label class="field">組成形式</label>
<div class="checks">
<label class="check"><input type="checkbox" name="composition" value="單件">單件</label>
<label class="check"><input type="checkbox" name="composition" value="成對">成對</label>
<label class="check"><input type="checkbox" name="composition" value="連續排列">連續排列</label>
<label class="check"><input type="checkbox" name="composition" value="左右對稱">左右對稱</label>
<label class="check"><input type="checkbox" name="composition" value="組群">組群</label>
</div>
</div>
<label class="field full">對應作品編號（多筆以逗號分隔）<input id="related_record_codes" type="text"></label>
</div>

<div style="border-top:1px solid var(--border); margin:22px 0 18px; padding-top:18px;">
<h3 style="margin:0 0 14px; color:var(--green); font-size:15px;">尺寸與文資身分</h3>

<div class="grid3">
<label class="field">長（cm）<input id="length_cm" type="number" step="0.01"></label>
<label class="field">寬（cm）<input id="width_cm" type="number" step="0.01"></label>
<label class="field">厚／高（cm）<input id="height_cm" type="number" step="0.01"></label>
</div>

<div class="checks" style="margin-top:12px">
<label class="check"><input id="unable_to_measure" type="checkbox">無法測量</label>
</div>

<label class="field" style="margin-top:12px">
所屬文化資產
<input id="cultural_asset_name" class="readonly" type="text" value="國定古蹟—文授資局蹟字第 10730122031 號">
</label>
</div>

</div>
</section>

<!-- 2 -->
<section class="panel" id="material">
<div class="section">
<h2>年代</h2>
<div class="grid">
<label class="field">年代區間<input id="period_range" type="text" placeholder="例如：日治時期（1895–1945）"></label>
<label class="field">文物紀年（西元）<input id="artifact_year" type="number"></label>
</div>
<div class="checks" style="margin-top:12px"><label class="check"><input id="year_pending_analysis" type="checkbox">待分析</label></div>
</div>

<div class="section">
<h2>剪黏／泥塑材料</h2>
<label class="field">表面材料</label>
<div class="checks" data-check-group="surface_materials">
<label class="check"><input type="checkbox" value="仿古瓷碗片">仿古瓷碗片</label><label class="check"><input type="checkbox" value="彩色玻璃片">彩色玻璃片</label><label class="check"><input type="checkbox" value="陶片">陶片</label><label class="check"><input type="checkbox" value="瓷片">瓷片</label><label class="check"><input type="checkbox" value="瓦片">瓦片</label><label class="check"><input type="checkbox" value="金屬">金屬</label><label class="check"><input type="checkbox" value="壓克力">壓克力</label><label class="check"><input type="checkbox" value="彩繪">彩繪</label><label class="check"><input type="checkbox" value="貼金">貼金</label><label class="check"><input type="checkbox" value="未施彩">未施彩</label><label class="check"><input type="checkbox" value="無法辨識">無法辨識</label>
</div>
<label class="field" style="margin-top:14px">坯體</label>
<div class="checks" data-check-group="body_materials">
<label class="check"><input type="checkbox" value="水泥砂漿">水泥砂漿</label><label class="check"><input type="checkbox" value="灰泥">灰泥</label><label class="check"><input type="checkbox" value="金屬骨架">金屬骨架</label><label class="check"><input type="checkbox" value="無法辨識">無法辨識</label>
</div>
<label class="field" style="margin-top:14px">基底材料</label>
<div class="checks" data-check-group="base_materials">
<label class="check"><input type="checkbox" value="麻絨">麻絨</label><label class="check"><input type="checkbox" value="海菜粉">海菜粉</label><label class="check"><input type="checkbox" value="糯米糖水">糯米糖水</label><label class="check"><input type="checkbox" value="化學樹脂">化學樹脂</label><label class="check"><input type="checkbox" value="未發現相關資料">未發現相關資料</label><label class="check"><input type="checkbox" value="無法確認">無法確認</label>
</div>
</div>

<div class="section">
<h2>交趾陶材料</h2>
<label class="field">坯體類型</label>
<div class="checks" data-check-group="ceramic_body_types">
<label class="check"><input type="checkbox" value="陶坯">陶坯</label><label class="check"><input type="checkbox" value="瓷坯">瓷坯</label><label class="check"><input type="checkbox" value="無法辨識">無法辨識</label>
</div>
<label class="field" style="margin-top:14px">釉彩類型</label>
<div class="checks" data-check-group="glaze_types">
<label class="check"><input type="checkbox" value="寶石釉">寶石釉</label><label class="check"><input type="checkbox" value="水彩釉">水彩釉</label><label class="check"><input type="checkbox" value="西洋釉上彩">西洋釉上彩</label><label class="check"><input type="checkbox" value="無法辨識">無法辨識</label>
</div>
<label class="field" style="margin-top:14px">釉面特徵</label>
<div class="checks" data-check-group="glaze_features">
<label class="check"><input type="checkbox" value="透明">透明</label><label class="check"><input type="checkbox" value="半透明">半透明</label><label class="check"><input type="checkbox" value="不透明">不透明</label><label class="check"><input type="checkbox" value="透明與不透明並用">透明與不透明並用</label><label class="check"><input type="checkbox" value="無法辨識">無法辨識</label>
</div>
</div>

<div class="section">
<h2>材料判定依據</h2>
<div class="checks" data-check-group="material_basis">
<label class="check"><input type="checkbox" value="現場目視">現場目視</label><label class="check"><input type="checkbox" value="材料外露">材料外露</label><label class="check"><input type="checkbox" value="修復報告">修復報告</label><label class="check"><input type="checkbox" value="施工紀錄">施工紀錄</label><label class="check"><input type="checkbox" value="匠師訪談">匠師訪談</label><label class="check"><input type="checkbox" value="材料檢測">材料檢測</label><label class="check"><input type="checkbox" value="歷史文獻">歷史文獻</label>
</div>
</div>
</section>

<!-- 3 -->
<section class="panel" id="subject">
<div class="section">
<h2>工藝題材典故</h2>
<label class="field">題材分類</label>
<div class="checks" data-check-group="subject_categories">
<label class="check"><input type="checkbox" value="人物">人物</label><label class="check"><input type="checkbox" value="神祇">神祇</label><label class="check"><input type="checkbox" value="歷史故事">歷史故事</label><label class="check"><input type="checkbox" value="戲曲故事">戲曲故事</label><label class="check"><input type="checkbox" value="吉祥圖案">吉祥圖案</label><label class="check"><input type="checkbox" value="動物">動物</label><label class="check"><input type="checkbox" value="植物">植物</label><label class="check"><input type="checkbox" value="水族">水族</label><label class="check"><input type="checkbox" value="器物">器物</label><label class="check"><input type="checkbox" value="文字">文字</label><label class="check"><input type="checkbox" value="山水">山水</label><label class="check"><input type="checkbox" value="其他">其他</label>
</div>
<label class="field" style="margin-top:14px">題材內容與典故簡述<textarea id="subject_description"></textarea></label>
<label class="field" style="margin-top:14px">一般備註<textarea id="note"></textarea></label>
</div>
</section>

<!-- 4 -->
<section class="panel" id="condition">
<div class="section">
<h2>損壞情形</h2>
<label class="field">整體情形</label>
<div class="checks" data-check-group="overall_conditions">
<label class="check"><input type="checkbox" value="現況良好">現況良好</label><label class="check"><input type="checkbox" value="損壞嚴重">損壞嚴重</label><label class="check"><input type="checkbox" value="局部損壞">局部損壞</label><label class="check"><input type="checkbox" value="結構不穩">結構不穩</label><label class="check"><input type="checkbox" value="作品佚失">作品佚失</label>
</div>
<label class="field" style="margin-top:14px">骨架</label>
<div class="checks" data-check-group="framework_damage">
<label class="check"><input type="checkbox" value="裸露">裸露</label><label class="check"><input type="checkbox" value="鏽蝕">鏽蝕</label><label class="check"><input type="checkbox" value="斷裂">斷裂</label><label class="check"><input type="checkbox" value="變形">變形</label><label class="check"><input type="checkbox" value="鬆動">鬆動</label><label class="check"><input type="checkbox" value="背景或配件佚失">背景或配件佚失</label><label class="check"><input type="checkbox" value="佚失">佚失</label>
</div>
<label class="field" style="margin-top:14px">胚體</label>
<div class="checks" data-check-group="body_damage">
<label class="check"><input type="checkbox" value="汙損">汙損</label><label class="check"><input type="checkbox" value="粉化">粉化</label><label class="check"><input type="checkbox" value="剝離">剝離</label><label class="check"><input type="checkbox" value="空鼓">空鼓</label><label class="check"><input type="checkbox" value="生物劣化">生物劣化</label><label class="check"><input type="checkbox" value="鹽害">鹽害</label><label class="check"><input type="checkbox" value="破損">破損</label><label class="check"><input type="checkbox" value="裂縫">裂縫</label><label class="check"><input type="checkbox" value="佚失">佚失</label>
</div>
<label class="field" style="margin-top:14px">表層繪色</label>
<div class="checks" data-check-group="surface_damage">
<label class="check"><input type="checkbox" value="汙損">汙損</label><label class="check"><input type="checkbox" value="粉化">粉化</label><label class="check"><input type="checkbox" value="褪色">褪色</label><label class="check"><input type="checkbox" value="龜裂">龜裂</label><label class="check"><input type="checkbox" value="剝落">剝落</label><label class="check"><input type="checkbox" value="起甲">起甲</label><label class="check"><input type="checkbox" value="泛鹽">泛鹽</label><label class="check"><input type="checkbox" value="佚失">佚失</label>
</div>
<label class="field" style="margin-top:14px">外覆材料</label>
<div class="checks" data-check-group="covering_damage">
<label class="check"><input type="checkbox" value="汙損">汙損</label><label class="check"><input type="checkbox" value="脫落">脫落</label><label class="check"><input type="checkbox" value="碎裂">碎裂</label><label class="check"><input type="checkbox" value="釉面剝落">釉面剝落</label><label class="check"><input type="checkbox" value="褪色">褪色</label><label class="check"><input type="checkbox" value="佚失">佚失</label>
</div>
</div>

<div class="section">
<h2>保存狀況分級</h2>
<div class="checks">
<label class="check"><input type="radio" name="condition_level" value="1">第一級：整體狀況良好</label>
<label class="check"><input type="radio" name="condition_level" value="2">第二級：輕微劣化、狀況穩定</label>
<label class="check"><input type="radio" name="condition_level" value="3">第三級：明顯劣化，可延緩處理</label>
<label class="check"><input type="radio" name="condition_level" value="4">第四級：劣化持續發展，需優先處理</label>
<label class="check"><input type="radio" name="condition_level" value="5">第五級：危急狀態，需立即處理</label>
</div>
<label class="field" style="margin-top:14px">保存狀況簡述<textarea id="condition_description"></textarea></label>
</div>
</section>

<!-- 5 -->
<section class="panel" id="conservation">
<div class="section">
<h2>未來修護建議</h2>
<label class="field">修護策略</label>
<div class="checks" data-check-group="conservation_strategies">
<label class="check"><input type="checkbox" value="原狀維護">原狀維護</label><label class="check"><input type="checkbox" value="現狀保存">現狀保存</label><label class="check"><input type="checkbox" value="加固處理">加固處理</label><label class="check"><input type="checkbox" value="清潔處理">清潔處理</label><label class="check"><input type="checkbox" value="表層色層補色">表層色層補色</label><label class="check"><input type="checkbox" value="補缺修復">補缺修復</label><label class="check"><input type="checkbox" value="局部重塑">局部重塑</label><label class="check"><input type="checkbox" value="不當修補材料移除">不當修補材料移除</label><label class="check"><input type="checkbox" value="原貌復原">原貌復原</label><label class="check"><input type="checkbox" value="全面重製">全面重製</label><label class="check"><input type="checkbox" value="移地保存">移地保存</label><label class="check"><input type="checkbox" value="複製替換">複製替換</label>
</div>

async function loadPhotos(){

        return;

function normalizePhotoToken(value){
    return String(value||"").trim().toUpperCase().replace(/\s+/g,"");
}

function photoCodeFromToken(){
    const token=normalizePhotoToken($("photo_token").value);
    return token && currentRecord ? `${currentRecord.record_code}-${token}` : "";
}

function updatePhotoCodePreview(){
    $("photo_token").value=normalizePhotoToken($("photo_token").value);
    $("photo_code_preview").value=photoCodeFromToken();
}

function parsePhotoToken(token){
    const m=normalizePhotoToken(token).match(/^([A-Z]+)(\d+)$/);
    return m ? {type:m[1],sequence:Number(m[2])} : {type:normalizePhotoToken(token)||null,sequence:null};
}

function datetimeLocalValue(value){
    if(!value) return "";
    const d=new Date(value);
    if(Number.isNaN(d.getTime())) return "";
    const local=new Date(d.getTime()-d.getTimezoneOffset()*60000);
    return local.toISOString().slice(0,16);
}

function beginPhotoEdit(p){

        ? p.photo_code.slice(currentRecord.record_code.length+1)

    $("editing_photo_id").value=p.id;
    $("editing_storage_path").value=p.storage_path||"";
    $("photo_token").value=suffix;
    $("photo_code_preview").value=p.photo_code||"";
    $("photo_view_type").value=p.photo_type_display||"";
    $("photo_photographer").value=p.photographer||"";
    $("photo_taken_at").value=datetimeLocalValue(p.taken_at);
    $("photo_copyright_note").value=p.copyright_note||"";
    $("photo_image_content").value=p.image_content||"";
    $("photo_damage_location_note").value=p.damage_location_note||"";
    $("photo_is_representative").checked=!!p.is_representative;
    $("photo_file").value="";
    $("savePhotoBtn").textContent="💾 更新影像紀錄";

    document.querySelector('.tab[data-panel="photos"]').click();

async function savePhotoRecord(){
    if(!currentRecord) return;

    const editingId=$("editing_photo_id").value||null;
    const oldStoragePath=$("editing_storage_path").value||null;
    const token=normalizePhotoToken($("photo_token").value);
    const photoCode=photoCodeFromToken();
    const file=$("photo_file").files?.[0]||null;

    if(!token){
        alert("❌ 請填寫照片型別＋序號，例如 O01 或 D01。");
        return;
    }

    if(!editingId && !file){
        alert("❌ 新增照片時必須選擇影像檔。");
        return;
    }

    $("savePhotoBtn").disabled=true;
    $("savePhotoBtn").textContent="⏳ 正在儲存……";

    try{
        const parsed=parsePhotoToken(token);
        let storagePath=oldStoragePath;
        let fileName=null;

        if(file){
            if(!storagePath){
                const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
                storagePath=`${currentRecord.area}/${currentRecord.record_code}/${photoCode}.${ext}`;
            }

            const {error:uploadError}=await supabase.storage
                .from("longshan-photos")
                .upload(storagePath,file,{
                    upsert:true,
                    contentType:file.type||undefined,
                    cacheControl:"3600"
                });

            if(uploadError) throw new Error("影像上傳失敗："+uploadError.message);
            fileName=file.name;
        }

        const representative=$("photo_is_representative").checked;

        if(representative){
            const {error:clearRepError}=await supabase
                .from("photos")
                .update({is_representative:false})
                .eq("record_id",recordId);

            if(clearRepError) throw new Error("代表照片更新失敗："+clearRepError.message);
        }

        const row={
            record_id:recordId,
            photo_code:photoCode,
            photo_type:parsed.type,
            sequence_no:parsed.sequence,
            storage_path:storagePath,
            photographer:val("photo_photographer"),
            taken_at:$("photo_taken_at").value ? new Date($("photo_taken_at").value).toISOString() : null,
            copyright_note:val("photo_copyright_note"),
            image_content:val("photo_image_content"),
            damage_location_note:val("photo_damage_location_note"),
            is_representative:representative
        };

        if(fileName) row.file_name=fileName;

        let result;
        if(editingId){
            result=await supabase.from("photos").update(row).eq("id",editingId);
        }else{
            result=await supabase.from("photos").insert(row);
        }

        if(result.error) throw new Error("照片資料寫入失敗："+result.error.message);

        resetPhotoForm();
        await loadPhotos();
        alert(editingId ? "✅ 影像紀錄已更新。" : "✅ 影像紀錄已新增。");

    }catch(err){
        console.error(err);
        alert("❌ "+err.message);
    }finally{
        $("savePhotoBtn").disabled=false;
        if(!$("editing_photo_id").value) $("savePhotoBtn").textContent="📷 儲存影像紀錄";
    }
}

async function deletePhotoRecord(p){
    if(!confirm(`確定要刪除照片 ${p.photo_code} 嗎？\n\n此操作會同時刪除 Storage 原檔與 photos 資料表紀錄。`)){
        return;
    }

    try{
        const {error:storageError}=await supabase.storage
            .from("longshan-photos")
            .remove([p.storage_path]);

        if(storageError) throw new Error("Storage 刪除失敗："+storageError.message);

        const {error:dbError}=await supabase
            .from("photos")
            .delete()
            .eq("id",p.id);

        if(dbError) throw new Error("photos 資料列刪除失敗："+dbError.message);

        await loadPhotos();
        alert("✅ 照片已刪除。");

    }catch(err){
        console.error(err);
        alert("❌ "+err.message);
    }
}

        surface_materials:groupValues("surface_materials"), body_materials:groupValues("body_materials"),
        base_materials:groupValues("base_materials"), ceramic_body_types:groupValues("ceramic_body_types"),
        glaze_types:groupValues("glaze_types"), glaze_features:groupValues("glaze_features"),
        material_basis:groupValues("material_basis"), subject_categories:groupValues("subject_categories"),
        subject_description:val("subject_description"), note:val("note"),
        source_types:groupValues("source_types"), dating_confidence:$("dating_confidence").value||null
    };

    const {error:e1}=await supabase.from("survey_records").update(survey).eq("id",recordId);
    if(e1){$("saveStatus").textContent="❌ 主檔儲存失敗："+e1.message;return}

    const level=document.querySelector('input[name="condition_level"]:checked')?.value;
    const condition={
        record_id:recordId,
        overall_conditions:groupValues("overall_conditions"),
        framework_damage:groupValues("framework_damage"),
        body_damage:groupValues("body_damage"),
        surface_damage:groupValues("surface_damage"),
        covering_damage:groupValues("covering_damage"),
        condition_level:level?Number(level):null,
        condition_description:val("condition_description"),
        conservation_strategies:groupValues("conservation_strategies"),
        material_recommendations:groupValues("material_recommendations"),
        professional_assessment_needed:$("professional_assessment_needed").checked,
        urgent_treatment_needed:$("urgent_treatment_needed").checked
    };
    const {error:e2}=await supabase.from("condition_records").upsert(condition,{onConflict:"record_id"});
    if(e2){$("saveStatus").textContent="❌ 保存狀況儲存失敗："+e2.message;return}

    $("saveStatus").textContent="✅ 已儲存："+new Date().toLocaleTimeString();
}

$("addRepairBtn").onclick=async()=>{
    const row={
        record_id:recordId,
        original_year:val("repair_original_year"),
        existing_work_year:val("repair_existing_work_year"),
        repair_year:val("repair_year"),
        artisan:val("repair_artisan"),
        organization:val("repair_organization"),
        current_status:$("repair_current_status").value||null,
        repair_method:val("repair_method"),
        source:val("repair_source"),
        note:val("repair_note")
    };
    const {error}=await supabase.from("repair_records").insert(row);
    if(error){alert("❌ 新增修繕紀錄失敗："+error.message);return}
    ["repair_original_year","repair_existing_work_year","repair_year","repair_artisan","repair_organization","repair_method","repair_source","repair_note"].forEach(id=>$(id).value="");
    $("repair_current_status").value="";
    await loadRepairs();
};

$("saveTop").onclick=saveAll;
$("saveBottom").onclick=saveAll;
await loadRecord();
</script>
