<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>普查系統 - 數據登錄工具</title>
    <style>
        :root {
            --temple-orange: #c4785a;
            --temple-gray: #7a7671;
            --temple-green: #5c634b;
            --bg-main: #f7f5f2;
            --bg-card: #ffffff;
            --bg-soft: #f1ede8;
            --text-main: #2f2d2b;
            --text-sub: #6b6762;
            --border: #d7d0c8;
            --success-bg: #eef2ea;
            --warning-bg: #fbf4ef;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(92,99,75,0.08);
        }
        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
            color: var(--temple-green);
        }
        .code-preview-box {
            background-color: var(--warning-bg);
            border: 2px dashed var(--temple-orange);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .code-preview-box label {
            font-size: 13px;
            color: var(--temple-orange);
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        .generated-code {
            font-family: monospace;
            font-size: 24px;
            font-weight: bold;
            color: var(--temple-orange);
            word-break: break-all;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-row .form-group {
            flex: 1;
            min-width: 0;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-sub);
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 8px 0;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-soft);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit {
            background-color: var(--temple-orange);
            color: white;
        }
        .btn-nav {
            background-color: var(--temple-gray);
            color: white;
        }
        .btn-export {
            background-color: var(--temple-green);
            color: white;
        }
        .btn-home {
            background-color: var(--temple-green);
            color: white;
            margin-top: 20px;
            width: 100%;
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 15px 0;
            border-radius: 8px;
            box-sizing: border-box;
            font-weight: bold;
        }
        .preview-container {
            margin-top: 10px;
            display: none;
            text-align: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }
        .history {
            margin-top: 30px;
            border-top: 2px solid var(--border);
            padding-top: 20px;
        }
        .history h2 {
            font-size: 18px;
            margin: 0 0 15px 0;
            color: var(--text-sub);
        }
        .data-card {
            background: var(--bg-soft);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 6px solid var(--temple-orange);
            font-size: 14px;
            position: relative;
        }
        .data-card img {
            max-width: 150px;
            display: block;
            margin-top: 10px;
            border-radius: 6px;
        }
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #e53e3e;
            cursor: pointer;
            font-weight: bold;
            border: none;
            background: none;
            font-size: 15px;
        }

        .session-bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:16px; font-size:12px; }
        .session-ok { color:var(--temple-green); font-weight:700; }
        .session-off { color:#c05621; font-weight:700; }
        .session-bad { color:#c53030; font-weight:700; }
        .sync-status { background:#fffaf0; border:1px solid #feebc8; border-radius:10px; padding:10px 12px; margin-bottom:16px; font-size:13px; line-height:1.5; }
        .sync-status strong { color:#c05621; }
        .sub-code { font-family:monospace; color:var(--temple-gray); font-size:13px; margin-top:6px; word-break:break-all; }
        .badge { display:inline-block; border-radius:999px; padding:3px 8px; font-size:11px; font-weight:700; margin-left:6px; }
        .badge-pending { background:#fffaf0; color:#c05621; }
        .badge-synced { background:#f0fff4; color:#276749; }
        .badge-failed { background:#fff5f5; color:#c53030; }
        .data-card.pending { border-left-color:var(--temple-green); }
        .data-card.synced { border-left-color:var(--temple-green); }
        .data-card.failed { border-left-color:#e53e3e; }
        .btn-sync { background:var(--temple-green); color:white; }
        .small-note { color:var(--temple-gray); font-size:12px; line-height:1.5; margin-top:6px; }
        @media (max-width:620px) { .form-row,.btn-group { flex-direction:column; } .generated-code { font-size:18px; } }
    
        .serial-control {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            align-items: center;
        }
        .serial-control input {
            text-align: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .serial-nav-btn {
            min-width: 88px;
            padding: 11px 12px;
            border: 0;
            border-radius: 8px;
            background: var(--temple-gray);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .serial-nav-btn.next { background: var(--temple-orange); }
        .serial-nav-btn:hover { filter: brightness(.95); }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--temple-orange);
            box-shadow: 0 0 0 3px rgba(196,120,90,.15);
        }
        @media (max-width: 520px) {
            .serial-control { grid-template-columns: 1fr 1fr; }
            .serial-control input { grid-column: 1 / -1; grid-row: 1; }
        }

</style>
</head>
<body>
<div class="container">
    <h1>🏛️ 裝飾普查數據登錄</h1>

    <div class="session-bar">
        <span id="authStatus">正在確認登入狀態……</span>
        <span id="networkStatus">網路狀態檢查中……</span>
    </div>
    <div class="sync-status">
        <strong>雲端同步：</strong><span id="syncSummary">讀取本機待同步資料……</span>
    </div>
    
    <div class="code-preview-box">
        <label>作品唯一編號</label>
        <div class="generated-code" id="recordCodePreview"></div>
        <div class="sub-code" id="photoCodePreview"></div>
        <div class="sub-code" id="craftPreview"></div>
    </div>

    <!-- 📄 第一步分頁：大建築環境與方位朝向 -->
    <div id="page1" class="page active">
        <h3 style="color:var(--temple-orange); margin-bottom:15px; border-left:4px solid var(--temple-orange); padding-left:8px;">
            第一步：選擇主要建築與朝向方位
        </h3>
        <div class="form-row">
            <div class="form-group" style="flex: 0 0 80px;">
                <label>寺廟代號</label>
                <input type="text" id="prefix" value="LS" disabled 
                       style="background-color: #edf2f7; text-align: center; font-weight: bold;">
            </div>
            <div class="form-group">
                <label>建築區域 [殿區]</label>
                <select id="area" onchange="updateCodePreview()">
                    <option value="SH" selected>三川殿 (SH)</option>
                    <option value="FL">前殿龍門 (FL)</option>
                    <option value="FR">前殿虎門 (FR)</option>
                    <option value="LC">左下山前廊 (LC)</option>
                    <option value="RC">右下山前廊 (RC)</option>
                    <option value="XL">左下山護室 (XL)</option>
                    <option value="XR">右下山護室 (XR)</option>
                    <option value="GL">左過水廊 (GL)</option>
                    <option value="GR">右過水廊 (GR)</option>
                    <option value="TL">左頂山護室 (TL)</option>
                    <option value="TR">右頂山護室 (TR)</option>
                    <option value="BT">鐘樓 (BT)</option>
                    <option value="DT">鼓樓 (DT)</option>
                    <option value="YH">後殿月老廳 (YH)</option>
                    <option value="HH">後殿華佗廳 (HH)</option>
                    <option value="RL">後殿龍門 (RL)</option>
                    <option value="RR">後殿虎門 (RR)</option>
                    <option value="TH">天上聖母殿 (TH)</option>
                    <option value="GH">關聖帝君殿 (GH)</option>
                    <option value="WH">文昌帝君殿 (WH)</option>
                    <option value="PL">牌樓 (PL)</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>屋面朝向 [方位]</label>
                <select id="direction" onchange="updateCodePreview()">
                    <option value="W" selected>西 West (W)</option>
                    <option value="E">東 East (E)</option>
                    <option value="S">南 South (S)</option>
                    <option value="N">北 North (N)</option>
                </select>
            </div>
        </div>
        <div class="btn-group">
            <a href="index.html" class="btn-home" style="margin-top:0; width:auto; flex:1;">🏠 回目錄</a>
            <button type="button" class="btn-submit" onclick="switchPage(2)">下一步 ➡️</button>
        </div>
    </div>

    <!-- 📄 第二步分頁：詳細數據、工藝形式多選與大打包 -->
    <div id="page2" class="page">
        <h3 style="color:var(--temple-orange); margin-bottom:15px; border-left:4px solid var(--temple-orange); padding-left:8px;">
            第二步：詳細普查數據與影像紀錄
        </h3>
        <div class="form-row">
            <div class="form-group">
                <label>屋面部位</label>
                <select id="roofPos" onchange="updateCodePreview()">
                    <option value="MR" selected>正脊 (MR)</option>
                    <option value="DR">垂脊 (DR)</option>
                    <option value="HR">戧脊 (HR)</option>
                    <option value="ER">圍脊 (ER)</option>
                    <option value="AR">角脊 (AR)</option>
                    <option value="SR">燕尾 (SR)</option>
                    <option value="SD">水車堵 (SD)</option>
                    <option value="GD">山花 (GD)</option>
                    <option value="WD">牆堵 (WD)</option>
                </select>
            </div>
            <div class="form-group">
                <label>構件細部分類</label>
                <select id="compCode" onchange="updateCodePreview()">
                    <option value="01" selected>上馬路 (01)</option>
                    <option value="02">下馬路 (02)</option>
                    <option value="03">三角堵 (03)</option>
                    <option value="04">四寸蓋 (04)</option>
                    <option value="05">印斗 (05)</option>
                    <option value="06">吐水 (06)</option>
                    <option value="07">圭角 (07)</option>
                    <option value="08">西施脊 (08)</option>
                    <option value="09">垂脊 (09)</option>
                    <option value="10">通風脊堵 (10)</option>
                    <option value="11">脊堵 (11)</option>
                    <option value="12">脊塞 (12)</option>
                    <option value="13">脊鎖 (13)</option>
                    <option value="14">脊獸 (14)</option>
                    <option value="15">規帶 (15)</option>
                    <option value="16">排頭 (16)</option>
                    <option value="17">燕尾 (17)</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>作品流水號</label>
                <div class="serial-control">
                    <button type="button" class="serial-nav-btn" onclick="changeSerial(-1)">← 上一個</button>
                    <input type="text" id="serial" value="001" oninput="updateCodePreview()" required>
                    <button type="button" class="serial-nav-btn next" onclick="changeSerial(1)">下一個 →</button>
                </div>

            </div>
            <div class="form-group">
                <label>照片型別+序號</label>
                <input type="text" id="photoType" value="O01" oninput="updateCodePreview()" 
                       required style="font-family: monospace;">
            </div>
        </div>
        
        <div class="form-group">
            <label>工藝形式 [可複選項目]</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="craftBox" value="CP" onchange="updateCodePreview()"> 
                    剪黏工藝 (CP)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="craftBox" value="CS" onchange="updateCodePreview()"> 
                    泥塑工藝 (CS)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="craftBox" value="JP" onchange="updateCodePreview()"> 
                    交趾陶工藝 (JP)
                </label>
            </div>
        </div>
        
        <div class="form-group" style="margin-top: 15px;">
            <label>📷 調查影像 (選填)</label>
            <input type="file" id="photo" accept="image/*">
         
            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" src="" alt="預覽">
            </div>
        </div>
        <div class="form-group" style="margin-top: 15px;">
            <label>📝 題材內容 / 保存狀況備註</label>
            <textarea id="note" rows="2" placeholder="請輸入細部觀察描述..."></textarea>
        </div>
        <div class="btn-group">
            <button type="button" class="btn-nav" onclick="switchPage(1)">⬅️ 返回第一步</button>
            <button type="button" class="btn-submit" id="saveBtn" onclick="saveSurveyRecord()">💾 儲存此筆普查數據</button>
        </div>

        <div class="history">
            <div class="history-header" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; align-items:center;">
                <h2>📝 本次登錄紀錄 (<span id="tempCount">0</span> 筆)</h2>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button type="button" class="btn-sync" onclick="syncPendingRecords()">☁️ 同步待上傳</button>
                    <button type="button" class="btn-export" onclick="downloadBulkPackFile()">📦 匯出 .survey</button>
                </div>
            </div>
            <div id="tempDataList"></div>
        </div>
        <a href="index.html" class="btn-home">🏠 結束登錄，回首頁</a>
    </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// 若你已改用新版 sb_publishable_... key，請把這裡換成 database-test.html 中成功使用的同一把 key。
const SUPABASE_URL = "https://kappwvkerqdsvpgzamnc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthcHB3dmtlcnFkc3ZwZ3phbW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NjUxNDgsImV4cCI6MjEwMjM0MTE0OH0.DlrTO0jeORbVVnuhb0DK5Ufqpsku_eGSrExwVsGqBeA";
const BUCKET = "longshan-photos";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

window.currentSessionRecords = [];
let selectedPhotoFile = null;
let currentUser = null;

// ===== IndexedDB 離線佇列 =====
const DB_NAME = "longshan-survey-offline";
const STORE_NAME = "pending_records";

function openOfflineDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: "localId", autoIncrement: true });
            }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function queueAdd(item) {
    const db = await openOfflineDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).add(item);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}

async function queueAll() {
    const db = await openOfflineDB();
    return new Promise((resolve, reject) => {
        const req = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
    });
}

async function queueDelete(localId) {
    const db = await openOfflineDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).delete(localId);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}

// ===== 編碼 =====
function getSelectedCrafts() {
    const fixedOrder = ["CP", "CS", "JP"];
    const chosen = [...document.querySelectorAll('input[name="craftBox"]:checked')].map(x => x.value);
    return fixedOrder.filter(x => chosen.includes(x));
}

function normalizedSerial() {
    const raw = document.getElementById("serial").value.trim();
    const n = parseInt(raw, 10);
    return Number.isNaN(n) ? raw : String(n).padStart(3, "0");
}

function photoToken() {
    return document.getElementById("photoType").value.trim().toUpperCase().replace(/\s+/g, "");
}

function recordCode() {
    return `LS-${area.value}-${direction.value}-${roofPos.value}-${compCode.value}-${normalizedSerial()}`;
}

function photoCode() {
    return photoToken() ? `${recordCode()}-${photoToken()}` : "";
}

window.updateCodePreview = function() {
    const crafts = getSelectedCrafts();
    recordCodePreview.textContent = recordCode();
    photoCodePreview.textContent = photoCode() ? `照片編號：${photoCode()}` : "照片編號：尚未填寫";
    craftPreview.textContent = crafts.length ? `工藝：${crafts.join("-")}` : "工藝：尚未選擇";
};

window.switchPage = function(num) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById("page" + num).classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
};

// ===== Auth / Network =====
async function refreshAuth() {
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error || !session?.user) {
        currentUser = null;
        authStatus.className = "session-bad";
        authStatus.textContent = "❌ 尚未登入";
        return false;
    }
    currentUser = session.user;
    authStatus.className = "session-ok";
    authStatus.textContent = `✅ 已登入：${session.user.email}`;
    return true;
}

function refreshNetwork() {
    if (navigator.onLine) {
        networkStatus.className = "session-ok";
        networkStatus.textContent = "🟢 線上";
    } else {
        networkStatus.className = "session-off";
        networkStatus.textContent = "🟠 離線模式";
    }
}

async function refreshSyncSummary() {
    const pending = await queueAll();
    syncSummary.textContent = pending.length ? `本機有 ${pending.length} 筆待同步資料。` : "目前沒有待同步資料。";
}

// ===== 照片 metadata =====
function parsePhotoToken(token) {
    const m = token.match(/^([A-Z]+)(\d+)$/);
    return m ? { type: m[1], sequence: parseInt(m[2], 10) } : { type: token || null, sequence: null };
}

function extensionOf(file) {
    const m = (file?.name || "").match(/\.([A-Za-z0-9]+)$/);
    if (m) return m[1].toLowerCase();
    return ((file?.type || "image/jpeg").split("/")[1] || "jpg").replace(/[^a-z0-9]/gi, "");
}

function collectEntry() {
    const crafts = getSelectedCrafts();
    const serial = normalizedSerial();
    const pToken = photoToken();

    if (!serial) throw new Error("請填寫作品流水號。");
    if (!crafts.length) throw new Error("請至少勾選一種工藝形式。");
    if (selectedPhotoFile && !pToken) throw new Error("已選照片時，請填寫照片型別＋序號，例如 O01。");

    document.getElementById("serial").value = serial;
    document.getElementById("photoType").value = pToken;

    const code = recordCode();
    return {
        recordCode: code,
        photoCode: selectedPhotoFile ? photoCode() : "",
        photoToken: pToken,
        record: {
            record_code: code,
            temple_code: "LS",
            area: area.value,
            direction: direction.value,
            roof_position: roofPos.value,
            component_code: compCode.value,
            serial,
            crafts,
            note: note.value.trim() || null
        },
        photoFile: selectedPhotoFile || null,
        createdAtLocal: new Date().toISOString()
    };
}

// ===== 雲端寫入 =====
async function pushToCloud(entry) {
    if (!(await refreshAuth())) throw new Error("登入已失效，請先回 login.html 登入。");

    const { data: row, error: recordError } = await supabase
        .from("survey_records")
        .upsert(entry.record, { onConflict: "record_code" })
        .select("id,record_code")
        .single();

    if (recordError) throw new Error(`作品資料寫入失敗：${recordError.message}`);

    if (entry.photoFile) {
        const ext = extensionOf(entry.photoFile);
        const path = `${entry.record.area}/${entry.recordCode}/${entry.photoCode}.${ext}`;

        const { error: uploadError } = await supabase.storage
            .from(BUCKET)
            .upload(path, entry.photoFile, {
                contentType: entry.photoFile.type || undefined,
                cacheControl: "3600",
                upsert: true
            });

        if (uploadError) throw new Error(`照片上傳失敗：${uploadError.message}`);

        const parsed = parsePhotoToken(entry.photoToken);
        const { error: photoError } = await supabase
            .from("photos")
            .upsert({
                record_id: row.id,
                photo_code: entry.photoCode,
                photo_type: parsed.type,
                sequence_no: parsed.sequence,
                file_name: entry.photoFile.name,
                storage_path: path,
                is_representative: parsed.type === "O"
            }, { onConflict: "photo_code" });

        if (photoError) throw new Error(`照片資料表寫入失敗：${photoError.message}`);
    }

    return row;
}

// ===== 儲存按鈕 =====
window.saveSurveyRecord = async function() {
    let entry;
    try { entry = collectEntry(); }
    catch (err) { alert("❌ " + err.message); return; }

    saveBtn.disabled = true;
    saveBtn.textContent = "⏳ 正在儲存……";

    let status = "pending";
    let statusText = "待同步";
    let errorMessage = "";

    try {
        if (navigator.onLine) {
            await pushToCloud(entry);
            status = "synced";
            statusText = "已同步雲端";
        } else {
            await queueAdd(entry);
            statusText = "離線暫存，待同步";
        }
    } catch (err) {
        console.error(err);
        errorMessage = err.message;
        try {
            await queueAdd(entry);
            statusText = "雲端失敗，已安全暫存在本機";
        } catch (offlineErr) {
            status = "failed";
            statusText = "儲存失敗";
            errorMessage += `；本機暫存亦失敗：${offlineErr.message}`;
        }
    }

    window.currentSessionRecords.push({
        recordCode: entry.recordCode,
        photoCode: entry.photoCode,
        crafts: entry.record.crafts,
        note: entry.record.note,
        photoName: entry.photoFile?.name || "",
        createdAtLocal: entry.createdAtLocal,
        status, statusText, errorMessage
    });

    if (status === "synced") alert(`✅ ${entry.recordCode}\n已成功儲存至 Supabase。`);
    else if (status === "pending") alert(`🟠 ${entry.recordCode}\n${statusText}。`);
    else alert(`❌ ${entry.recordCode}\n${errorMessage}`);

    resetAfterSave();
    refreshTempUIList();
    await refreshSyncSummary();
    saveBtn.disabled = false;
    saveBtn.textContent = "💾 儲存此筆普查數據";
};

function resetAfterSave() {
    note.value = "";
    photo.value = "";
    previewContainer.style.display = "none";
    imagePreview.removeAttribute("src");
    selectedPhotoFile = null;
    document.querySelectorAll('input[name="craftBox"]').forEach(cb => cb.checked = false);
    // 儲存後保留目前流水號，不自動跳號。
    updateCodePreview();
}


window.changeSerial = function(delta) {
    let n = parseInt(serial.value, 10);
    if (Number.isNaN(n)) n = 1;
    n = Math.max(1, n + delta);
    serial.value = String(n).padStart(3, "0");
    updateCodePreview();
};

// ===== Pending 同步 =====
window.syncPendingRecords = async function() {
    if (!navigator.onLine) { alert("❌ 目前仍為離線狀態。"); return; }
    if (!(await refreshAuth())) { alert("❌ 登入已失效，請重新登入。"); return; }

    const pending = await queueAll();
    if (!pending.length) { alert("✅ 沒有待同步資料。"); return; }

    let ok = 0, fail = 0;
    const errors = [];
    for (const item of pending) {
        try {
            await pushToCloud(item);
            await queueDelete(item.localId);
            ok++;
        } catch (err) {
            fail++;
            errors.push(`${item.recordCode}: ${err.message}`);
        }
    }
    await refreshSyncSummary();
    alert(`☁️ 同步完成\n成功：${ok}\n失敗：${fail}${errors.length ? "\n\n" + errors.slice(0,5).join("\n") : ""}`);
};

// ===== 本次紀錄清單 =====
function esc(v) {
    return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function refreshTempUIList() {
    tempCount.textContent = window.currentSessionRecords.length;
    tempDataList.innerHTML = "";
    if (!window.currentSessionRecords.length) {
        tempDataList.innerHTML = "<p style='color:#a0aec0;text-align:center;'>本次尚無登錄紀錄</p>";
        return;
    }

    [...window.currentSessionRecords].reverse().forEach((v, i) => {
        const realIndex = window.currentSessionRecords.length - 1 - i;
        const badge = v.status === "synced" ? "badge-synced" : v.status === "failed" ? "badge-failed" : "badge-pending";
        const cardState = v.status === "synced" ? "synced" : v.status === "failed" ? "failed" : "pending";
        const card = document.createElement("div");
        card.className = `data-card ${cardState}`;
        card.innerHTML = `
            <button type="button" class="delete-btn">✕ 移除清單</button>
            <strong>🔍 ${esc(v.recordCode)}</strong><span class="badge ${badge}">${esc(v.statusText)}</span><br>
            <span style="color:var(--temple-gray);font-size:12px;">🕒 ${new Date(v.createdAtLocal).toLocaleString()} ｜ 🎨 ${esc(v.crafts.join("-"))}</span>
            ${v.photoCode ? `<br><span style="font-size:12px;">📷 ${esc(v.photoCode)} ${v.photoName ? "｜" + esc(v.photoName) : ""}</span>` : ""}
            ${v.note ? `<div style="margin-top:5px;background:#fff;padding:6px;border:1px solid #edf2f7;">📝 ${esc(v.note)}</div>` : ""}
            ${v.errorMessage ? `<div style="margin-top:5px;color:#c53030;font-size:12px;">${esc(v.errorMessage)}</div>` : ""}
        `;
        card.querySelector(".delete-btn").onclick = () => {
            window.currentSessionRecords.splice(realIndex, 1);
            refreshTempUIList();
        };
        tempDataList.appendChild(card);
    });
}

// ===== .survey metadata 備份 =====
window.downloadBulkPackFile = function() {
    if (!window.currentSessionRecords.length) { alert("❌ 本次尚無資料可匯出。"); return; }
    const pack = {
        format: "longshan-survey-v2",
        exportedAt: new Date().toISOString(),
        warning: "此 .survey 保存普查 metadata，不嵌入原始影像；原始影像由 Supabase Storage 或現場原始檔保存。",
        records: window.currentSessionRecords
    };
    const blob = new Blob([JSON.stringify(pack, null, 2)], { type:"application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `龍山寺普查_${area.value}_${new Date().toISOString().slice(0,10)}.survey`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
};

// ===== 事件 =====
[area, direction, roofPos, compCode, serial, photoType].forEach(el => {
    el.addEventListener("input", updateCodePreview);
    el.addEventListener("change", updateCodePreview);
});
document.querySelectorAll('input[name="craftBox"]').forEach(cb => cb.addEventListener("change", updateCodePreview));

photo.addEventListener("change", e => {
    selectedPhotoFile = e.target.files?.[0] || null;
    if (!selectedPhotoFile) { previewContainer.style.display = "none"; return; }
    const url = URL.createObjectURL(selectedPhotoFile);
    imagePreview.src = url;
    previewContainer.style.display = "block";
    imagePreview.onload = () => URL.revokeObjectURL(url);
});

window.addEventListener("online", async () => { refreshNetwork(); await refreshAuth(); await refreshSyncSummary(); });
window.addEventListener("offline", refreshNetwork);

updateCodePreview();
refreshNetwork();
await refreshAuth();
await refreshSyncSummary();
refreshTempUIList();
</script>
