<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品調查表 Word 匯出</title>
<style>
:root {
  --orange:#c4785a;
  --gray:#7a7671;
  --green:#5c634b;
  --bg:#f7f5f2;
  --card:#fff;
  --border:#d7d0c8;
  --text:#2f2d2b;
  --sub:#6b6762;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
}
.wrap{max-width:760px;margin:0 auto}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:28px;
  box-shadow:0 6px 20px rgba(92,99,75,.08);
}
h1{margin:0;color:var(--green);font-size:24px}
.sub{margin-top:8px;color:var(--sub);font-size:14px;line-height:1.7}
.info{
  margin-top:22px;
  padding:16px;
  border:1px solid var(--border);
  background:#faf8f5;
  border-radius:10px;
  line-height:1.8;
}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;color:var(--orange)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button,a.btn{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
}
#downloadBtn{background:var(--orange);color:#fff}
#downloadBtn:disabled{opacity:.45;cursor:not-allowed}
.btn{background:var(--green);color:#fff}
.note{
  margin-top:18px;
  padding:12px 14px;
  border-left:4px solid var(--green);
  background:#f0f2ed;
  color:var(--sub);
  font-size:13px;
  line-height:1.7;
}
#error{margin-top:15px;color:#a5453d;white-space:pre-wrap;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>作品調查表 Word 匯出</h1>
    <div class="sub">從資料庫帶入文字記錄與勾選項目，下載後可直接使用 Microsoft Word 修改。</div>

    <div class="info">
      <div>作品編號：<span id="recordCode" class="code">讀取中……</span></div>
      <div>題材名稱：<span id="titleText">—</span></div>
      <div>輸出格式：<strong>.docx</strong></div>
      <div>影像處理：<strong>所有照片與影像說明欄位保持空白</strong></div>
    </div>

    <div class="actions">
      <button id="downloadBtn" type="button" disabled>下載 Word 調查表</button>
      <a class="btn" href="query.html">返回調查結果資料庫</a>
    </div>

    <div class="note">
      這份 Word 只帶入調查記錄，不會從雲端下載或插入任何照片。部件影像、細部影像、照片檔名與影像說明區域會保留空白，方便後續在 Word 中自行補充。
    </div>
    <div id="error"></div>
  </div>
</div>

const A = v => Array.isArray(v) ? v : [];
const has = (arr,v) => A(arr).includes(v);
const mark = (arr,v,label=v) => `${has(arr,v) ? "■" : "□"} ${label}`;
const radio = (value, expected, label) => `${String(value??"")===String(expected) ? "■" : "□"} ${label}`;
const txt = v => v===null || v===undefined ? "" : String(v).trim();

function formatDateTW(value) {
  if (!value) return "";
  const m = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return txt(value);
  return `${Number(m[1])} 年 ${Number(m[2])} 月 ${Number(m[3])} 日`;
}

function unknownValues(arr, known) {
  return A(arr).filter(v => !known.includes(v));
}

function selectedOther(arr, known) {
  const u = unknownValues(arr,known);
  return u.length ? `■ 其他：${u.join("、")}` : "□ 其他：_____";
}

  const currentStatus = txt(repair.current_status);
  const repair_history_block =

async function loadRecord() {
  if (!recordId) throw new Error("網址缺少作品 id。");

  const { data:{session} } = await supabase.auth.getSession();
  if (!session) throw new Error("請先登入研究人員帳號。");

  const [recordRes, conditionRes, repairRes] = await Promise.all([
    supabase.from("survey_records").select("*").eq("id",recordId).single(),
    supabase.from("condition_records").select("*").eq("record_id",recordId).maybeSingle(),
    supabase.from("repair_records").select("*").eq("record_id",recordId).order("created_at",{ascending:true})
  ]);

  if (recordRes.error) throw recordRes.error;
  if (conditionRes.error) throw conditionRes.error;
  if (repairRes.error) throw repairRes.error;

  const r = recordRes.data;
  document.getElementById("recordCode").textContent = r.record_code || "—";
  document.getElementById("titleText").textContent = r.title || "—";

  payload = buildData(r, conditionRes.data || {}, repairRes.data || []);
  downloadBtn.disabled = false;
}

async function downloadDocx() {
  if (!payload) return;

  downloadBtn.disabled = true;
  downloadBtn.textContent = "正在建立 Word……";
  errorBox.textContent = "";

  try {
    if (!window.PizZip || !window.docxtemplater) {
      throw new Error("Word 匯出元件尚未載入，請重新整理頁面後再試。");
    }

    const templateRes = await fetch("./survey-template.docx", { cache:"no-store" });
    if (!templateRes.ok) throw new Error("找不到 survey-template.docx，請確認檔案已上傳到同一個 GitHub Pages 目錄。");

    const arrayBuffer = await templateRes.arrayBuffer();
    const zip = new window.PizZip(arrayBuffer);

    const doc = new window.docxtemplater(zip, {
      paragraphLoop: true,
      linebreaks: true,
      nullGetter: () => ""
    });

    doc.render(payload);

    const blob = doc.getZip().generate({
      type:"blob",
      mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      compression:"DEFLATE"
    });

    const filename = `作品調查表-${payload.record_code || "作品"}.docx`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);

  } catch (err) {
    console.error(err);
    errorBox.textContent = "❌ " + (err?.message || String(err));
  } finally {
    downloadBtn.disabled = false;
    downloadBtn.textContent = "下載 Word 調查表";
  }
}

downloadBtn.addEventListener("click", downloadDocx);

loadRecord().catch(err => {
  console.error(err);
  errorBox.textContent = "❌ " + (err?.message || String(err));
  document.getElementById("recordCode").textContent = "讀取失敗";
});
</script>
</body>
</html>
