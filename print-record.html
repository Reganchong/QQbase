<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品調查表預覽／列印</title>
<style>
:root{--orange:#c4785a;--gray:#7a7671;--green:#5c634b}
*{box-sizing:border-box}
body{margin:0;background:#e9e6e1;font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;color:#111}
.toolbar{position:sticky;top:0;z-index:100;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid #d7d0c8}
.toolbar a,.toolbar button{border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer}
.back{background:var(--gray);color:#fff}.print{background:var(--orange);color:#fff}.toolbar button:disabled{opacity:.45;cursor:not-allowed}.status{font-size:12px;color:#666}
.preview{padding:14px 0 28px}
.sheet{position:relative;width:612pt;height:792pt;margin:0 auto 16px;background:#fff;box-shadow:0 3px 18px rgba(0,0,0,.16);overflow:hidden;page-break-after:always}
.sheet:last-child{page-break-after:auto}
.sheet canvas{position:absolute;inset:0;width:612pt;height:792pt;z-index:1}
.overlay{position:absolute;z-index:2;color:#000;pointer-events:none}
.text{
  font-size:8.4pt;
  line-height:1.16;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
}
.value{font-weight:500}
.checkmark{
  width:4.3pt;
  height:4.3pt;
  background:#000;
  border-radius:.25pt;
}
.wrap{
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
  overflow:hidden;
}
@media(max-width:900px){.preview{overflow-x:auto}.sheet{margin-left:12px;margin-right:12px}}
@media print{body{background:#fff}.toolbar{display:none!important}.preview{padding:0}.sheet{margin:0;box-shadow:none;width:612pt;height:792pt}@page{size:letter portrait;margin:0}}
</style>
</head>
<body>
<div class="toolbar">
  <a class="back" id="backLink" href="query.html">← 返回資料</a>

<script type="module">

pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

const SUPABASE_URL="https://kappwvkerqdsvpgzamnc.supabase.co";

function pageEl(n){return document.querySelector(`.sheet[data-page="${n}"]`)}
function addText(p,x,y,text,w=100,size=8.4,cls="",h=null){
  if(text===null||text===undefined||text==="")return;

  const el=document.createElement("div");
  const isWrap=String(cls).split(/\s+/).includes("wrap");

  el.className=`overlay text value ${cls}`;
  el.textContent=String(text);
  el.style.left=`${x}pt`;
  el.style.top=`${y}pt`;
  el.style.width=`${w}pt`;
  el.style.fontSize=`${size}pt`;

  // 單行欄位限制在本列高度內；多行欄位由呼叫端指定可用高度。
  if(h!==null){
    el.style.height=`${h}pt`;
    el.style.maxHeight=`${h}pt`;

    if(!isWrap){
      el.style.display="flex";
      el.style.alignItems="center";
    }
  }else if(!isWrap){
    el.style.height=`${Math.max(size*1.35,10)}pt`;
    el.style.maxHeight=`${Math.max(size*1.35,10)}pt`;
  }

  pageEl(p)?.appendChild(el);

  // 單行內容太長時逐步縮小字體，避免跨出表格線。
  if(!isWrap){
    let current=size;
    while(el.scrollWidth>el.clientWidth && current>5.8){
      current-=0.25;
      el.style.fontSize=`${current}pt`;
    }
  }else if(h!==null){
    // 多行內容過多時也適度縮小，直到盡量容納在欄位內。
    let current=size;
    while(el.scrollHeight>el.clientHeight && current>5.8){
      current-=0.25;
      el.style.fontSize=`${current}pt`;
    }
  }
}
function addCheck(p,x,y,on){
  if(!on)return;

  el.className="overlay checkmark";

  // 黑色實心方格比勾號更不易產生上下偏移。
  // 稍微向右、向下內縮，使方格落在原表格的 □ 中央。
  el.style.left=`${x+1.05}pt`;
  el.style.top=`${y+1.20}pt`;

  pageEl(p)?.appendChild(el);
}
async function renderTemplate(){
  const pdf=await pdfjsLib.getDocument(TEMPLATE_PDF).promise;
  $("preview").innerHTML="";
  for(let n=1;n<=pdf.numPages;n++){
    const page=await pdf.getPage(n), viewport=page.getViewport({scale:2.2});
    const sheet=document.createElement("section");sheet.className="sheet";sheet.dataset.page=String(n);
    const canvas=document.createElement("canvas");canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);
    sheet.appendChild(canvas);$("preview").appendChild(sheet);
    await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
  }
}
async function loadRecord(){
  const {data:{session}}=await supabase.auth.getSession(); if(!session) throw new Error("尚未登入，请先登录。");

    supabase.from("condition_records").select("*").eq("record_id",recordId).maybeSingle(),
    supabase.from("repair_records").select("*").eq("record_id",recordId).order("created_at",{ascending:true})
  ]);
  if(e2)throw e2;if(e3)throw e3;
  return {r,c:c||{},repairs:repairs||[]};
}

  const basis=A(r.material_basis);[["現場目視",154.5,265.5],["材料外露",212.7,265.5],["修復報告",271,265.5],["施工紀錄",329.2,265.5],["匠師訪談",387.5,265.5],["材料檢測",445.7,265.5],["歷史文獻",504,265.5]].forEach(([v,x,y])=>addCheck(2,x,y,has(basis,v)));
  const subj=A(r.subject_categories);[["人物",208.5,305.2],["神祇",242.7,305.2],["歷史故事",277,305.2],["戲曲故事",335.2,305.2],["吉祥圖案",393.5,305.2],["動物",451.7,305.2],["植物",486,305.2],["水族",181.5,321.1],["器物",215.7,321.1],["文字",250,321.1],["山水",284.2,322]].forEach(([v,x,y])=>addCheck(2,x,y,has(subj,v)));
  addText(2,155,367,r.subject_description||"",372,8.2,"wrap",316);

  const areaMap={PL:[235.5,87.8],SH:[235.5,102.3],FL:[235.5,116.9],FR:[235.5,131.4],LC:[235.5,145.9],RC:[235.5,160.5],XL:[235.5,175],XR:[235.5,189.6],GL:[235.5,204.1],GR:[235.5,218.7],TL:[235.5,233.2],TR:[235.5,247.8],BT:[235.5,262.3],DT:[235.5,276.9],YH:[235.5,291.4],HH:[235.5,306],RL:[235.5,320.5],RR:[235.5,335.1],TH:[235.5,349.6],GH:[235.5,364.1],WH:[235.5,378.7]};
  if(areaMap[r.area])addCheck(3,...areaMap[r.area],true);

  const sd=A(c.surface_damage);[["汙損",235.5,85.9],["粉化",235.5,98.5],["褪色",235.5,111.2],["龜裂",235.5,123.8],["剝落",235.5,136.5],["起甲",235.5,149.1],["泛鹽",235.5,161.8],["佚失",235.5,174.4]].forEach(([v,x,y])=>addCheck(4,x,y,has(sd,v)));
  const cover=A(c.covering_damage);[["汙損",382.5,85.9],["脫落",382.5,98.5],["碎裂",382.5,111.2],["釉面剝落",382.5,123.8],["褪色",382.5,136.5],["佚失",382.5,149.1]].forEach(([v,x,y])=>addCheck(4,x,y,has(cover,v)));

  const st=A(c.conservation_strategies);[["原狀維護",153,301.1],["現狀保存",153,313.7],["加固處理",153,326.4],["清潔處理",153,339],["表層色層補色",153,351.7],["補缺修復",153,364.3],["局部重塑",153,377],["不當修補材料移除",153,389.6],["原貌復原",153,402.3],["全面重製",153,414.9],["移地保存",153,427.6],["複製替換",153,440.2]].forEach(([v,x,y])=>addCheck(4,x,y,has(st,v)));
  const mr=A(c.material_recommendations);[["傳統材料",153,465.5],["類傳統材料",153,478.2],["現代可逆材料",153,490.8],["原件碎片回貼",153,503.4]].forEach(([v,x,y])=>addCheck(4,x,y,has(mr,v)));

async function init(){
  if(!recordId)throw new Error("网址缺少作品 id。");
  await renderTemplate();
  const {r,c,repairs}=await loadRecord();
  overlayData(r,c,repairs);
  $("backLink").href=`record.html?id=${encodeURIComponent(recordId)}`;
  $("status").textContent=`✅ 預覽完成：${r.record_code}`;
  $("printBtn").disabled=false;
}
$("printBtn").onclick=()=>window.print();

</script>
