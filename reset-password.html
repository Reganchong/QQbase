<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龍山寺普查系統 - 設定密碼</title>
<style>
:root{--orange:#c4785a;--gray:#7a7671;--green:#5c634b;--bg:#f7f5f2;--card:#fff;--soft:#f1ede8;--border:#d7d0c8;--text:#2f2d2b;--sub:#6b6762}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.card{max-width:520px;margin:60px auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:25px;box-shadow:0 5px 18px rgba(92,99,75,.08)}
h1{text-align:center;color:var(--green);font-size:22px;margin:0 0 8px}.sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:20px}
.status{padding:11px;border-radius:9px;background:var(--soft);font-size:13px;margin-bottom:16px;line-height:1.5}
label{display:block;font-weight:700;font-size:13px;color:var(--sub);margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--orange);color:#fff;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.message{margin-top:15px;font-size:13px;line-height:1.55}.ok{color:var(--green)}.bad{color:#a64239}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 設定帳號密碼</h1>
  <div class="sub">新成员邀请与忘记密码流程共用此页面</div>

  <div id="status" class="status">正在验证邀请／重设连结……</div>

  <label>新密码</label>
  <input id="password" type="password" autocomplete="new-password" minlength="8">

  <label>再次输入新密码</label>
  <input id="password2" type="password" autocomplete="new-password" minlength="8">

  <button id="saveBtn" type="button" disabled>設定密碼</button>
  <div id="message" class="message"></div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://kappwvkerqdsvpgzamnc.supabase.co";
const SUPABASE_KEY = "sb_publishable_WIVgXV-WgBcveNX2yvLs8g_Y2tYDomD"; // 换成 login.html 同一把 Publishable key

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
  }
});

const $ = id => document.getElementById(id);

function message(text, ok=false){
  $("message").textContent = text;
  $("message").className = "message " + (ok ? "ok" : "bad");
}

async function waitForSession(){
  // detectSessionInUrl 会处理邀请/恢复链接；稍等一次，再检查 session。
  for(let i=0;i<8;i++){
    const {data:{session}} = await supabase.auth.getSession();
    if(session) return session;
    await new Promise(r=>setTimeout(r,250));
  }
  return null;
}

const session = await waitForSession();

if(session){
  $("status").textContent = "✅ 帐号验证完成：" + (session.user.email || "");
  $("saveBtn").disabled = false;
}else{
  $("status").textContent = "❌ 此邀请／密码重设链接无效、已过期，或未建立登入状态。请重新取得邀请链接。";
  $("saveBtn").disabled = true;
}

$("saveBtn").onclick = async () => {
  const p1 = $("password").value;
  const p2 = $("password2").value;

  if(p1.length < 8){
    message("密码至少需要 8 个字符。");
    return;
  }
  if(p1 !== p2){
    message("两次输入的密码不一致。");
    return;
  }

  $("saveBtn").disabled = true;
  $("saveBtn").textContent = "⏳ 正在储存……";

  const {error} = await supabase.auth.updateUser({ password:p1 });

  if(error){
    message("密码设定失败：" + error.message);
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = "設定密碼";
    return;
  }

  message("✅ 密码设定成功，即将前往登入页面。", true);

  await supabase.auth.signOut();

  setTimeout(()=>{
    location.href = "login.html";
  },1200);
};
</script>
</body>
</html>
