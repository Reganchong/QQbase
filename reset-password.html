<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>艋舺龍山寺普查系統 - 設定密碼</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #1a365d;
      font-size: 22px;
    }
    .sub {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      color: #4a5568;
      font-size: 14px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e0;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,.12);
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px 16px;
      border: 0;
      border-radius: 9px;
      background: #2b6cb0;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      color: #4a5568;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .status.ok {
      color: #276749;
      background: #f0fff4;
      border-color: #c6f6d5;
    }
    .status.err {
      color: #9b2c2c;
      background: #fff5f5;
      border-color: #fed7d7;
    }
    .hint {
      margin-top: 12px;
      color: #718096;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🏛️ 設定登入密碼</h1>
    <div class="sub">艋舺龍山寺屋面傳統裝飾普查系統</div>

    <label for="password">新密碼</label>
    <input id="password" type="password" autocomplete="new-password"
           placeholder="至少 8 個字元" />

    <label for="confirmPassword">再次輸入新密碼</label>
    <input id="confirmPassword" type="password" autocomplete="new-password"
           placeholder="再次輸入相同密碼" />

    <button id="saveBtn" type="button" disabled>儲存新密碼</button>

    <div id="status" class="status">正在確認 Supabase 驗證連結……</div>
    <div class="hint">
      如果顯示驗證連結無效或已過期，請回到 Supabase 重新發送邀請或密碼重設郵件。
    </div>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // =========================================================
    // 只需修改下面兩行
    // 1) Project URL
    // 2) Publishable key（或舊版 anon key）
    // 絕對不要放 service_role / secret key / database password
    // =========================================================
    const SUPABASE_URL = "https://kappwvkerqdsvpgzamnc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WIVgXV-WgBcveNX2yvLs8g_Y2tYDomD";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const statusEl = document.getElementById("status");
    const saveBtn = document.getElementById("saveBtn");
    let sessionReady = false;

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function markReady(session) {
      if (!session) return;
      sessionReady = true;
      saveBtn.disabled = false;
      setStatus(
        "✅ 驗證成功。\n" +
        "帳號：" + (session.user?.email || "已驗證使用者") +
        "\n請設定新的登入密碼。",
        "ok"
      );
    }

    async function initializeAuthFromUrl() {
      try {
        // A. 支援你目前收到的網址格式：
        // #access_token=...&refresh_token=...&type=recovery
        const hashParams = new URLSearchParams(
          window.location.hash.startsWith("#")
            ? window.location.hash.slice(1)
            : window.location.hash
        );

        const accessToken = hashParams.get("access_token");
        const refreshToken = hashParams.get("refresh_token");

        if (accessToken && refreshToken) {
          const { data, error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) throw error;

          // 驗證成功後把 token 從瀏覽器網址列移除
          history.replaceState(
            {},
            document.title,
            window.location.pathname
          );

          markReady(data.session);
          return;
        }

        // B. 支援 PKCE / 新版 redirect ?code=...
        const query = new URLSearchParams(window.location.search);
        const code = query.get("code");

        if (code) {
          const { data, error } =
            await supabase.auth.exchangeCodeForSession(code);

          if (error) throw error;

          history.replaceState(
            {},
            document.title,
            window.location.pathname
          );

          markReady(data.session);
          return;
        }

        // C. 若 SDK 已經自動建立 session
        const {
          data: { session },
          error
        } = await supabase.auth.getSession();

        if (error) throw error;

        if (session) {
          markReady(session);
          return;
        }

        setStatus(
          "❌ 沒有取得有效的 Supabase 驗證工作階段。\n" +
          "請重新從 Supabase 邀請／密碼重設郵件點擊連結進入此頁。",
          "err"
        );
      } catch (err) {
        console.error(err);
        setStatus(
          "❌ 驗證連結處理失敗：\n" +
          (err?.message || String(err)),
          "err"
        );
      }
    }

    // Supabase 官方也會在 password recovery 時送出 PASSWORD_RECOVERY 事件
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        markReady(session);
      }
    });

    saveBtn.addEventListener("click", async () => {
      if (!sessionReady) {
        setStatus("❌ 尚未完成身份驗證。", "err");
        return;
      }

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        setStatus("❌ 新密碼至少需要 8 個字元。", "err");
        return;
      }

      if (password !== confirmPassword) {
        setStatus("❌ 兩次輸入的密碼不一致。", "err");
        return;
      }

      saveBtn.disabled = true;
      setStatus("正在儲存新密碼……");

      const { error } = await supabase.auth.updateUser({
        password
      });

      if (error) {
        saveBtn.disabled = false;
        setStatus("❌ 密碼設定失敗：\n" + error.message, "err");
        return;
      }

      setStatus(
        "✅ 密碼設定成功！\n即將前往登入頁……",
        "ok"
      );

      // 清掉 recovery / invite session，要求用新密碼重新登入
      await supabase.auth.signOut();

      setTimeout(() => {
        window.location.href = "login.html";
      }, 1200);
    });

    initializeAuthFromUrl();
  </script>
</body>
</html>
