<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>普查系統 - 歷史數據查詢</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f5f5f7; color: #1d1d1f; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; margin-bottom: 20px; color: #1a365d; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        .history h2 { font-size: 18px; margin: 0; color: #4a5568; }
        .btn-submit { background-color: #2b6cb0; color: white; padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-export { background-color: #38a169; color: white; padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 8px; }
        .btn-home { background-color: #1a365d; color: white; margin-top: 20px; width: 100%; display: block; text-align: center; text-decoration: none; padding: 15px 0; border-radius: 8px; font-weight: bold; }
        .data-card { background: #f7fafc; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 6px solid #2b6cb0; font-size: 14px; position: relative; }
        .data-card img { max-width: 150px; display: block; margin-top: 10px; border-radius: 6px; }
        .delete-btn { position: absolute; top: 15px; right: 15px; color: #e53e3e; cursor: pointer; font-weight: bold; border: none; background: none; font-size: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📋 導入外部普查檔案檢視</h1>
    
    <div class="history-header">
        <!-- 點擊一次多選導入所有的 .survey 實體檔案 -->
        <button type="button" class="btn-submit" onclick="document.getElementById('importInput').click()">📂 選擇實體檔案還原</button>
        <button type="button" id="exportBtn" class="btn-export">🍏 匯出 Excel (CSV)</button>
    </div>
    <input type="file" id="importInput" multiple accept=".survey" style="display:none;">
    
    <div id="dataList"><p style='color:#a0aec0; text-align:center; padding: 20px 0;'>目前畫面上沒有任何導入數據，請點選上方按鈕選取普查檔。</p></div>
    
    <a href="index.html" class="btn-home">🏠 返回目錄主選單</a>
</div>

<script>
    window.allRecordsSaved = [];

    document.getElementById('importInput').onchange = function(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        window.allRecordsSaved = [];
        let processedCount = 0;

        for (let i = 0; i < files.length; i++) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const record = JSON.parse(evt.target.result);
                    window.allRecordsSaved.push(record);
                } catch(err) {}
                processedCount++;
                if (processedCount === files.length) {
                    renderUIList();
                }
            };
            reader.readAsText(files[i]);
        }
    };

    function renderUIList() {
        const box = document.getElementById('dataList');
        if (!box) return; box.innerHTML = "";
        
        let reversed = [...window.allRecordsSaved].reverse();
        reversed.forEach(val => {
            const card = document.createElement('div');
            card.className = 'data-card';
            card.innerHTML = `
                <button type="button" class="delete-btn" onclick="removeCardView('${val.fullCode}')">❌ 移除</button>
                <strong>🔍 識別編碼：${val.fullCode}</strong><br>
                <span style="color:#718096; font-size:12px;">🕒 普查時間：${val.timestamp}</span><br>
                ${val.note ? `<div style="margin-top:5px; background:#fff; padding:6px; border:1px solid #edf2f7;">📝 備註：${val.note}</div>` : ''}
                ${val.photo ? `<img src="${val.photo}">` : ''}
            `;
            box.appendChild(card);
        });
    }

    window.removeCardView = function(fCode) {
        window.allRecordsSaved = window.allRecordsSaved.filter(item => item.fullCode !== fCode);
        renderUIList();
    };

    // 100% 正確不報錯的大總匯 Excel 導出功能
    document.getElementById('exportBtn').onclick = function() {
        if (window.allRecordsSaved.length === 0) { alert("目前畫面上沒有導入數據！"); return; }
        let csv = "\uFEFF";
        csv += "完整登錄編碼,建築區域,方位,屋面部位,細部分類,流水號,照片序號,工藝,備註,登記時間\n";
        
        window.allRecordsSaved.forEach(r => {
            const row = [
                r.fullCode, r.area, r.direction, r.roofPos, r.compCode,
                r.serial, r.photoType, r.craft, r.note || '', r.timestamp
            ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(",");
            csv += row + "\n";
        });
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `龍山寺普查總統計報表_${new Date().toLocaleDateString()}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };
</script>
</body>
</html>
