<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>調查結果資料庫</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 8px;
            color: #1a365d;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .top-status {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            background: #f7fafc;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 12px;
        }

        .status-ok { color: #276749; font-weight: 700; }
        .status-bad { color: #c53030; font-weight: 700; }

        .filter-panel {
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 700;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            box-sizing: border-box;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        button, .btn-link {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
        }

        .btn-primary {
            background: #2b6cb0;
            color: white;
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn-export {
            background: #38a169;
            color: white;
        }

        .btn-home {
            background: #1a365d;
            color: white;
        }

        .summary-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            margin: 8px 0 14px;
            color: #4a5568;
            font-size: 13px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: white;
            border: 1px solid #cbd5e0;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 980px;
            font-size: 13px;
        }

        th {
            background: #edf2f7;
            color: #2d3748;
            padding: 10px;
            border-bottom: 2px solid #cbd5e0;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            color: #4a5568;
            vertical-align: middle;
        }

        tr:nth-child(even) {
            background: #f7fafc;
        }

        tr.record-row {
            cursor: pointer;
            transition: background 0.15s;
        }

        tr.record-row:hover {
            background: #ebf8ff;
        }

        .code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 700;
            color: #2b6cb0;
            word-break: break-all;
        }

        .craft-badge {
            display: inline-block;
            padding: 3px 7px;
            border-radius: 999px;
            background: #f0fff4;
            color: #276749;
            font-size: 11px;
            font-weight: 700;
            margin: 1px 2px 1px 0;
        }

        .edit-btn {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 7px;
            background: #2b6cb0;
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 12px;
            white-space: nowrap;
        }

        .empty, .loading, .error {
            padding: 34px 16px;
            text-align: center;
            color: #a0aec0;
        }

        .error {
            color: #c53030;
        }

        .pagination {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-top: 16px;
        }

        .pagination button {
            background: #edf2f7;
            color: #2d3748;
        }

        .pagination button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        @media (max-width: 850px) {
            .filter-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 560px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 18px;
            }

            .action-row > * {
                flex: 1;
            }
        }

        .action-cell {
            min-width: 340px;
        }

        .row-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .print-record-btn, .history-btn, .delete-record-btn {
            display: inline-block;
            border: 0;
            border-radius: 7px;
            padding: 6px 10px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .print-record-btn {
            display: inline-block;
            background: #c4785a;
            color: white;
            text-decoration: none;
        }

        .history-btn {
            background: #5c634b;
            color: white;
        }

        .delete-record-btn {
            background: #b8544d;
            color: white;
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(20, 20, 20, .62);
            padding: 18px;
            align-items: center;
            justify-content: center;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-box {
            width: min(760px, 96vw);
            max-height: 88vh;
            overflow: auto;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #d7d0c8;
            box-shadow: 0 18px 45px rgba(0,0,0,.22);
            padding: 20px;
        }

        .modal-box h2 {
            margin: 0 0 8px;
            font-size: 19px;
            color: #5c634b;
        }

        .modal-sub {
            color: #718096;
            font-size: 13px;
            line-height: 1.55;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .modal-actions button {
            flex: none;
        }

        .danger-confirm {
            background: #b8544d;
            color: white;
        }

        .history-list {
            margin-top: 14px;
            display: grid;
            gap: 10px;
        }

        .history-item {
            border: 1px solid #e2e8f0;
            border-left: 5px solid #7a7671;
            border-radius: 9px;
            padding: 11px 12px;
            background: #fbfaf8;
        }

        .history-item.insert { border-left-color: #5c634b; }
        .history-item.update { border-left-color: #c4785a; }
        .history-item.delete { border-left-color: #b8544d; }

        .history-head {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .history-action {
            font-weight: 800;
            font-size: 12px;
        }

        .history-meta {
            color: #718096;
            font-size: 11px;
        }

        .change-list {
            margin-top: 7px;
            font-size: 12px;
            color: #4a5568;
            line-height: 1.55;
        }

        .change-line {
            border-top: 1px dashed #e2e8f0;
            padding-top: 5px;
            margin-top: 5px;
            word-break: break-word;
        }

        .import-summary {
            margin-top: 12px;
            padding: 12px 14px;
            border: 1px solid #d7d0c8;
            border-radius: 9px;
            background: #fbfaf8;
            color: #4a5568;
            font-size: 13px;
            line-height: 1.6;
        }

        .modal-loading {
            padding: 28px 10px;
            text-align: center;
            color: #718096;
        }


        .craft-filter-group {
            grid-column: span 2;
        }

        .craft-filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .craft-filter-item {
            display: flex !important;
            align-items: center;
            gap: 7px;
            margin: 0 !important;
            padding: 9px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background: #fff;
            color: #4a5568 !important;
            font-size: 13px !important;
            font-weight: 600 !important;
            cursor: pointer;
        }

        .craft-filter-item input {
            width: auto;
            margin: 0;
            accent-color: #c4785a;
        }

        @media (max-width: 700px) {
            .craft-filter-group {
                grid-column: span 1;
            }
        }

    
        /* 表格欄寬：優先保留作品編號，操作欄壓縮 */
        table {
            min-width: 1120px;
            table-layout: fixed;
        }

        .col-record { width: 170px; }
        .col-area { width: 92px; }
        .col-direction { width: 52px; }
        .col-roof { width: 72px; }
        .col-component { width: 72px; }
        .col-serial { width: 58px; }
        .col-craft { width: 100px; }
        .col-title { width: 220px; }
        .col-updated { width: 112px; }
        .col-actions { width: 222px; }

        .code {
            word-break: normal;
            overflow-wrap: anywhere;
            line-height: 1.45;
        }

        .action-cell {
            min-width: 0;
        }

        .row-actions {
            display: flex;
            gap: 4px;
            flex-wrap: nowrap;
            align-items: center;
        }

        .edit-btn,
        .print-record-btn,
        .history-btn,
        .delete-record-btn {
            padding: 6px 7px;
            font-size: 11px;
            line-height: 1.15;
        }

        .col-updated {
            font-size: 12px;
            line-height: 1.4;
        }

        @media (max-width: 1200px) {
            .col-title { width: 190px; }
            .col-updated { width: 98px; }
            .col-actions { width: 210px; }

            .edit-btn,
            .print-record-btn,
            .history-btn,
            .delete-record-btn {
                padding: 5px 6px;
                font-size: 10.5px;
            }
        }

    </style>
</head>

<body>
<div class="container">

    <h1>📋 調查結果資料庫</h1>
    <div class="subtitle">艋舺龍山寺屋面傳統裝飾普查資料查詢、檢視與編輯</div>

    <div class="top-status">
        <span id="authStatus">正在確認登入狀態……</span>
        <span id="dbStatus">等待讀取資料庫……</span>
    </div>

    <div class="filter-panel">
        <div class="filter-grid">
            <div class="filter-group">
                <label>關鍵字 / 作品編號</label>
                <input type="text" id="keyword" placeholder="例如 LS-SH-W-MR-11-001">
            </div>

            <div class="filter-group">
                <label>殿區</label>
                <select id="areaFilter">
                    <option value="">全部殿區</option>
                    <option value="SH">三川殿 (SH)</option>
                    <option value="FL">前殿龍門 (FL)</option>
                    <option value="FR">前殿虎門 (FR)</option>
                    <option value="LC">左下山前廊 (LC)</option>
                    <option value="RC">右下山前廊 (RC)</option>
                    <option value="XL">左下山護室 (XL)</option>
                    <option value="XR">右下山護室 (XR)</option>
                    <option value="BT">鐘樓 (BT)</option>
                    <option value="DT">鼓樓 (DT)</option>
                    <option value="GL">左過水廊 (GL)</option>
                    <option value="GR">右過水廊 (GR)</option>
                    <option value="MH">中殿 (MH)</option>
                    <option value="TL">左頂山護室 (TL)</option>
                    <option value="TR">右頂山護室 (TR)</option>
                    <option value="HH">後殿華佗廳 (HH)</option>
                    <option value="YH">後殿月老廳 (YH)</option>
                    <option value="RL">後殿龍門 (RL)</option>
                    <option value="RR">後殿虎門 (RR)</option>
                    <option value="TH">天上聖母殿 (TH)</option>
                    <option value="GH">關聖帝君殿 (GH)</option>
                    <option value="WH">文昌帝君殿 (WH)</option>
                    <option value="PL">牌樓 (PL)</option>
                </select>
            </div>

            <div class="filter-group">
                <label>方位</label>
                <select id="directionFilter">
                    <option value="">全部方位</option>
                    <option value="E">東 (E)</option>
                    <option value="W">西 (W)</option>
                    <option value="S">南 (S)</option>
                    <option value="N">北 (N)</option>
                </select>
            </div>

            <div class="filter-group">
                <label>屋面部位</label>
                <select id="roofFilter">
                    <option value="">全部部位</option>
                    <option value="MR">正脊 (MR)</option>
                    <option value="DR">垂脊 (DR)</option>
                    <option value="HR">戧脊 (HR)</option>
                    <option value="ER">圍脊 (ER)</option>
                    <option value="AR">角脊 (AR)</option>
                    <option value="SR">燕尾 (SR)</option>
                    <option value="SD">水車堵 (SD)</option>
                    <option value="GD">山花 (GD)</option>
                    <option value="WD">牆堵 (WD)</option>
                </select>
            </div>

            <div class="filter-group">
                <label>構件細部</label>
                <select id="componentFilter">
                    <option value="">全部構件</option>
                    <option value="00">無法辨識 (00)</option>
                    <option value="01">上馬路 (01)</option>
                    <option value="02">下馬路 (02)</option>
                    <option value="03">三角堵 (03)</option>
                    <option value="04">水車堵 (04)</option>
                    <option value="05">四寸蓋 (05)</option>
                    <option value="06">印斗 (06)</option>
                    <option value="07">吐水 (07)</option>
                    <option value="08">西施脊 (08)</option>
                    <option value="09">身堵 (09)</option>
                    <option value="10">垂脊 (10)</option>
                    <option value="11">通風脊堵 (11)</option>
                    <option value="12">脊堵 (12)</option>
                    <option value="13">脊塞 (13)</option>
                    <option value="14">脊鎖 (14)</option>
                    <option value="15">脊獸 (15)</option>
                    <option value="16">規帶 (16)</option>
                    <option value="17">排頭 (17)</option>
                    <option value="18">頂堵 (18)</option>
                    <option value="19">墀頭 (19)</option>
                    <option value="20">翹脊 (20)</option>
                </select>
            </div>

            <div class="filter-group craft-filter-group">
                <label>工藝形式（可複選）</label>
                <div class="craft-filter-options">
                    <label class="craft-filter-item">
                        <input type="checkbox" name="craftFilterBox" value="CP">
                        剪黏（CP）
                    </label>
                    <label class="craft-filter-item">
                        <input type="checkbox" name="craftFilterBox" value="CS">
                        泥塑（CS）
                    </label>
                    <label class="craft-filter-item">
                        <input type="checkbox" name="craftFilterBox" value="JP">
                        交趾陶（JP）
                    </label>
                </div>
            </div>

            <div class="filter-group">
                <label>每頁筆數</label>
                <select id="pageSize">
                    <option value="25">25</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                </select>
            </div>
        </div>

        <div class="action-row">
            <button type="button" id="searchBtn" class="btn-primary">🔍 查詢</button>
            <button type="button" id="clearBtn" class="btn-secondary">♻️ 清除條件</button>
            <button type="button" id="importSurveyBtn" class="btn-export">📥 匯入離線資料</button>
            <input type="file" id="importSurveyInput" accept=".survey,application/json" multiple style="display:none;">
            <button type="button" id="exportBtn" class="btn-export">📊 匯出目前查詢</button>
            <a href="index.html" class="btn-link btn-home">🏠 回目錄</a>
        </div>
    </div>

    <div class="summary-bar">
        <span id="resultSummary">尚未讀取資料</span>
        <span>點擊資料列或「編輯」即可進入完整調查表。</span>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th class="col-record">作品編號</th>
                    <th class="col-area">殿區</th>
                    <th class="col-direction">方位</th>
                    <th class="col-roof">屋面部位</th>
                    <th class="col-component">構件</th>
                    <th class="col-serial">流水號</th>
                    <th class="col-craft">工藝形式</th>
                    <th class="col-title">題材名稱</th>
                    <th class="col-updated">最後更新</th>
                    <th class="action-cell col-actions">操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="10" class="loading">正在讀取 Supabase 資料……</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination">
        <button id="prevBtn">← 上一頁</button>
        <span id="pageInfo">第 1 頁</span>
        <button id="nextBtn">下一頁 →</button>
    </div>
</div>

<!-- 刪除確認 -->
<div class="modal-backdrop" id="deleteModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
        <h2 id="deleteTitle">⚠️ 確認刪除作品</h2>
        <div class="modal-sub">
            即將刪除作品 <strong id="deleteCode"></strong>。<br>
            作品主檔、保存狀況、修繕紀錄與照片資料列將一併刪除；
            Storage 中對應照片也會嘗試清除。<br><br>
            <strong style="color:#b8544d;">此操作無法復原。</strong>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancelDeleteBtn">取消</button>
            <button type="button" class="danger-confirm" id="confirmDeleteBtn">確定刪除</button>
        </div>
    </div>
</div>

<!-- 修改紀錄 -->
<div class="modal-backdrop" id="historyModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
        <h2 id="historyTitle">🕘 資料修改紀錄</h2>
        <div class="modal-sub">
            作品：<strong id="historyCode"></strong><br>
            系統會記錄新增、修改及刪除動作，以及操作帳號與時間。
        </div>
        <div id="historyList" class="history-list"></div>
        <div class="modal-actions">
            <button type="button" class="btn-secondary" id="closeHistoryBtn">關閉</button>
        </div>
    </div>
</div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://kappwvkerqdsvpgzamnc.supabase.co";

    const COMPONENT_NAMES = {
        "00":"無法辨識",

    };

    const CRAFT_NAMES = {
        CP: "剪黏", CS: "泥塑", JP: "交趾陶"
    };

    let currentPage = 1;
    let totalCount = 0;
    let currentRows = [];
    let isLoggedIn = false;

    const tableBody = document.getElementById("tableBody");
    const authStatus = document.getElementById("authStatus");
    const dbStatus = document.getElementById("dbStatus");
    const resultSummary = document.getElementById("resultSummary");
    const pageInfo = document.getElementById("pageInfo");

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function localDate(value) {
        if (!value) return "—";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString("zh-TW", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    async function checkSession() {
        const { data: { session }, error } = await supabase.auth.getSession();

        if (error) {
            authStatus.className = "status-bad";
            authStatus.textContent = `❌ Session 錯誤：${error.message}`;
            isLoggedIn = false;
            return false;
        }

        if (!session?.user) {
            authStatus.className = "status-bad";
            authStatus.textContent = "❌ 尚未登入，請先回 login.html";
            isLoggedIn = false;
            return false;
        }

        authStatus.className = "status-ok";
        authStatus.textContent = `✅ 已登入：${session.user.email}`;
        isLoggedIn = true;
        return true;
    }

    function buildQuery() {
        const keyword = document.getElementById("keyword").value.trim();
        const area = document.getElementById("areaFilter").value;
        const direction = document.getElementById("directionFilter").value;
        const roof = document.getElementById("roofFilter").value;
        const component = document.getElementById("componentFilter").value;
        const crafts = [...document.querySelectorAll('input[name="craftFilterBox"]:checked')]
            .map(cb => cb.value);

        let query = supabase
            .from("survey_records")
            .select("*", { count: "exact" });

        if (keyword) {
            const safeKeyword = keyword.replace(/[%(),]/g, "");
            query = query.or(
                `record_code.ilike.%${safeKeyword}%,title.ilike.%${safeKeyword}%,note.ilike.%${safeKeyword}%`
            );
        }

        if (area) query = query.eq("area", area);
        if (direction) query = query.eq("direction", direction);
        if (roof) query = query.eq("roof_position", roof);
        if (component) query = query.eq("component_code", component);

        // crafts 是 text[]。複選時，作品必須同時包含所勾選的工藝。
        if (crafts.length) query = query.contains("crafts", crafts);

        return query;
    }

    async function loadRecords(resetPage = false) {
        if (resetPage) currentPage = 1;

        if (!await checkSession()) {
            tableBody.innerHTML = `
                <tr><td colspan="10" class="error">
                    尚未登入。請先前往 <a href="login.html">login.html</a>。
                </td></tr>`;
            dbStatus.className = "status-bad";
            dbStatus.textContent = "❌ 無法讀取資料庫";
            return;
        }

        tableBody.innerHTML = `
            <tr><td colspan="10" class="loading">📡 正在讀取 Supabase……</td></tr>`;
        dbStatus.className = "";
        dbStatus.textContent = "📡 正在查詢資料……";

        const pageSize = parseInt(document.getElementById("pageSize").value, 10);
        const from = (currentPage - 1) * pageSize;
        const to = from + pageSize - 1;

        const { data, error, count } = await buildQuery()
            .order("updated_at", { ascending: false })
            .range(from, to);

        if (error) {
            console.error(error);
            tableBody.innerHTML = `
                <tr><td colspan="10" class="error">
                    ❌ 查詢失敗：${escapeHtml(error.message)}
                </td></tr>`;
            dbStatus.className = "status-bad";
            dbStatus.textContent = "❌ Supabase 查詢失敗";
            return;
        }

        currentRows = data || [];
        totalCount = count || 0;

        renderRows();

        dbStatus.className = "status-ok";
        dbStatus.textContent = `✅ 資料庫連線正常`;

        const maxPage = Math.max(1, Math.ceil(totalCount / pageSize));
        resultSummary.textContent =
            `符合條件共 ${totalCount} 筆，目前顯示第 ${currentPage} / ${maxPage} 頁。`;

        pageInfo.textContent = `第 ${currentPage} / ${maxPage} 頁`;
        document.getElementById("prevBtn").disabled = currentPage <= 1;
        document.getElementById("nextBtn").disabled = currentPage >= maxPage;
    }

    function renderRows() {
        tableBody.innerHTML = "";

        if (currentRows.length === 0) {
            tableBody.innerHTML = `
                <tr><td colspan="10" class="empty">📭 查無符合條件的普查資料。</td></tr>`;
            return;
        }

        for (const row of currentRows) {
            const crafts = Array.isArray(row.crafts) ? row.crafts : [];
            const craftHtml = crafts.length
                ? crafts.map(code =>
                    `<span class="craft-badge">${escapeHtml(CRAFT_NAMES[code] || code)} (${escapeHtml(code)})</span>`
                  ).join("")
                : "—";

            const editUrl = `record.html?id=${encodeURIComponent(row.id)}`;
            const printUrl = `print-record.html?id=${encodeURIComponent(row.id)}`;

            const tr = document.createElement("tr");
            tr.className = "record-row";
            tr.innerHTML = `
                <td class="code col-record">${escapeHtml(row.record_code)}</td>
                <td class="col-area">${escapeHtml(AREA_NAMES[row.area] || row.area || "—")}</td>
                <td class="col-direction">${escapeHtml(DIRECTION_NAMES[row.direction] || row.direction || "—")}</td>
                <td class="col-roof">${escapeHtml(ROOF_NAMES[row.roof_position] || row.roof_position || "—")}</td>
                <td class="col-component">${escapeHtml(COMPONENT_NAMES[row.component_code] || row.component_code || "—")}</td>
                <td class="col-serial" style="font-family:monospace;">${escapeHtml(row.serial || "—")}</td>
                <td class="col-craft">${craftHtml}</td>
                <td class="col-title">${escapeHtml(row.title || "—")}</td>
                <td class="col-updated">${escapeHtml(localDate(row.updated_at))}</td>
                <td class="action-cell col-actions">
                    <div class="row-actions">
                        <a class="edit-btn" href="${editUrl}">編輯</a>
                        <a class="print-record-btn" href="${printUrl}" target="_blank" rel="noopener">預覽</a>
                        <button class="history-btn" type="button">修改記錄</button>
                        <button class="delete-record-btn" type="button">刪除</button>
                    </div>
                </td>
            `;

            tr.addEventListener("click", (event) => {
                if (event.target.closest("a, button")) return;
                window.location.href = editUrl;
            });

            tr.querySelector(".history-btn").addEventListener("click", (event) => {
                event.stopPropagation();
                openHistory(row);
            });

            tr.querySelector(".delete-record-btn").addEventListener("click", (event) => {
                event.stopPropagation();
                openDeleteConfirm(row);
            });

            tableBody.appendChild(tr);
        }
    }


    let pendingDeleteRow = null;

    const FIELD_LABELS = {
        title: "題材名稱",
        record_code: "作品編號",
        area: "殿區",
        direction: "方位",
        roof_position: "屋面部位",
        component_code: "構件",
        serial: "流水號",
        crafts: "工藝形式",
        note: "備註",
        subject_description: "題材內容",
        period_range: "年代區間",
        artifact_year: "文物紀年",
        inspector: "檢視人員",
        inspection_unit: "檢視單位",
        inspection_date: "檢視日期",
        author_signature: "作者／落款",
        condition_level: "保存狀況分級",
        condition_description: "保存狀況簡述",
        is_representative: "代表照片",
        photo_code: "照片編號",
        photographer: "攝影者",
        taken_at: "攝影時間",
        storage_path: "影像路徑",
        repair_year: "修繕年代",
        artisan: "修繕匠師",
        organization: "修繕單位",
        current_status: "現存狀態"
    };

    function openModal(id) {
        const el = document.getElementById(id);
        el.classList.add("active");
        el.setAttribute("aria-hidden", "false");
    }

    function closeModal(id) {
        const el = document.getElementById(id);
        el.classList.remove("active");
        el.setAttribute("aria-hidden", "true");
    }

    function formatAuditValue(value) {
        if (value === null || value === undefined || value === "") return "—";
        if (Array.isArray(value)) return value.length ? value.join("、") : "—";
        if (typeof value === "object") return JSON.stringify(value);
        if (typeof value === "boolean") return value ? "是" : "否";
        return String(value);
    }

    function getChanges(oldData, newData) {
        const oldObj = oldData || {};
        const newObj = newData || {};
        const keys = new Set([...Object.keys(oldObj), ...Object.keys(newObj)]);
        const ignored = new Set(["updated_at", "created_at"]);

        const changes = [];
        for (const key of keys) {
            if (ignored.has(key)) continue;

            const a = oldObj[key];
            const b = newObj[key];

            if (JSON.stringify(a) === JSON.stringify(b)) continue;

            changes.push({
                key,
                label: FIELD_LABELS[key] || key,
                before: a,
                after: b
            });
        }
        return changes;
    }

    async function openHistory(row) {
        document.getElementById("historyCode").textContent = row.record_code;
        document.getElementById("historyList").innerHTML =
            '<div class="modal-loading">正在讀取修改紀錄……</div>';
        openModal("historyModal");

        const { data, error } = await supabase
            .from("audit_logs")
            .select("*")
            .eq("record_id", row.id)
            .order("created_at", { ascending: false })
            .limit(200);

        const box = document.getElementById("historyList");

        if (error) {
            box.innerHTML = `<div class="error">❌ 讀取修改紀錄失敗：${escapeHtml(error.message)}</div>`;
            return;
        }

        if (!data?.length) {
            box.innerHTML = '<div class="modal-loading">目前尚無修改紀錄。</div>';
            return;
        }

        box.innerHTML = "";

        data.forEach(log => {
            const action = String(log.action || "").toUpperCase();
            const actionText =
                action === "INSERT" ? "新增" :
                action === "UPDATE" ? "修改" :
                action === "DELETE" ? "刪除" : action;

            const item = document.createElement("div");
            item.className = `history-item ${action.toLowerCase()}`;

            const changes = getChanges(log.old_data, log.new_data);

            let detail = "";
            if (action === "UPDATE") {
                detail = changes.length
                    ? changes.slice(0, 30).map(change => `
                        <div class="change-line">
                            <strong>${escapeHtml(change.label)}</strong><br>
                            ${escapeHtml(formatAuditValue(change.before))}
                            → <strong>${escapeHtml(formatAuditValue(change.after))}</strong>
                        </div>
                    `).join("")
                    : '<div class="change-line">資料列已更新。</div>';
            } else if (action === "INSERT") {
                detail = `<div class="change-line">建立 ${escapeHtml(log.table_name || "資料")}。</div>`;
            } else if (action === "DELETE") {
                detail = `<div class="change-line">刪除 ${escapeHtml(log.table_name || "資料")}。</div>`;
            }

            item.innerHTML = `
                <div class="history-head">
                    <span class="history-action">${escapeHtml(actionText)}｜${escapeHtml(log.table_name || "")}</span>
                    <span class="history-meta">${escapeHtml(localDate(log.created_at))}</span>
                </div>
                <div class="history-meta" style="margin-top:4px;">
                    操作帳號：${escapeHtml(log.actor_email || "無法取得")}
                </div>
                <div class="change-list">${detail}</div>
            `;

            box.appendChild(item);
        });
    }

    function openDeleteConfirm(row) {
        pendingDeleteRow = row;
        document.getElementById("deleteCode").textContent = row.record_code;
        document.getElementById("confirmDeleteBtn").disabled = false;
        document.getElementById("confirmDeleteBtn").textContent = "確定刪除";
        openModal("deleteModal");
    }

    async function deleteConfirmedRecord() {
        if (!pendingDeleteRow) return;

        const row = pendingDeleteRow;
        const btn = document.getElementById("confirmDeleteBtn");

        btn.disabled = true;
        btn.textContent = "刪除中……";

        try {
            // SQL function 會在同一個 DB transaction 中刪除所有相關資料列，
            // 並回傳需要從 Storage 清除的檔案路徑。
            const { data: paths, error: deleteError } = await supabase
                .rpc("delete_survey_record", { p_record_id: row.id });

            if (deleteError) throw new Error(deleteError.message);

            const storagePaths = Array.isArray(paths) ? paths.filter(Boolean) : [];

            let storageWarning = "";
            if (storagePaths.length) {
                const { error: storageError } = await supabase.storage
                    .from("longshan-photos")
                    .remove(storagePaths);

                if (storageError) {
                    storageWarning =
                        "\\n\\n⚠️ 資料庫已刪除，但部分 Storage 影像可能尚未清除：" +
                        storageError.message;
                }
            }

            closeModal("deleteModal");
            pendingDeleteRow = null;

            alert(`✅ ${row.record_code} 已刪除。${storageWarning}`);
            await loadRecords();

        } catch (error) {
            console.error(error);
            alert("❌ 刪除失敗：" + error.message);
            btn.disabled = false;
            btn.textContent = "確定刪除";
        }
    }

    document.getElementById("cancelDeleteBtn").addEventListener("click", () => {
        pendingDeleteRow = null;
        closeModal("deleteModal");
    });

    document.getElementById("confirmDeleteBtn").addEventListener("click", deleteConfirmedRecord);
    document.getElementById("closeHistoryBtn").addEventListener("click", () => closeModal("historyModal"));

    document.getElementById("deleteModal").addEventListener("click", event => {
        if (event.target.id === "deleteModal") {
            pendingDeleteRow = null;
            closeModal("deleteModal");
        }
    });

    document.getElementById("historyModal").addEventListener("click", event => {
        if (event.target.id === "historyModal") closeModal("historyModal");
    });



    function parseRecordCode(recordCode) {
        const parts = String(recordCode || "").trim().split("-");
        if (parts.length < 6) return null;

        return {
            temple_code: parts[0] || "LS",
            area: parts[1] || null,
            direction: parts[2] || null,
            roof_position: parts[3] || null,
            component_code: parts[4] || null,
            serial: parts[5] || null
        };
    }

    function normalizeSurveyRecord(item) {
        // v3：log.html 直接保存完整 record 对象。
        if (item?.record && item.record.record_code) {
            return {
                ...item.record,
                crafts: Array.isArray(item.record.crafts)
                    ? item.record.crafts
                    : (Array.isArray(item.crafts) ? item.crafts : [])
            };
        }

        // v2：过去的 .survey 只有 recordCode / crafts / note。
        // 可由作品编号还原核心定位字段。
        if (item?.recordCode) {
            const parsed = parseRecordCode(item.recordCode);
            if (!parsed) return null;

            return {
                record_code: item.recordCode,
                temple_code: parsed.temple_code || "LS",
                area: parsed.area,
                direction: parsed.direction,
                roof_position: parsed.roof_position,
                component_code: parsed.component_code,
                serial: parsed.serial,
                crafts: Array.isArray(item.crafts) ? item.crafts : [],
                note: item.note || null
            };
        }

        // 更旧版：直接储存 area / direction / roofPos / compCode / serial。
        if (item?.area && item?.direction && item?.roofPos && item?.compCode && item?.serial) {
            const recordCode =
                item.record_code ||
                item.recordCode ||
                `LS-${item.area}-${item.direction}-${item.roofPos}-${item.compCode}-${item.serial}`;

            let crafts = item.crafts || item.craft || [];
            if (typeof crafts === "string") {
                crafts = crafts.split(/[-,、\s]+/).filter(Boolean);
            }

            return {
                record_code: recordCode,
                temple_code: "LS",
                area: item.area,
                direction: item.direction,
                roof_position: item.roofPos,
                component_code: item.compCode,
                serial: item.serial,
                crafts: Array.isArray(crafts) ? crafts : [],
                note: item.note || null
            };
        }

        return null;
    }

    function extractSurveyItems(parsed) {
        if (Array.isArray(parsed)) return parsed;
        if (Array.isArray(parsed?.records)) return parsed.records;
        return parsed ? [parsed] : [];
    }

    async function importSurveyFiles(files) {
        if (!files?.length) return;

        if (!await checkSession()) {
            alert("❌ 请先登录研究人员帐号，再汇入离线资料。");
            return;
        }

        const importBtn = document.getElementById("importSurveyBtn");
        importBtn.disabled = true;
        importBtn.textContent = "⏳ 正在匯入……";

        let fileCount = 0;
        let rawCount = 0;
        let validCount = 0;
        let successCount = 0;
        let failedCount = 0;
        const errors = [];

        try {
            for (const file of files) {
                fileCount++;

                let parsed;
                try {
                    parsed = JSON.parse(await file.text());
                } catch (err) {
                    failedCount++;
                    errors.push(`${file.name}：无法解析 JSON`);
                    continue;
                }

                const items = extractSurveyItems(parsed);
                rawCount += items.length;

                for (const item of items) {
                    const record = normalizeSurveyRecord(item);

                    if (!record?.record_code || !record?.area) {
                        failedCount++;
                        errors.push(`${file.name}：发现一笔无法识别的旧格式资料`);
                        continue;
                    }

                    validCount++;

                    const { error } = await supabase
                        .from("survey_records")
                        .upsert(record, { onConflict: "record_code" });

                    if (error) {
                        failedCount++;
                        errors.push(`${record.record_code}：${error.message}`);
                    } else {
                        successCount++;
                    }
                }
            }

            let message =
                `📥 离线 .survey 汇入完成\n\n` +
                `档案：${fileCount} 个\n` +
                `读取：${rawCount} 笔\n` +
                `可识别：${validCount} 笔\n` +
                `成功写入／更新：${successCount} 笔\n` +
                `失败：${failedCount} 笔`;

            if (errors.length) {
                message += `\n\n前几笔错误：\n${errors.slice(0, 8).join("\n")}`;
            }

            alert(message);
            await loadRecords(true);

        } finally {
            importBtn.disabled = false;
            importBtn.textContent = "📥 匯入離線資料";
            document.getElementById("importSurveyInput").value = "";
        }
    }

    document.getElementById("importSurveyBtn").addEventListener("click", () => {
        document.getElementById("importSurveyInput").click();
    });

    document.getElementById("importSurveyInput").addEventListener("change", event => {
        importSurveyFiles([...event.target.files]);
    });


    function clearFilters() {
        document.getElementById("keyword").value = "";
        document.getElementById("areaFilter").value = "";
        document.getElementById("directionFilter").value = "";
        document.getElementById("roofFilter").value = "";
        document.getElementById("componentFilter").value = "";
        document.querySelectorAll('input[name="craftFilterBox"]').forEach(cb => {
            cb.checked = false;
        });
        currentPage = 1;
        loadRecords();
    }

    function csvCell(value) {
        const text = String(value ?? "");
        return `"${text.replaceAll('"', '""')}"`;
    }

    function exportCurrentQuery() {
        if (currentRows.length === 0) {
            alert("目前這一頁沒有可匯出的資料。");
            return;
        }

        let csv = "\uFEFF";

        // 欄位順序依「作品登錄表」：
        // 序號、寺廟識別碼、殿區、方位、屋面部位、構件類別碼、
        // 作品流水號、完整作品識別碼、工藝、題材／內容
        csv += [
            "序號",
            "寺廟識別碼",
            "殿區",
            "方位",
            "屋面部位",
            "構件類別碼",
            "作品流水號",
            "完整作品識別碼",
            "工藝",
            "題材／內容"
        ].map(csvCell).join(",") + "\n";

        currentRows.forEach((row, index) => {
            const crafts = Array.isArray(row.crafts)
                ? row.crafts.join("+")
                : "";

            csv += [
                String(index + 1).padStart(3, "0"),
                row.temple_code || "LS",
                row.area || "",
                row.direction || "",
                row.roof_position || "",
                row.component_code || "",
                String(row.serial || "").padStart(3, "0"),
                row.record_code || "",
                crafts,
                row.title || row.subject_description || ""
            ].map(csvCell).join(",") + "\n";
        });

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = `龍山寺作品登錄表_${new Date().toISOString().slice(0, 10)}.csv`;

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    document.getElementById("searchBtn").onclick = () => loadRecords(true);
    document.getElementById("clearBtn").onclick = clearFilters;
    document.getElementById("exportBtn").onclick = exportCurrentQuery;

    document.getElementById("keyword").addEventListener("keydown", event => {
        if (event.key === "Enter") {
            loadRecords(true);
        }
    });

    document.getElementById("pageSize").onchange = () => loadRecords(true);

    document.getElementById("prevBtn").onclick = () => {
        if (currentPage > 1) {
            currentPage--;
            loadRecords();
        }
    };

    document.getElementById("nextBtn").onclick = () => {
        const pageSize = parseInt(document.getElementById("pageSize").value, 10);
        const maxPage = Math.max(1, Math.ceil(totalCount / pageSize));

        if (currentPage < maxPage) {
            currentPage++;
            loadRecords();
        }
    };

    await loadRecords(true);
</script>
