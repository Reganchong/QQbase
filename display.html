<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龍山寺傳統裝飾互動展示機</title>
    <style>
        body { font-family: -apple-system, sans-serif; 
        background-color: #111827; color: #f9fafb; 
        margin: 0; padding: 0; overflow: hidden; }
        
        /* 頂部控制列 */
        .top-bar { background: #1f2937; padding: 15px 20px; 
        display: flex; justify-content: space-between; 
        align-items: center; border-bottom: 3px solid #ffbc0d; }
        .top-bar h1 { margin: 0; font-size: 20px; color: #ffbc0d; }
        .btn-import { background: #ffbc0d; color: #111827; 
        padding: 8px 16px; border: none; border-radius: 20px; 
        font-weight: bold; cursor: pointer; }
        .btn-home { color: #9ca3af; text-decoration: none; 
        font-size: 14px; font-weight: bold; }
        
        /* 🍔 麥當勞式主體雙欄佈局 */
        .main-layout { display: flex; 
        height: calc(100vh - 58px); }
        
        /* 左側大類別列（麥當勞點心飲料列） */
        .sidebar { width: 110px; background: #1f2937; 
        display: flex; flex-direction: column; 
        border-right: 1px solid #374151; overflow-y: auto; }
        .category-btn { padding: 20px 10px; text-align: center; 
        cursor: pointer; border-bottom: 1px solid #374151; 
        transition: all 0.2s; -webkit-user-select: none; }
        .category-btn.active { background: #ffbc0d; color: #111827; 
        font-weight: bold; }
        .category-btn .icon { font-size: 24px; display: block; 
        margin-bottom: 5px; }
        .category-btn .text { font-size: 12px; }
        
        /* 右側物件網格顯示區（麥當勞商品點選區） */
        .content-grid { flex: 1; padding: 20px; overflow-y: auto; 
        display: grid; grid-template-columns: repeat(auto-fill, 
        minmax(160px, 1fr)); gap: 16px; align-content: start; }
        
        /* 商品卡片樣式 */
        .item-card { background: #1f2937; border-radius: 12px; 
        overflow: hidden; cursor: pointer; border: 2px solid transparent; 
        transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .item-card:active { transform: scale(0.97); }
        .item-card .img-box { width: 100%; height: 120px; 
        background: #374151; overflow: hidden; display: flex; 
        align-items: center; justify-content: center; }
        .item-card .img-box img { width: 100%; height: 100%; 
        object-fit: cover; }
        .item-card .img-box .no-pic { color: #6b7280; font-size: 12px; }
        .item-card .info-box { padding: 12px; text-align: center; }
        .item-card .info-box .code { font-family: monospace; 
        font-weight: bold; color: #ffbc0d; font-size: 14px; }
        .item-card .info-box .title { font-size: 11px; color: #9ca3af; 
        margin-top: 4px; overflow: hidden; text-overflow: ellipsis; 
        white-space: nowrap; }
        
        /* 彈出詳細視窗 (Modal) */
        .modal { display: none; position: fixed; top: 0; left: 0; 
        width: 100%; height: 100%; background: rgba(0,0,0,0.85); 
        align-items: center; justify-content: center; z-index: 100; p; }
        .modal.active { display: flex; }
        .modal-container { background: #1f2937; width: 90%; 
        max-width: 500px; border-radius: 16px; overflow: hidden; 
        border: 2px solid #ffbc0d; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; 
        background: #ffbc0d; color: #111827; border: none; 
        width: 32px; height: 32px; border-radius: 50%; 
        font-weight: bold; font-size: 18px; cursor: pointer; }
        .modal-img { width: 100%; max-height: 250px; 
        object-fit: cover; background: #111827; }
        .modal-body { padding: 20px; }
        .modal-title { font-size: 22px; color: #ffbc0d; 
        font-family: monospace; margin: 0 0 15px 0; }
        .modal-meta { display: grid; grid-template-columns: 1fr 1fr; 
        gap: 10px; font-size: 14px; margin-bottom: 15px; 
        border-bottom: 1px solid #374151; padding-bottom: 15px; }
        .meta-label { color: #9ca3af; }
        .meta-val { color: #f9fafb; font-weight: bold; }
        .modal-note { background: #111827; padding: 12px; 
        border-radius: 8px; font-size: 14px; color: #cbd5e1; 
        line-height: 1.5; max-height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- 頂部列 -->
    <div class="top-bar">
        <a href="index.html" class="btn-home">⬅ 離開展示</a>
        <h1>🏛️ 龍山寺文資互動導覽機</h1>
        <button type="button" class="btn-import" 
        onclick="document.getElementById('displayImport').click()">
        📂 導入數據包</button>
    </div>
    <input type="file" id="displayImport" accept=".survey" 
    style="display:none;">

    <!-- 🍔 主體點餐機排版 -->
    <div class="main-layout">
        <!-- 左欄：殿區大類別切換 -->
        <div class="sidebar" id="sidebarMenu">
            <div class="category-btn active" onclick="window.filterArea('SH')">
                <span class="icon">⛩️</span><span class="text">三川殿</span>
            </div>
            <div class="category-btn" onclick="window.filterArea('FL')">
                <span class="icon">🐉</span><span class="text">前殿龍門</span>
            </div>
            <div class="category-btn" onclick="window.filterArea('FR')">
                <span class="icon">🐯</span><span class="text">前殿虎門</span>
            </div>
            <div class="category-btn" onclick="window.filterArea('RL')">
                <span class="icon">🚪</span><span class="text">後殿龍門</span>
            </div>
            <div class="category-btn" onclick="window.filterArea('RR')">
                <span class="icon">🚪</span><span class="text">後殿虎門</span>
            </div>
            <div class="category-btn" onclick="window.filterArea('TH')">
                <span class="icon">媽</span><span class="text">聖母殿</span>
            </div>
        </div>

        <!-- 右欄：商品卡片展示網格 -->
        <div class="content-grid" id="contentGrid">
            <div style="grid-column: 1/-1; text-align: center; 
            color: #6b7280; padding-top: 50px;">
                💡 請先點擊右上角導入調查打包檔案 (.survey)
            </div>
        </div>
    </div>

    <!-- 🍔 商品放大檢視彈窗 -->
    <div class="modal" id="detailModal" onclick="window.closeDetail()">
        <div class="modal-container" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="window.closeDetail()">×</button>
            <img id="mImg" class="modal-img" src="" alt="文資影像">
            <div class="modal-body">
                <div id="mCode" class="modal-title"></div>
                <div class="modal-meta">
                    <div><span class="meta-label">屋面部位:</span> 
                         <span id="mRoof" class="meta-val"></span></div>
                    <div><span class="meta-label">細部分類:</span> 
                         <span id="mComp" class="meta-val"></span></div>
                    <div><span class="meta-label">朝向方位:</span> 
                         <span id="mDir" class="meta-val"></span></div>
                    <div><span class="meta-label">形式工藝:</span> 
                         <span id="mCraft" class="meta-val"></span></div>
                </div>
                <div id="mNote" class="modal-note"></div>
            </div>
        </div>
    </div>
<script>
    window.displayRecords = [];
    window.currentSelectedArea = 'SH';

    // --- 🚀 核心優化：點餐機數據導入解析引擎 ---
    document.getElementById('displayImport').onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const parsed = JSON.parse(evt.target.result);
                // 自動相容單檔與大打包包
                window.displayRecords = Array.isArray(parsed) ? parsed : [parsed];
                alert(`🎉 成功載入展示數據！共偵測到 ${window.displayRecords.length} 個文資物件。`);
                window.filterArea(window.currentSelectedArea); // 實時刷畫面
            } catch(err) { alert("檔案讀取錯誤！"); }
        };
        reader.readAsText(file);
    };

    // --- 🚀 核心優化：麥當勞式點選大類別（過濾殿區） ---
    window.filterArea = function(areaCode) {
        window.currentSelectedArea = areaCode;
        
        // 更新左側大按鈕的 active 亮色狀態
        const buttons = document.querySelectorAll('.category-btn');
        buttons.forEach(btn => {
            if (btn.getAttribute('onclick').includes(`'${areaCode}'`)) {
                btn.classList.add('active');
            } else { btn.classList.remove('active'); }
        });

        // 篩選出目前選定殿區的卡片資料
        const filtered = window.displayRecords.filter(r => r.area === areaCode);
        const grid = document.getElementById('contentGrid');
        if (!grid) return; grid.innerHTML = "";

        if (filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; 
            color:#6b7280; padding-top:5px;"> Empty 📋 該區域目前尚無普查物件資料</div>`;
            return;
        }

        // 循環建立麥當勞商品卡片
        filtered.forEach(r => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => window.openDetail(r); // 點擊看商品詳細
            
            card.innerHTML = `
                <div class="img-box">
                    ${r.photo ? `<img src="${r.photo}">` : 
                    '<span class="no-pic">📷 現場無拍照</span>'}
                </div>
                <div class="info-box">
                    <div class="code">${r.prefix}-${r.area}-${r.serial}</div>
                    <div class="title">工藝：${r.craft} | 方位：${r.direction}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    };

    // --- 🚀 核心優化：點擊商品彈出滿版大視窗檢視 ---
    window.openDetail = function(r) {
        document.getElementById('mImg').src = r.photo || "";
        document.getElementById('mImg').style.display = r.photo ? "block" : "none";
        document.getElementById('mCode').innerText = r.fullCode;
        document.getElementById('mRoof').innerText = r.roofPos;
        document.getElementById('mComp').innerText = r.compCode;
        document.getElementById('mDir').innerText = r.direction;
        document.getElementById('mCraft').innerText = r.craft;
        document.getElementById('mNote').innerText = 
            r.note ? `📝 調查描述：${r.note}` : "📝 調查備註：現場無特別描述。";
        
        document.getElementById('detailModal').classList.add('active');
    };

    window.closeDetail = function() {
        document.getElementById('detailModal').classList.remove('active');
    };
</script>
</body>
</html>
