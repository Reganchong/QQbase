<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龍山寺傳統裝飾互動展示機</title>
    <!-- 這裡稍後會置入第二部分的 CSS 樣式表 -->
    <style>

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #111827;
        color: #f9fafb;
        margin: 0; padding: 0; overflow: hidden;
    }
    .top-bar {
        background: #1f2937; padding: 15px 20px;
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 3px solid #ffbc0d;
    }
    .top-bar h1 { margin: 0; font-size: 20px; color: #ffbc0d; flex-grow: 1; text-align: center; }
    .btn-group { display: flex; gap: 10px; align-items: center; }
    .btn-import { background: #ffbc0d; color: #111827; padding: 8px 16px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-refresh {
        background: #374151; color: #ffbc0d; padding: 8px 14px; border: 1px solid #ffbc0d;
        border-radius: 20px; font-weight: bold; cursor: pointer; display: none; transition: all 0.2s;
    }
    .btn-refresh:active { background: #4b5563; transform: scale(0.95); }
    .btn-home { color: #9ca3af; text-decoration: none; font-size: 14px; font-weight: bold; min-width: 80px; }
    .main-layout { display: flex; height: calc(100vh - 58px); }
    .sidebar { width: 140px; background: #1f2937; display: flex; flex-direction: column; border-right: 1px solid #374151; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .category-btn { padding: 16px 8px; text-align: center; cursor: pointer; border-bottom: 1px solid #374151; transition: all 0.2s; -webkit-user-select: none; display: none; }
    .category-btn.active { background: #ffbc0d; color: #111827; font-weight: bold; }
    .category-btn .text { font-size: 12px; display: block; line-height: 1.4; }
    .content-grid { flex: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; transition: opacity 0.15s ease-in-out; }
    .item-card { background: #1f2937; border-radius: 12px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .item-card:active { transform: scale(0.97); }
    .item-card .img-box { width: 100%; height: 120px; background: #374151; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .item-card .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .item-card .img-box .no-pic { color: #6b7280; font-size: 12px; }
    .item-card .info-box { padding: 12px; text-align: center; }
    .item-card .info-box .code { font-family: monospace; font-weight: bold; color: #ffbc0d; font-size: 14px; }
    .item-card .info-box .title { font-size: 11px; color: #9ca3af; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-container { background: #1f2937; width: 90%; max-width: 500px; border-radius: 16px; overflow: hidden; border: 2px solid #ffbc0d; position: relative; }
    .modal-close { position: absolute; top: 15px; right: 15px; background: #ffbc0d; color: #111827; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; font-size: 18px; cursor: pointer; }
    .modal-img { width: 100%; max-height: 250px; object-fit: cover; background: #111827; }
    .modal-body { padding: 20px; }
    .modal-title { font-size: 22px; color: #ffbc0d; font-family: monospace; margin: 0 0 15px 0; }
    .modal-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; margin-bottom: 15px; border-bottom: 1px solid #374151; padding-bottom: 15px; }
    .meta-label { color: #9ca3af; }
    .meta-val { color: #f9fafb; font-weight: bold; }
    .modal-note { background: #111827; padding: 12px; border-radius: 8px; font-size: 14px; color: #cbd5e1; line-height: 1.5; }
</style>


</head>
<body>


    <!-- 頂部功能列 -->
<div class="top-bar">
    <a href="index.html" class="btn-home">⬅ 離開展示</a>
    <h1>🏛️ 龍山寺文資互動展示機</h1>
    <div class="btn-group">
        <!-- 🔄 重新整理按鈕：初始隱藏，導入成功後自動亮起 -->
        <button type="button" id="btnRefresh" class="btn-refresh" onclick="window.refreshDisplay()">🔄 重新整理</button>
        <button type="button" class="btn-import" onclick="document.getElementById('displayImport').click()">📂 導入數據包</button>
    </div>
</div>

<!-- 隱藏的實體檔案上傳控制項 -->
<input type="file" id="displayImport" accept=".survey" style="display:none;">

<!-- 主版面配置 -->
<div class="main-layout">
    <!-- 左欄：20 個官方學術殿區選單（初始全隱藏，靠 JS 依據資料包動態點亮） -->
    <div class="sidebar" id="sidebarMenu">
        <div class="category-btn" id="btn-SH" onclick="window.filterArea('SH')"><span class="text">三川殿<br>(SH)</span></div>
        <div class="category-btn" id="btn-FL" onclick="window.filterArea('FL')"><span class="text">前殿龍門<br>(FL)</span></div>
        <div class="category-btn" id="btn-FR" onclick="window.filterArea('FR')"><span class="text">前殿虎門<br>(FR)</span></div>
        <div class="category-btn" id="btn-LC" onclick="window.filterArea('LC')"><span class="text">左下山前廊<br>(LC)</span></div>
        <div class="category-btn" id="btn-RC" onclick="window.filterArea('RC')"><span class="text">右下山前廊<br>(RC)</span></div>
        <div class="category-btn" id="btn-XL" onclick="window.filterArea('XL')"><span class="text">左下山護室<br>(XL)</span></div>
        <div class="category-btn" id="btn-XR" onclick="window.filterArea('XR')"><span class="text">右下山護室<br>(XR)</span></div>
        <div class="category-btn" id="btn-GL" onclick="window.filterArea('GL')"><span class="text">左過水廊<br>(GL)</span></div>
        <div class="category-btn" id="btn-GR" onclick="window.filterArea('GR')"><span class="text">右過水廊<br>(GR)</span></div>
        <div class="category-btn" id="btn-TL" onclick="window.filterArea('TL')"><span class="text">左頂山護室<br>(TL)</span></div>
        <div class="category-btn" id="btn-TR" onclick="window.filterArea('TR')"><span class="text">右頂山護室<br>(TR)</span></div>
        <div class="category-btn" id="btn-BT" onclick="window.filterArea('BT')"><span class="text">鐘樓<br>(BT)</span></div>
        <div class="category-btn" id="btn-DT" onclick="window.filterArea('DT')"><span class="text">鼓樓<br>(DT)</span></div>
        <div class="category-btn" id="btn-YH" onclick="window.filterArea('YH')"><span class="text">後殿月老廳<br>(YH)</span></div>
        <div class="category-btn" id="btn-HH" onclick="window.filterArea('HH')"><span class="text">後殿華佗廳<br>(HH)</span></div>
        <div class="category-btn" id="btn-RL" onclick="window.filterArea('RL')"><span class="text">後殿龍門<br>(RL)</span></div>
        <div class="category-btn" id="btn-RR" onclick="window.filterArea('RR')"><span class="text">後殿虎門<br>(RR)</span></div>
        <div class="category-btn" id="btn-TH" onclick="window.filterArea('TH')"><span class="text">聖母殿<br>(TH)</span></div>
        <div class="category-btn" id="btn-GH" onclick="window.filterArea('GH')"><span class="text">關帝殿<br>(GH)</span></div>
        <div class="category-btn" id="btn-WH" onclick="window.filterArea('WH')"><span class="text">文昌殿<br>(WH)</span></div>
        <div class="category-btn" id="btn-PL" onclick="window.filterArea('PL')"><span class="text">牌樓<br>(PL)</span></div>
    </div>
    
    <!-- 右欄：內容卡片展示格 -->
    <div class="content-grid" id="contentGrid">
        <div style="grid-column:1/-1; text-align:center; color:#6b7280; padding-top:50px;">💡 請先點擊右上角導入普查打包檔案 (.survey)</div>
    </div>
</div>

<!-- 全螢幕詳情放大視窗 -->
<div class="modal" id="detailModal" onclick="window.closeDetail()">
    <div class="modal-container" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="window.closeDetail()">×</button>
        <img id="mImg" class="modal-img" src="">
        <div class="modal-body">
            <div id="mCode" class="modal-title"></div>
            <div class="modal-meta">
                <div><span class="meta-label">屋面部位:</span> <span id="mRoof" class="meta-val"></span></div>
                <div><span class="meta-label">細部分類:</span> <span id="mComp" class="meta-val"></span></div>
                <div><span class="meta-label">朝向方位:</span> <span id="mDir" class="meta-val"></span></div>
                <div><span class="meta-label">形式工藝:</span> <span id="mCraft" class="meta-val"></span></div>
            </div>
            <div id="mNote" class="modal-note"></div>
        </div>
    </div>
</div>


    <!-- 這裡稍後會置入第三部分的 JavaScript 核心邏輯 -->
   <script>
    window.displayRecords = [];
    window.currentSelectedArea = '';

    // --- 🚀 新增：標準 CSV 解析器（處理引號與逗號拆分） ---
    function parseCSV(text) {
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
        if (lines.length === 0) return [];

        // 讀取第一行作為欄位標題
        const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());

        const result = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i];
            const row = [];
            let insideQuote = false;
            let currentField = "";

            // 精準拆分含雙引號的 CSV 欄位
            for (let j = 0; j < line.length; j++) {
                const char = line[j];
                if (char === '"') {
                    insideQuote = !insideQuote;
                } else if (char === ',' && !insideQuote) {
                    row.push(currentField.trim());
                    currentField = "";
                } else {
                    currentField += char;
                }
            }
            row.push(currentField.trim());

            // 對齊中文標題並組裝成物件
            const obj = {};
            headers.forEach((header, index) => {
                let val = row[index] || "";
                // 去除可能殘留的外層雙引號
                val = val.replace(/^"|"$/g, '').trim(); 
                obj[header] = val;
            });
            result.push(obj);
        }
        return result;
    }

    // --- 1. 數據上傳監聽器（CSV 版） ---
    document.getElementById('displayImport').onchange = function(e) {
        const file = e.target.files; 
        if (!file || file.length === 0) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const rawText = evt.target.result;
                const parsedCSV = parseCSV(rawText);

                if (parsedCSV.length === 0) {
                    alert("❌ 檔案解析失敗：檔案內容可能為空或不符合標準格式。");
                    return;
                }

                // 2. 對齊對應您 Survey 的中文欄位
                window.displayRecords = parsedCSV.map(item => {
                    return {
                        fullCode: item["完整登錄編碼"] || "LS-ERROR",
                        area: String(item["建築區域"] || "").toUpperCase().trim(),
                        direction: item["方位"] || "？",
                        roofPos: item["屋面部位"] || "？",
                        compCode: item["細部分類"] || "？",
                        serial: item["流水號"] || "000",
                        photoSeq: item["照片序號"] || "",
                        craft: item["工藝形式"] || "？",
                        note: item["備註"] || "",
                        // 照片路徑防呆：如果您的照片名叫 "O01.jpg" 可以依此動態組合，目前預設改為相機圖
                        photo: "" 
                    };
                });

                alert(`🎉 數據包成功解包！\n共成功解析顯示 ${window.displayRecords.length} 筆普查紀錄。`);
                
                // 自動重整渲染
                window.refreshDisplay(true);
                
            } catch(err) { 
                alert("❌ 檔案結構與解析模組不符！"); 
                console.error(err);
            }
        };
        reader.readAsText(file);
    };

    // --- 2. 核心重整與強制渲染機制 ---
    window.refreshDisplay = function(isAutoTrigger = false) {
        if (!window.displayRecords || window.displayRecords.length === 0) {
            if(!isAutoTrigger) alert("📋 目前尚未載入任何數據，請先導入 .survey 檔案。");
            return;
        }

        document.getElementById('btnRefresh').style.display = 'block';

        const existingAreas = new Set();
        window.displayRecords.forEach(r => {
            if (r.area) existingAreas.add(r.area);
        });

        // 點亮有資料的按鈕選單
        document.querySelectorAll('.category-btn').forEach(btn => {
            const areaId = btn.id.replace('btn-', '');
            if (existingAreas.has(areaId)) {
                btn.style.display = 'block'; 
            } else {
                btn.style.display = 'none';  
                btn.classList.remove('active');
            }
        });

        if (existingAreas.size > 0) {
            const areaArray = Array.from(existingAreas);
            if (!window.currentSelectedArea || !existingAreas.has(window.currentSelectedArea)) {
                window.currentSelectedArea = areaArray[0];
            }
            
            window.filterArea(window.currentSelectedArea);
            
            if(!isAutoTrigger) {
                const grid = document.getElementById('contentGrid');
                grid.style.opacity = '0.3';
                setTimeout(() => grid.style.opacity = '1', 150);
            }
        } else {
            document.getElementById('contentGrid').innerHTML = 
                `<div style="grid-column:1/-1; text-align:center; color:#6b7280; padding-top:50px;">📋 此檔案不含任何有效的區域數據</div>`;
        }
    };

    // --- 3. 殿區卡片過濾與網格渲染 ---
    window.filterArea = function(areaCode) {
        window.currentSelectedArea = areaCode;
        
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById('btn-' + areaCode);
        if (activeBtn) activeBtn.classList.add('active');

        const filtered = window.displayRecords.filter(r => r.area === areaCode);
        const grid = document.getElementById('contentGrid'); if (!grid) return; grid.innerHTML = "";

        if (filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#6b7280; padding-top:50px; font-size:14px;">📋 該區域目前無數據</div>`;
            return;
        }

        filtered.forEach(r => {
            const card = document.createElement('div'); card.className = 'item-card';
            card.onclick = () => window.openDetail(r);
            card.innerHTML = `
                <div class="img-box">${r.photo ? `<img src="${r.photo}">` : '<span class="no-pic">📷 無影像</span>'}</div>
                <div class="info-box">
                    <div class="code">${r.fullCode}</div>
                    <div class="title">方位：${r.direction} | 流水：${r.serial}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    };

    // --- 4. 觸控放大詳細視窗控制 ---
    window.openDetail = function(r) {
        const imgEl = document.getElementById('mImg');
        imgEl.src = r.photo || ""; 
        imgEl.style.display = r.photo ? "block" : "none";
        
        document.getElementById('mCode').innerText = r.fullCode;
        document.getElementById('mRoof').innerText = r.roofPos;
        document.getElementById('mComp').innerText = r.compCode;
        document.getElementById('mDir').innerText = r.direction;
        document.getElementById('mCraft').innerText = r.craft; 
        
        document.getElementById('mNote').innerText = r.note ? `📝 調查描述：${r.note}` : "📝 現場無詳細描述。";
        document.getElementById('detailModal').classList.add('active');
    };

    window.closeDetail = function() { 
        document.getElementById('detailModal').classList.remove('active'); 
    };

    // --- 5. 初始載入安全防禦鎖 ---
    window.onload = function() {
        document.querySelectorAll('.category-btn').forEach(btn => btn.style.display = 'none');
        document.getElementById('btnRefresh').style.display = 'none'; 
    };
</script>


</body>
</html>
