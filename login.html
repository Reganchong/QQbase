<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龍山寺普查系統 - 登入</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 30px 15px;
            color: #1d1d1f;
        }

        .login-box {
            max-width: 420px;
            margin: 80px auto;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            font-size: 22px;
            color: #1a365d;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2b6cb0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2c5282;
        }

        #status {
            margin-top: 16px;
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
            font-size: 13px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🏛️ 艋舺龍山寺普查系統</h1>

    <label>Email</label>
    <input
        type="email"
        id="email"
        placeholder="請輸入研究人員 Email"
    >

    <label>密碼</label>
    <input
        type="password"
        id="password"
        placeholder="請輸入密碼"
    >

    <button id="loginBtn">
        登入系統
    </button>

    <div id="status">
        尚未登入
    </div>

</div>


<script type="module">

    import { supabase } from "./supabase-client.js";
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // ==========================================
    // 請替換成你自己的 Supabase 資料
    // ==========================================

    const SUPABASE_URL =
        "https://kappwvkerqdsvpgzamnc.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_WIVgXV-WgBcveNX2yvLs8g_Y2tYDomD";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const statusEl =
        document.getElementById("status");


    document.getElementById("loginBtn")
    .onclick = async function () {

        const email =
            document.getElementById("email")
            .value.trim();

        const password =
            document.getElementById("password")
            .value;


        if (!email || !password) {

            statusEl.innerText =
                "❌ 請輸入 Email 與密碼";

            return;
        }


        statusEl.innerText =
            "📡 正在登入 Supabase...";


        const {
            data,
            error
        } =
        await supabase.auth.signInWithPassword({

            email: email,
            password: password

        });


        if (error) {

            statusEl.style.color = "#c53030";

            statusEl.innerText =
                "❌ 登入失敗\n\n" +
                error.message;

            return;
        }


        statusEl.style.color = "#2f855a";

        statusEl.innerText =
            "✅ 登入成功\n\n" +
            data.user.email;


        // 登入成功後進首頁
        setTimeout(() => {

            window.location.href =
                "index.html";

        }, 800);

    };

</script>

</body>
</html>
