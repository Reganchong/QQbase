<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>艋舺龍山寺普查系統 - 登入</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 30px 15px;
            color: #1d1d1f;
        }

        .login-box {
            max-width: 420px;
            margin: 80px auto;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            font-size: 22px;
            color: #1a365d;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #718096;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2b6cb0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2c5282;
        }

        #status {
            margin-top: 16px;
            padding: 12px;
            background: #f7fafc;
            border-radius: 8px;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .logged-user {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #f0fff4;
            color: #276749;
            display: none;
        }

        .secondary-btn {
            margin-top: 10px;
            background: #718096;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🏛️ 艋舺龍山寺</h1>

    <div class="subtitle">
        屋面傳統裝飾普查系統
    </div>

    <div id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="研究人員 Email"
            autocomplete="email"
        >

        <label>密碼</label>

        <input
            type="password"
            id="password"
            placeholder="請輸入密碼"
            autocomplete="current-password"
        >

        <button id="loginBtn">
            登入系統
        </button>

    </div>

    <div id="loggedUser" class="logged-user"></div>

    <button
        id="enterBtn"
        style="display:none;"
    >
        進入普查系統
    </button>

    <button
        id="logoutBtn"
        class="secondary-btn"
        style="display:none;"
    >
        登出
    </button>

    <div id="status">
        正在確認登入狀態……
    </div>

</div>


<script type="module">

import { supabase }
from "./supabase-client.js";


const statusEl =
    document.getElementById("status");

const loginForm =
    document.getElementById("loginForm");

const loggedUser =
    document.getElementById("loggedUser");

const enterBtn =
    document.getElementById("enterBtn");

const logoutBtn =
    document.getElementById("logoutBtn");


function showLoggedIn(user) {

    loginForm.style.display =
        "none";

    loggedUser.style.display =
        "block";

    loggedUser.innerText =
        "✅ 已登入\n" +
        user.email;

    enterBtn.style.display =
        "block";

    logoutBtn.style.display =
        "block";

    statusEl.innerText =
        "Supabase Session 已成功保持。";
}


function showLoggedOut() {

    loginForm.style.display =
        "block";

    loggedUser.style.display =
        "none";

    enterBtn.style.display =
        "none";

    logoutBtn.style.display =
        "none";

    statusEl.innerText =
        "尚未登入";
}


/* =====================================
   開頁時檢查既有 Session
===================================== */

const {
    data: { session },
    error
} =
await supabase.auth.getSession();


if (error) {

    statusEl.innerText =
        "❌ Session 檢查錯誤：\n" +
        error.message;

}
else if (session) {

    showLoggedIn(
        session.user
    );

}
else {

    showLoggedOut();

}


/* =====================================
   登入
===================================== */

document.getElementById("loginBtn")
.onclick =
async function () {

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    if (!email || !password) {

        statusEl.innerText =
            "❌ 請輸入 Email 與密碼";

        return;
    }


    statusEl.innerText =
        "📡 正在登入 Supabase……";


    const {
        data,
        error
    } =
    await supabase.auth
        .signInWithPassword({

            email,
            password

        });


    if (error) {

        statusEl.innerText =
            "❌ 登入失敗：\n" +
            error.message;

        return;
    }


    showLoggedIn(
        data.user
    );

};


/* =====================================
   進入首頁
===================================== */

enterBtn.onclick =
function () {

    window.location.href =
        "./index.html";

};


/* =====================================
   登出
===================================== */

logoutBtn.onclick =
async function () {

    await supabase.auth
        .signOut();

    showLoggedOut();

};

</script>

</body>
</html>
