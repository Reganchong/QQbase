<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>艋舺龍山寺普查系統 - 登入</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 30px 15px;
        }

        .login-box {
            max-width: 420px;
            margin: 80px auto;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
        }

        h1 {
            text-align: center;
            color: #1a365d;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 13px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2b6cb0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: #f7fafc;
            font-size: 13px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🏛️ 艋舺龍山寺</h1>
    <div class="subtitle">
        屋面傳統裝飾普查系統
    </div>

    <label>Email</label>
    <input
        type="email"
        id="email"
        autocomplete="email"
    >

    <label>密碼</label>
    <input
        type="password"
        id="password"
        autocomplete="current-password"
    >

    <button id="loginBtn">
        登入系統
    </button>

    <div id="status">
        等待登入
    </div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const SUPABASE_URL =
    "https://kappwvkerqdsvpgzamnc.supabase.co";

/*
把这里换成你真正的 Publishable key / anon key。
不要用 service_role。
*/
const SUPABASE_KEY =
    "YOUR_REAL_PUBLISHABLE_KEY";


const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);


const statusEl =
    document.getElementById("status");


/* 检查旧 session */
const {
    data: { session }
} =
await supabase.auth.getSession();


if (session) {

    statusEl.style.color =
        "#276749";

    statusEl.innerText =
        "✅ 已保持登入\n" +
        session.user.email;

}


/* 登录 */
document.getElementById("loginBtn")
.onclick =
async function () {

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;


    if (!email || !password) {

        statusEl.innerText =
            "❌ 請輸入 Email 與密碼";

        return;
    }


    statusEl.style.color =
        "#4a5568";

    statusEl.innerText =
        "📡 正在登入……";


    try {

        const {
            data,
            error
        } =
        await supabase.auth
            .signInWithPassword({
                email,
                password
            });


        if (error) {

            throw error;

        }


        console.log(
            "LOGIN SUCCESS",
            data
        );


        statusEl.style.color =
            "#276749";

        statusEl.innerText =
            "✅ 登入成功\n" +
            data.user.email +
            "\n\n即將進入首頁……";


        setTimeout(() => {

            window.location.href =
                "./index.html";

        }, 1000);


    } catch (err) {

        console.error(err);

        statusEl.style.color =
            "#c53030";

        statusEl.innerText =
            "❌ 登入失敗\n\n" +
            err.message;

    }

};

</script>

</body>
</html>
