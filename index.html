<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龍山寺屋面傳統裝飾普查系統</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; margin: 0; padding: 15px; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; margin-bottom: 5px; color: #1a365d; }
        
        /* 頂部即時編碼預覽區 */
        .code-preview-box { background-color: #ebf8ff; border: 2px dashed #3182ce; padding: 18px; border-radius: 10px; margin-bottom: 20px; text-align: center; position: relative; }
        .code-preview-box label { font-size: 13px; color: #2b6cb0; font-weight: bold; display: block; margin-bottom: 8px; }
        .generated-code { font-family: "Courier New", Courier, monospace; font-size: 24px; font-weight: bold; color: #2b6cb0; word-break: break-all; }
        
        /* Firebase 雲端網路狀態指示燈 */
        .sync-status-badge { position: absolute; top: 12px; right: 15px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; background: #feebc8; color: #c05621; }
        .sync-status-badge.online { background: #c6f6d5; color: #22543d; }
        .sync-status-badge.online .dot { background: #38a169; }
        .sync-status-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #dd6b20; display: inline-block; }
        
        /* 📄 頁面控制核心（包含三大主頁） */
        .main-section { display: none; }
        .main-section.active { display: block; }
        .page { display: none; }
        .page.active { display: block; }
        
        /* 📱 目錄首頁大卡片按鈕樣式 */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin: 30px 0; }
        @media (min-width: 600px) { .menu-grid { grid-template-columns: 1fr 1fr; } .menu-item.full-width { grid-column: span 2; } }
        .menu-item { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; -webkit-user-select: none; user-select: none; }
        .menu-item:active { background: #edf2f7; transform: scale(0.98); }
        .menu-item h3 { margin: 0 0 8px 0; color: #2b6cb0; font-size: 18px; }
        .menu-item p { margin: 0; color: #718096; font-size: 13px; }
        .menu-item.sync-card { background: #fffaf0; border-color: #feebc8; }
        .menu-item.sync-card h3 { color: #dd6b20; }
        
        /* 表單與大按鈕 */
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-row .form-group { flex: 1; min-width: 0; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #4a5568; }
        input[type="text"], select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; font-size: 16px; background-color: #fff; -webkit-appearance: none; }
        input:focus, select:focus { border-color: #3182ce; outline: none; box-shadow: 0 0 0 3px rgba(66,153,225,0.4); }
        
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; user-select: none; }
        .btn-submit { background-color: #2b6cb0; color: white; }
        .btn-nav { background-color: #718096; color: white; }
        .btn-export { background-color: #38a169; color: white; }
        .btn-home { background-color: #1a365d; color: white; margin-top: 20px; width: 100%; display: block; }
        
        /* 歷史紀錄快取卡片 */
        .preview-container { margin-top: 10px; display: none; text-align: center; }
        .preview-container img { max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #cbd5e0; }
        .history { margin-top: 20px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .history h2 { font-size: 18px; margin: 0; color: #4a5568; }
        .data-card { background: #f7fafc; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 6px solid #2b6cb0; font-size: 14px; position: relative; }
        .data-card img { max-width: 150px; display: block; margin-top: 10px; border-radius: 6px; }
        .delete-btn { position: absolute; top: 15px; right: 15px; color: #e53e3e; cursor: pointer; font-weight: bold; border: none; background: none; font-size: 15px; padding: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏛️ 艋舺龍山寺屋面傳統裝飾普查系統</h1>
    <div style="text-align: center; color: #718096; font-size: 14px; margin-bottom: 15px;">學術普查 PWA 離線同步平台</div>
    
    <!-- 預覽編碼框常駐頂部 -->
    <div class="code-preview-box">
        <div id="networkStatus" class="sync-status-badge">
            <span class="dot"></span> <span id="statusText">等待連線...</span>
        </div>
        <label>當前選擇的完整編號 (Full Code Format)</label>
        <div class="generated-code" id="codePreview">LS-SH-W-MR-11-001-O01</div>
    </div>

    <!-- 🌐 【功能一：目錄導覽首頁】 -->
    <div id="section-menu" class="main-section active">
        <div class="menu-grid">
            <div class="menu-item" onclick="window.switchSection('log')">
                <h3>➕ 數據登錄工具</h3>
                <p>進入分頁普查表單，支援平板現場相機拍照與自動流水號。</p>
            </div>
            <div class="menu-item" onclick="window.switchSection('query')">
                <h3>🔍 查詢歷史數據</h3>
                <p>瀏覽本機與雲端已儲存的全部普查卡片，可即時進行修正抹除。</p>
            </div>
            <div class="menu-item sync-card full-width" onclick="window.switchSection('query')">
                <h3>🔄 雲端同步與下載</h3>
                <p>點選可直接匯出標準學術 Excel (CSV) 表格檔案到平板中。</p>
            </div>
        </div>
        <div style="text-align: center; color: #a0aec0; font-size: 12px; margin-top: 40px;">平板專用系統 · 離線作業優先設計</div>
    </div>

    <!-- 🌐 【功能二：數據登錄頁面】 -->
    <div id="section-log" class="main-section">
        <form id="recordForm">
            <!-- 📄 登錄第一頁：大部位設定 -->
            <div id="page1" class="page active">
                <h3 style="color:#2b6cb0; margin-bottom:15px; border-left:4px solid #2b6cb0; padding-left:8px;">第一步：選擇主要建築部位</h3>
                <div class="form-row">
                    <div class="form-group" style="flex: 0 0 80px;">
                        <label>寺廟代號</label>
                        <input type="text" id="prefix" value="LS" disabled style="background-color: #edf2f7; text-align: center; font-weight: bold;">
                    </div>
                    <div class="form-group">
                        <label>建築區域 [殿區]</label>
                        <select id="area" onchange="window.updateCodePreview()">
                            <option value="SH" selected>三川殿 (SH)</option>
                            <option value="FL">前殿龍門 (FL)</option>
                            <option value="FR">前殿虎門 (FR)</option>
                            <option value="RL">後殿龍門 (RL)</option>
                            <option value="RR">後殿虎門 (RR)</option>
                            <option value="TH">天上聖母殿 (TH)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>屋面部位</label>
                        <select id="roofPos" onchange="window.updateCodePreview()">
                            <option value="MR" selected>正脊 (MR)</option>
                            <option value="DR">垂脊 (DR)</option>
                            <option value="HR">戧脊 (HR)</option>
                        </select>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-nav" onclick="window.switchSection('menu')">🏠 返回目錄首頁</button>
                    <button type="button" class="btn-submit" onclick="window.switchPage(2)">下一步：填寫細部與拍照 ➡️</button>
                </div>
            </div>

            <!-- 📄 登錄第二頁：細部紀錄與現場拍照（修正：儲存時會絕對停留在這頁） -->
            <div id="page2" class="page">
                <h3 style="color:#2b6cb0; margin-bottom:15px; border-left:4px solid #2b6cb0; padding-left:8px;">第二步：詳細普查數據與影像紀錄</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>構件細部分類</label>
                        <select id="compCode" onchange="window.updateCodePreview()">
                            <option value="11" selected>脊堵/脊肚 (11)</option>
                            <option value="16">排頭 (16)</option>
                            <option value="08">西施脊 (08)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>屋面朝向 [方位]</label>
                        <select id="direction" onchange="window.updateCodePreview()">
                            <option value="W" selected>西 West (W)</option>
                            <option value="E">東 East (E)</option>
                            <option value="S">南 South (S)</option>
                            <option value="N">北 North (N)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>作品流水號 (三位數)</label>
                        <input type="text" id="serial" value="001" oninput="window.updateCodePreview()" required style="font-family: monospace;">
                    </div>
                    <div class="form-group">
                        <label>照片型別+序號</label>
                        <input type="text" id="photoType" value="O01" oninput="window.updateCodePreview()" required style="font-family: monospace;">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>工藝形式 (附加欄位)</label>
                        <select id="craft">
                            <option value="CP" selected>剪黏工藝 (CP)</option>
                            <option value="JP">交趾陶工藝 (JP)</option>
                            <option value="CS">泥塑工藝 (CS)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>📷 調查影像上傳 / 平板相機現場拍攝 (選填)</label>
                    <input type="file" id="photo" accept="image/*">
                    <div class="preview-container" id="previewContainer">
                        <img id="imagePreview" src="" alt="照片預覽">
                </div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>📝 題材內容 / 保存狀況備註說明</label>
                    <textarea id="note" rows="2" placeholder="請輸入作品細部觀察描述..."></textarea>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-nav" onclick="window.switchPage(1)">⬅️ 返回第一步</button>
                    <button type="submit" class="btn-submit">💾 儲存此筆文資數據</button>
                </div>
                <button type="button" class="btn-home" onclick="window.switchSection('menu')" style="background-color:#4a5568;">🏠 結束登錄，回目錄首頁</button>
            </div>
        </form>
    </div>

    <!-- 🌐 【功能三：獨立數據查詢與下載頁面】 -->
    <div id="section-query" class="main-section">
        <div class="history">
            <div class="history-header">
                <h2>📋 已儲存核心普查數據快取清單</h2>
                <button type="button" id="exportBtn" class="btn-export" style="flex: none; width: auto; padding: 8px 15px; font-size: 14px;">🍏 匯出 Excel (CSV)</button>
            </div>
            <div id="dataList"></div>
        </div>
        <button type="button" class="btn-home" onclick="window.switchSection('menu')">🏠 返回目錄主選單</button>
    </div>
</div>
    <script>
        // 跨功能大目錄切換導覽函數
        window.switchSection = function(sectionId) {
            try {
                document.getElementById('section-menu').classList.remove('active');
                document.getElementById('section-log').classList.remove('active');
                document.getElementById('section-query').classList.remove('active');
                
                document.getElementById('section-' + sectionId).classList.add('active');
                
                // 只有主動從首頁點進「數據登錄工具」時，才幫他切回第一步，其餘時間不干涉
                if (sectionId === 'log') {
                    window.switchPage(1);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch(err) { console.error(err); }
        };

        // 登錄內部的第一步/第二步換頁
        window.switchPage = function(pageNum) {
            try {
                document.getElementById('page1').classList.remove('active');
                document.getElementById('page2').classList.remove('active');
                document.getElementById('page' + pageNum).classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch(err) { console.error(err); }
        };

        // 選單即時對齊預覽編碼
        window.updateCodePreview = function() {
            try {
                const area = document.getElementById('area').value;
                const direction = document.getElementById('direction').value;
                const roofPos = document.getElementById('roofPos').value;
                const compCode = document.getElementById('compCode').value;
                const serial = document.getElementById('serial').value.trim() || '？';
                const photoType = document.getElementById('photoType').value.trim() || '？';
                document.getElementById('codePreview').innerText = `LS-${area}-${direction}-${roofPos}-${compCode}-${serial}-${photoType}`;
            } catch(e) {}
        };

        // 流水號自動遞增 +1
        window.autoIncrementSerial = function() {
            try {
                const serialEl = document.getElementById('serial');
                const currentVal = parseInt(serialEl.value, 10);
                if (!isNaN(currentVal)) {
                    serialEl.value = String(currentVal + 1).padStart(3, '0');
                }
            } catch(err) {}
        };

        // 中轉點選的刪除指令
        window.triggerDeleteRecord = function(docId) {
            if (window.deleteFirebaseDocFunction) {
                window.deleteFirebaseDocFunction(docId);
            } else {
                alert("Firebase 雲端連線同步中，請稍後再試！");
            }
        };

        window.onload = function() {
            window.updateCodePreview();
            const photoInput = document.getElementById('photo');
            if (photoInput) {
                photoInput.addEventListener('change', function(e) {
                    if (e.target.files && e.target.files) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            window.base64ImageSaved = event.target.result;
                            document.getElementById('imagePreview').src = window.base64ImageSaved;
                            document.getElementById('previewContainer').style.display = 'block';
                        };
                        reader.readAsDataURL(e.target.files);
                    }
                });
            }
        };
        
        window.base64ImageSaved = "";
        window.allRecordsSaved = [];
        window.deleteFirebaseDocFunction = null;
    </script>
    <!-- 負責處理 Firebase 初始化、即時資料庫監聽、刪除文件與 Excel 匯出 -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, enableIndexedDbPersistence } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCcQwZq42FnlL5_V0HCQ1mjNZaulQrRh1w",
            authDomain: "://firebaseapp.com",
            projectId: "qqbase-39057",
            storageBucket: "qqbase-39057.firebasestorage.app",
            messagingSenderId: "173614464944",
            appId: "1:173614464944:web:aeb38060c576cf495aa075",
            measurementId: "G-KF50RT64YM"
        };

        let db, firestoreCollection;

        function updateStatusBadge(isOnline) {
            const badge = document.getElementById('networkStatus');
            const text = document.getElementById('statusText');
            if (!badge || !text) return;
            if (isOnline) {
                badge.className = "sync-status-badge online";
                text.innerText = "雲端已連線";
            } else {
                badge.className = "sync-status-badge";
                text.innerText = "離線暫存模式";
            }
        }

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            
            enableIndexedDbPersistence(db).catch((err) => {
                console.warn("快取提示:", err.code);
            });

            firestoreCollection = collection(db, "survey_records");
            updateStatusBadge(navigator.onLine);

            // 綁定全域刪除
            window.deleteFirebaseDocFunction = async function(docId) {
                if (!confirm("⚠️ 確定要從雲端永久刪除這筆文資數據卡片嗎？")) return;
                try {
                    const docRef = doc(db, "survey_records", docId);
                    await deleteDoc(docRef);
                    alert("🗑️ 數據已成功自雲端移除！");
                } catch (err) {
                    alert("刪除失敗: " + err.message);
                }
            };

            // 監聽異動並渲染到查詢分頁中
            onSnapshot(firestoreCollection, (snapshot) => {
                const dataList = document.getElementById('dataList');
                if (!dataList) return;
                
                dataList.innerHTML = "";
                window.allRecordsSaved = [];
                let docs = [];

                snapshot.forEach(doc => {
                    let data = doc.data();
                    data.id = doc.id;
                    docs.push(data);
                });
                
                docs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                docs.forEach(val => {
                    window.allRecordsSaved.push(val);
                    const card = document.createElement('div');
                    card.className = 'data-card';
                    card.innerHTML = `
                        <button type="button" class="delete-btn" onclick="window.triggerDeleteRecord('${val.id}')">❌ 刪除</button>
                        <strong style="color:#2b6cb0; font-size:15px;">🔍 編碼：${val.fullCode}</strong><br>
                        <span style="color:#718096; font-size:12px;">🕒 登記時間：${val.timestamp} | 🎨 工藝：${val.craft}</span><br>
                        ${val.note ? `<div style="margin-top:5px; background:#fff; padding:6px; border:1px solid #edf2f7;">📝 備註：${val.note}</div>` : ''}
                        ${val.photo ? `<img src="${val.photo}" alt="影像">` : ''}
                    `;
                    dataList.appendChild(card);
                });

                if (window.allRecordsSaved.length === 0) {
                    dataList.innerHTML = "<p style='color:#a0aec0; text-align:center;'>目前資料庫尚無任何數據</p>";
                }
            });

        } catch(err) {
            console.error(err);
        }

        window.addEventListener('online', () => updateStatusBadge(true));
        window.addEventListener('offline', () => updateStatusBadge(false));

        // 表單提交儲存
        document.getElementById('recordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!firestoreCollection) return;

            const record = {
                fullCode: document.getElementById('codePreview').innerText,
                area: document.getElementById('area').value,
                direction: document.getElementById('direction').value,
                roofPos: document.getElementById('roofPos').value,
                compCode: document.getElementById('compCode').value,
                serial: document.getElementById('serial').value,
                photoType: document.getElementById('photoType').value,
                craft: document.getElementById('craft').value,
                note: document.getElementById('note').value,
                photo: window.base64ImageSaved,
                timestamp: new Date().toLocaleString()
            };

            try {
                await addDoc(firestoreCollection, record);
                alert("🎉 數據登錄成功！\n識別碼：" + record.fullCode);
                
                // 🚀 關鍵優化 1：只清理文字備註與照片檔案欄位
                document.getElementById('note').value = "";
                document.getElementById('photo').value = "";
                document.getElementById('previewContainer').style.display = 'none';
                window.base64ImageSaved = "";
                
                // 🚀 關鍵優化 2：流水號自動安全 +1 (其餘下拉選單數值完全原封不動鎖在原地)
                window.autoIncrementSerial();
                window.updateCodePreview(); // 刷新藍框
                
                // 🚀 關鍵優化 3：徹底移除了回到第一頁的 switchPage(1) 指令，強制留在同一頁！
                
            } catch (err) {
                alert("儲存失敗: " + err.message);
            }
        });

        // 下載 CSV 表格
        document.getElementById('exportBtn').addEventListener('click', function() {
            if (window.allRecordsSaved.length === 0) {
                alert("目前沒有數據可供匯出！");
                return;
            }
            let csvContent = "\uFEFF"; 
            csvContent += "完整登錄編碼,建築區域,方位,屋面部位,細部分類,流水號,照片序號,工藝,備註說明,登記時間\n";
            window.allRecordsSaved.forEach(r => {
                const row = [
                    r.fullCode, r.area, r.direction, r.roofPos, r.compCode, r.serial, r.photoType, r.craft, r.note || '', r.timestamp
                ].map(text => `"${text.replace(/"/g, '""')}"`).join(",");
                csvContent += row + "\n";
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `龍山寺文資普查目錄版_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    });
</script>
</body>
</html>
