<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龍山寺屋面傳統裝飾普查系統</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" 
    content="black-translucent">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 
        "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; 
        color: #1d1d1f; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; 
        background: white; padding: 24px; border-radius: 16px; 
        box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; 
        margin-bottom: 5px; color: #1a365d; }
        .code-preview-box { background-color: #ebf8ff; 
        border: 2px dashed #3182ce; padding: 18px; 
        border-radius: 10px; margin-bottom: 20px; 
        text-align: center; position: relative; }
        .code-preview-box label { font-size: 13px; 
        color: #2b6cb0; font-weight: bold; 
        display: block; margin-bottom: 8px; }
        .generated-code { font-family: monospace; 
        font-size: 24px; font-weight: bold; 
        color: #2b6cb0; word-break: break-all; }
        .sync-status-badge { position: absolute; 
        top: 12px; right: 15px; display: flex; 
        align-items: center; gap: 6px; font-size: 12px; 
        font-weight: bold; padding: 4px 10px; 
        border-radius: 20px; background: #feebc8; 
        color: #c05621; }
        .sync-status-badge.online { background: #c6f6d5; 
        color: #22543d; }
        .sync-status-badge.online .dot { background: #38a169; }
        .sync-status-badge .dot { width: 8px; height: 8px; 
        border-radius: 50%; background: #dd6b20; 
        display: inline-block; }
        .main-section, .page { display: none; }
        .main-section.active, .page.active { display: block; }
        .menu-grid { display: grid; grid-template-columns: 1fr; 
        gap: 16px; margin: 30px 0; }
        @media (min-width: 600px) { 
        .menu-grid { grid-template-columns: 1fr 1fr; } 
        .menu-item.full-width { grid-column: span 2; } }
        .menu-item { background: #f7fafc; 
        border: 2px solid #e2e8f0; border-radius: 12px; 
        padding: 24px; text-align: center; cursor: pointer; 
        transition: all 0.2s; }
        .menu-item:hover { background: #edf2f7; transform: translateY(-1px); }
        .menu-item h3 { margin: 0 0 8px 0; color: #2b6cb0; }
        .menu-item p { margin: 0; color: #718096; font-size: 13px; }
        .menu-item.sync-card { background: #fffaf0; 
        border-color: #feebc8; }
        .menu-item.sync-card h3 { color: #dd6b20; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-row .form-group { flex: 1; min-width: 0; }
        label { display: block; font-weight: 600; 
        margin-bottom: 6px; font-size: 14px; color: #4a5568; }
        input[type="text"], select, textarea { width: 100%; 
        padding: 12px; border: 1px solid #cbd5e0; 
        border-radius: 8px; box-sizing: border-box; 
        font-size: 16px; background-color: #fff; }
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border: none; 
        border-radius: 8px; font-size: 16px; font-weight: bold; 
        cursor: pointer; transition: background 0.2s; }
        .btn-submit { background-color: #2b6cb0; color: white; }
        .btn-submit:hover { background-color: #1d4ed8; }
        .btn-nav { background-color: #718096; color: white; }
        .btn-nav:hover { background-color: #4b5563; }
        .btn-export { background-color: #38a169; color: white; }
        .btn-export:hover { background-color: #15803d; }
        .btn-home { background-color: #1a365d; color: white; 
        margin-top: 20px; width: 100%; display: block; }
        .btn-home:hover { background-color: #0f172a; }
        .preview-container { margin-top: 10px; display: none; 
        text-align: center; }
        .preview-container img { max-width: 100%; 
        max-height: 200px; border-radius: 8px; }
        .history { margin-top: 20px; }
        .history-header { display: flex; 
        justify-content: space-between; align-items: center; 
        margin-bottom: 15px; }
        .history h2 { font-size: 18px; margin: 0; color: #4a5568; }
        .data-card { background: #f7fafc; padding: 15px; 
        border-radius: 10px; margin-bottom: 12px; 
        border-left: 6px solid #2b6cb0; font-size: 14px; 
        position: relative; }
        .data-card img { max-width: 150px; display: block; 
        margin-top: 10px; border-radius: 6px; }
        .delete-btn { position: absolute; top: 15px; right: 15px; 
        color: #e53e3e; cursor: pointer; font-weight: bold; 
        border: none; background: none; font-size: 15px; }
        .card-sync-tag { display: inline-block; font-size: 11px; 
        padding: 2px 6px; border-radius: 4px; font-weight: bold; 
        margin-left: 8px; }
        .tag-unsynced { background: #feebc8; color: #c05621; }
        .tag-synced { background: #c6f6d5; color: #22543d; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏛️ 艋舺龍山寺屋面傳統裝飾普查系統</h1>
    <div style="text-align: center; color: #718096; 
    font-size: 14px; margin-bottom: 15px;">實體檔案安全備份版</div>
    
    <div class="code-preview-box">
        <div id="networkStatus" class="sync-status-badge">
            <span class="dot"></span> <span id="statusText">檢測中...</span>
        </div>
        <label>當前選擇的完整編號</label>
        <div class="generated-code" id="codePreview"></div>
    </div>

    <!-- 🌐 【功能一：目錄導覽首頁】 -->
    <div id="section-menu" class="main-section active">
        <div class="menu-grid">
            <div class="menu-item" onclick="window.switchSection('log')">
                <h3>➕ 數據登錄工具</h3>
                <p>在本機平板/電腦直接下載實體檔案，選項鎖定，流水號自動+1。</p>
            </div>
            <div class="menu-item" onclick="window.switchSection('query')">
                <h3>🔍 導入與查詢歷史數據</h3>
                <p>選取普查實體檔案，在平板/電腦畫面上瞬間還原檢視與產出報表。</p>
            </div>
            <div class="menu-item sync-card full-width" 
            onclick="window.triggerFileImportForSync()">
                <h3>🔄 點擊批量上傳同步至雲端</h3>
                <p>回到有網路的地方時點選此處，選取本機檔案一次性大批量上傳雲端。</p>
            </div>
        </div>
        <input type="file" id="bulkImportInput" multiple accept=".survey" 
        style="display:none;">
    </div>

    <!-- 🌐 【功能二：數據登錄頁面】 -->
    <div id="section-log" class="main-section">
        <form id="recordForm">
            <!-- 📄 登錄第一頁：宏觀部位 -->
            <div id="page1" class="page active">
                <h3 style="color:#2b6cb0; margin-bottom:15px; 
                border-left:4px solid #2b6cb0; padding-left:8px;">
                第一步：選擇主要建築部位</h3>
                <div class="form-row">
                    <div class="form-group" style="flex: 0 0 80px;">
                        <label>寺廟代號</label>
                        <input type="text" id="prefix" value="LS" 
                        disabled style="background-color: #edf2f7; 
                        text-align: center; font-weight: bold;">
                    </div>
                    <div class="form-group">
                        <label>建築區域 [殿區]</label>
                        <select id="area" onchange="window.updateCodePreview()">
                            <option value="SH" selected>三川殿 (SH)</option>
                            <option value="FL">前殿龍門 (FL)</option>
                            <option value="FR">前殿虎門 (FR)</option>
                            <option value="RL">後殿龍門 (RL)</option>
                            <option value="RR">後殿虎門 (RR)</option>
                            <option value="TH">天上聖母殿 (TH)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>屋面部位</label>
                        <select id="roofPos" onchange="window.updateCodePreview()">
                            <option value="MR" selected>正脊 (MR)</option>
                            <option value="DR">垂脊 (DR)</option>
                            <option value="HR">戧脊 (HR)</option>
                        </select>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-nav" 
                    onclick="window.switchSection('menu')">🏠 回目錄</button>
                    <button type="button" class="btn-submit" 
                    onclick="window.switchPage(2)">下一步 ➡️</button>
                </div>
            </div>

            <!-- 📄 登錄第二頁：細部紀錄（原地留守，選項鎖定，點擊直接下載） -->
            <div id="page2" class="page">
                <h3 style="color:#2b6cb0; margin-bottom:15px; 
                border-left:4px solid #2b6cb0; padding-left:8px;">
                第二步：詳細數據與影像紀錄</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>構件細部分類</label>
                        <select id="compCode" onchange="window.updateCodePreview()">
                            <option value="11" selected>脊堵/脊肚 (11)</option>
                            <option value="16">排頭 (16)</option>
                            <option value="08">西施脊 (08)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>屋面朝向 [方位]</label>
                        <select id="direction" onchange="window.updateCodePreview()">
                            <option value="W" selected>西 West (W)</option>
                            <option value="E">東 East (E)</option>
                            <option value="S">南 South (S)</option>
                            <option value="N">北 North (N)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>作品流水號</label>
                        <input type="text" id="serial" value="001" 
                        oninput="window.updateCodePreview()" required 
                        style="font-family: monospace;">
                    </div>
                    <div class="form-group">
                        <label>照片型別+序號</label>
                        <input type="text" id="photoType" value="O01" 
                        oninput="window.updateCodePreview()" required 
                        style="font-family: monospace;">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>工藝形式</label>
                        <select id="craft">
                            <option value="CP" selected>剪黏工藝 (CP)</option>
                            <option value="JP">交趾陶工藝 (JP)</option>
                            <option value="CS">泥塑工藝 (CS)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>📷 調查影像 (選填)</label>
                    <input type="file" id="photo" accept="image/*">
                    <div class="preview-container" id="previewContainer">
                        <img id="imagePreview" src="" alt="預覽">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>📝 題材內容 / 保存狀況備註</label>
                    <textarea id="note" rows="2" 
                    placeholder="請輸入細部觀察描述..."></textarea>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-nav" 
                    onclick="window.switchPage(1)">⬅️ 返回第一步</button>
                    <button type="button" class="btn-submit" 
                    onclick="window.triggerLocalSave()">💾 直接存成檔案下載</button>
                </div>
                <button type="button" class="btn-home" 
                onclick="window.switchSection('menu')" 
                style="background-color:#4a5568;">🏠 結束登錄</button>
            </div>
        </form>
    </div>

    <!-- 🌐 【功能三：獨立實體檔案檢視與下載頁面】 -->
    <div id="section-query" class="main-section">
        <div class="history">
            <div class="history-header">
                <h2>📋 導入外部普查檔案進行檢視</h2>
                <button type="button" class="btn-submit" style="background-color:#2b6cb0; 
                padding: 8px 15px; font-size:14px; flex:none; width:auto;"
                onclick="window.triggerQueryImport()">📂 選擇檔案還原檢視</button>
                
                <button type="button" id="exportBtn" 
                class="btn-export" style="padding: 8px 15px; font-size:14px; 
                flex:none; width:auto; margin-left:8px;">🍏 匯出總 Excel</button>
            </div>
            <div id="dataList"></div>
        </div>
        <button type="button" class="btn-home" 
        onclick="window.switchSection('menu')">🏠 返回目錄</button>
    </div>
</div>
<script>
    // --- 大目錄導覽 ---
    window.switchSection = function(id) {
        document.getElementById('section-menu').classList.remove('active');
        document.getElementById('section-log').classList.remove('active');
        document.getElementById('section-query').classList.remove('active');
        document.getElementById('section-' + id).classList.add('active');
        if (id === 'log') { window.switchPage(1); }
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    // --- 分頁換頁 ---
    window.switchPage = function(num) {
        document.getElementById('page1').classList.remove('active');
        document.getElementById('page2').classList.remove('active');
        document.getElementById('page' + num).classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    // --- 編碼變換 ---
    window.updateCodePreview = function() {
        const area = document.getElementById('area').value;
        const dir = document.getElementById('direction').value;
        const roof = document.getElementById('roofPos').value;
        const comp = document.getElementById('compCode').value;
        const ser = document.getElementById('serial').value.trim() || '？';
        const pType = document.getElementById('photoType').value.trim() || '？';
        document.getElementById('codePreview').innerText = 
        `LS-${area}-${dir}-${roof}-${comp}-${ser}-${pType}`;
    };

    window.autoIncrementSerial = function() {
        const el = document.getElementById('serial');
        const val = parseInt(el.value, 10);
        if (!isNaN(val)) { el.value = String(val + 1).padStart(3, '0'); }
    };

    // --- 在本機硬碟直接下載實體專屬檔案 (.survey) ---
    window.downloadSurveyFile = function(record) {
        try {
            const jsonString = JSON.stringify(record, null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            
            const safeTime = new Date().getTime();
            link.setAttribute("download", `普查_${record.fullCode}_${safeTime}.survey`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } catch(err) { alert("下載出錯: " + err.message); }
    };

    // 按鈕全域管道中轉
    window.triggerLocalSave = function() {
        if (window.executeLocalSaveFunction) { window.executeLocalSaveFunction(); }
    };
    window.triggerQueryImport = function() {
        window.currentImportMode = 'query';
        document.getElementById('bulkImportInput').click();
    };
    window.triggerFileImportForSync = function() {
        window.currentImportMode = 'sync';
        document.getElementById('bulkImportInput').click();
    };
    window.triggerDeleteRecord = function(fCode) {
        if (window.deleteLocalRecordFunction) { window.deleteLocalRecordFunction(fCode); }
    };

    window.onload = function() {
        window.updateCodePreview();
        document.getElementById('photo').onchange = function(e) {
            if (e.target.files && e.target.files) {
                const rdr = new FileReader();
                rdr.onload = function(evt) {
                    window.base64ImageSaved = evt.target.result;
                    document.getElementById('imagePreview').src = evt.target.result;
                    document.getElementById('previewContainer').style.display = 'block';
                };
                rdr.readAsDataURL(e.target.files);
            }
        };
    };

    window.base64ImageSaved = "";
    window.allRecordsSaved = [];
    window.currentImportMode = 'query';
    window.deleteLocalRecordFunction = null;
    window.syncToFirebaseFunction = null;
    window.executeLocalSaveFunction = null; 
</script>
<script type="module">
    import { initializeApp } from 
    "https://gstatic.com";
    import { getFirestore, collection, addDoc } from 
    "https://gstatic.com";

    const config = {
        apiKey: "AIzaSyCcQwZq42FnlL5_V0HCQ1mjNZaulQrRh1w",
        authDomain: "://firebaseapp.com",
        projectId: "qqbase-39057",
        storageBucket: "qqbase-39057.firebasestorage.app",
        messagingSenderId: "173614464944",
        appId: "1:173614464944:web:aeb38060c576cf495aa075",
        measurementId: "G-KF50RT64YM"
    };

    let cloudCollection = null;

    try {
        const app = initializeApp(config);
        cloudCollection = collection(getFirestore(app), "survey_records");
        document.getElementById('networkStatus').className = "sync-status-badge online";
        document.getElementById('statusText').innerText = "實體存檔模式";
    } catch(err) { console.error(err); }

    // 批量導入並解析 .survey 實體檔案 (支援電腦滑鼠大批量多選)
    document.getElementById('bulkImportInput').onchange = function(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        let loadedRecords = [];
        let processedCount = 0;

        for (let i = 0; i < files.length; i++) {
            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const record = JSON.parse(evt.target.result);
                    loadedRecords.push(record);
                } catch(err) {}
                
                processedCount++;
                if (processedCount === files.length) {
                    if (window.currentImportMode === 'query') {
                        window.allRecordsSaved = loadedRecords;
                        renderUIList();
                    } else if (window.currentImportMode === 'sync') {
                        await executeBulkFirebaseSync(loadedRecords);
                    }
                    document.getElementById('bulkImportInput').value = ""; 
                }
            };
            reader.readAsText(files[i]);
        }
    };

    // 渲染清單到查詢分頁上
    function renderUIList() {
        const box = document.getElementById('dataList');
        if (!box) return; box.innerHTML = "";
        
        let reversed = [...window.allRecordsSaved].reverse();
        reversed.forEach(val => {
            const card = document.createElement('div');
            card.className = 'data-card';
            card.innerHTML = `
                <button type="button" class="delete-btn" 
                onclick="window.triggerDeleteRecord('${val.fullCode}')">❌</button>
                <strong>🔍 導入編碼：${val.fullCode}</strong><br>
                <span style="color:#718096; font-size:12px;">🕒 普查時間：${val.timestamp}</span><br>
                ${val.note ? `<div style="margin-top:5px; background:#fff; padding:6px; border:1px solid #edf2f7;">📝 備註：${val.note}</div>` : ''}
                ${val.photo ? `<img src="${val.photo}">` : ''}
            `;
            box.appendChild(card);
        });
    }

    // 移除當前畫面檢視
    window.deleteLocalRecordFunction = function(fCode) {
        window.allRecordsSaved = window.allRecordsSaved
            .filter(item => item.fullCode !== fCode);
        renderUIList();
    };

    // 批量同步至 Firebase 雲端資料庫
    async function executeBulkFirebaseSync(records) {
        if (!navigator.onLine || !cloudCollection) {
            alert("🚨 同步失敗：請連上穩定網路再進行同步！"); return;
        }
        alert(`📡 正在將選取的 ${records.length} 筆實體檔案大批量上傳至雲端...`);
        let success = 0;
        for (let r of records) {
            try {
                await addDoc(cloudCollection, r); success++;
            } catch(err) {}
        }
        alert(`☁️ 雲端批量同步成功！\n共成功同步上傳了 ${success} 筆數據卡片！`);
    }

    // 核心功能：實體下載與原地鎖定
    window.executeLocalSaveFunction = function() {
        const serialVal = document.getElementById('serial').value.trim();
        const photoTypeVal = document.getElementById('photoType').value.trim();
        if (!serialVal || !photoTypeVal) {
            alert("❌ 請填寫作品流水號與照片型別！"); return;
        }

        const record = {
            fullCode: document.getElementById('codePreview').innerText,
            area: document.getElementById('area').value,
            direction: document.getElementById('direction').value,
            roofPos: document.getElementById('roofPos').value,
            compCode: document.getElementById('compCode').value,
            serial: serialVal, photoType: photoTypeVal,
            craft: document.getElementById('craft').value,
            note: document.getElementById('note').value,
            photo: window.base64ImageSaved,
            timestamp: new Date().toLocaleString()
        };

        window.downloadSurveyFile(record);

        document.getElementById('note').value = "";
        document.getElementById('photo').value = "";
        document.getElementById('previewContainer').style.display = 'none';
        window.base64ImageSaved = "";
        
        window.autoIncrementSerial(); 
        window.updateCodePreview(); 
    };

    // ✅ 已修正變選殘留：大總匯 Excel (CSV) 導出功能
    document.getElementById('exportBtn').onclick = function() {
        if (window.allRecordsSaved.length === 0) { alert("目前畫面上沒有任何導入數據！"); return; }
        let csv = "\uFEFF";
        csv += "完整登錄編碼,建築區域,方位,屋面部位,細部分類,流水號,照片序號,工藝,備註,登記時間\n";
        
        window.allRecordsSaved.forEach(r => {
            const row = [
                r.fullCode, r.area, r.direction, r.roofPos, r.compCode,
                r.serial, r.photoType, r.craft, r.note || '', r.timestamp
            ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(",");
            csv += row + "\n";
        });
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `龍山寺普查總統計報表_${new Date().toLocaleDateString()}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };
</script>
</body>
</html>
