<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寺廟傳統裝飾普查系統 - 目錄</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f5f5f7; color: #1d1d1f; margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; margin-bottom: 5px; color: #1a365d; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin: 30px 0; }
        @media (min-width: 600px) { .menu-grid { grid-template-columns: 1fr 1fr; } .sync-card { grid-column: span 2; } }
        .menu-item { background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; text-decoration: none; display: block; }
        .menu-item:hover { background: #edf2f7; transform: translateY(-1px); }
        .menu-item h3 { margin: 0 0 8px 0; color: #2b6cb0; font-size: 18px; }
        .menu-item p { margin: 0; color: #718096; font-size: 13px; }
        .sync-card { background: #fffaf0; border-color: #feebc8; }
        .sync-card h3 { color: #dd6b20; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏛️寺廟屋面傳統裝飾普查系統</h1>
    <div style="text-align: center; color: #718096; font-size: 14px; margin-bottom: 15px;">實體存檔獨立多頁版</div>

    <div class="menu-grid">
        <!-- 🔗 超連結直接切換到獨立的登錄頁面 -->
        <a href="log.html" class="menu-item">
            <h3>➕ 數據登錄工具</h3>
            <p>前往雙分頁表單進行現場普查，選項鎖定，流水號自動+1，直接下載實體檔。</p>
        </a>
        
        <!-- 🔗 超連結直接切換到獨立的查詢頁面 -->
        <a href="query.html" class="menu-item">
            <h3>🔍 導入與查詢歷史數據</h3>
            <p>選取普查實體檔案，在網頁畫面上瞬間還原檢視與產出總報表。</p>
        </a>
        
        <!-- 🔄 本頁保留功能：點擊手動批量同步 Firebase 雲端 -->
        <div class="menu-item sync-card" onclick="document.getElementById('syncInput').click()">
            <h3>🔄 點擊批量上傳同步至雲端</h3>
            <p>回到有網路的地方時點選此處，多選本機下載的檔案一次性上傳雲端。</p>
        </div>
                <!-- 補在 index.html 的選單格網裡面： -->
        <a href="display.html" class="menu-item" style="background:#f0fdf4; border-color:#bbf7d0;">
            <h3>🖥️ 成果互動展示機 (最新)</h3>
            <p>將調查成果載入類似麥當勞的觸控大面板，流暢分類瀏覽卡片與高解析影像！</p>
        </a>

    </div>
    <input type="file" id="syncInput" multiple accept=".survey" style="display:none;">
</div>

<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc } from "https://gstatic.com";

    const config = {
        apiKey: "AIzaSyCcQwZq42FnlL5_V0HCQ1mjNZaulQrRh1w",
        authDomain: "://firebaseapp.com",
        projectId: "qqbase-39057",
        storageBucket: "qqbase-39057.firebasestorage.app",
        messagingSenderId: "173614464944",
        appId: "1:173614464944:web:aeb38060c576cf495aa075",
        measurementId: "G-KF50RT64YM"
    };

    let cloudCollection = null;
    try {
        const app = initializeApp(config);
        cloudCollection = collection(getFirestore(app), "survey_records");
    } catch(err) { console.error(err); }

    document.getElementById('syncInput').onchange = function(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        if (!navigator.onLine || !cloudCollection) {
            alert("🚨 同步失敗：請連上穩定網路再進行同步！"); return;
        }

        alert(`📡 正在將選取的 ${files.length} 筆實體檔案上傳至雲端...`);
        let success = 0, processed = 0;

        for (let i = 0; i < files.length; i++) {
            const reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    const record = JSON.parse(evt.target.result);
                    await addDoc(cloudCollection, record);
                    success++;
                } catch(err) {}
                processed++;
                if (processed === files.length) {
                    alert(`☁️ 雲端批量同步成功！共成功同步 ${success} 筆數據！`);
                    document.getElementById('syncInput').value = "";
                }
            };
            reader.readAsText(files[i]);
        }
    };
</script>
</body>
</html>
