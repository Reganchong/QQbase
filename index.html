<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龍山寺屋面傳統裝飾普查系統</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" 
    content="black-translucent">
    <style>
        body { font-family: -apple-system, sans-serif; 
        background-color: #f5f5f7; color: #1d1d1f; 
        margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; 
        background: white; padding: 24px; 
        border-radius: 16px; 
        box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; 
        margin-bottom: 5px; color: #1a365d; }
        .code-preview-box { background-color: #ebf8ff; 
        border: 2px dashed #3182ce; padding: 18px; 
        border-radius: 10px; margin-bottom: 20px; 
        text-align: center; position: relative; }
        .code-preview-box label { font-size: 13px; 
        color: #2b6cb0; font-weight: bold; 
        display: block; margin-bottom: 8px; }
        .generated-code { font-family: monospace; 
        font-size: 24px; font-weight: bold; 
        color: #2b6cb0; word-break: break-all; }
        .sync-status-badge { position: absolute; 
        top: 12px; right: 15px; display: flex; 
        align-items: center; gap: 6px; font-size: 12px; 
        font-weight: bold; padding: 4px 10px; 
        border-radius: 20px; background: #feebc8; 
        color: #c05621; }
        .sync-status-badge.online { background: #c6f6d5; 
        color: #22543d; }
        .sync-status-badge.online .dot { background: #38a169; }
        .sync-status-badge .dot { width: 8px; height: 8px; 
        border-radius: 50%; background: #dd6b20; 
        display: inline-block; }
        .main-section, .page { display: none; }
        .main-section.active, .page.active { display: block; }
        .menu-grid { display: grid; grid-template-columns: 1fr; 
        gap: 16px; margin: 30px 0; }
        @media (min-width: 600px) { 
        .menu-grid { grid-template-columns: 1fr 1fr; } 
        .menu-item.full-width { grid-column: span 2; } }
        .menu-item { background: #f7fafc; 
        border: 2px solid #e2e8f0; border-radius: 12px; 
        padding: 24px; text-align: center; cursor: pointer; }
        .menu-item h3 { margin: 0 0 8px 0; color: #2b6cb0; }
        .menu-item p { margin: 0; color: #718096; font-size: 13px; }
        .menu-item.sync-card { background: #fffaf0; 
        border-color: #feebc8; }
        .menu-item.sync-card h3 { color: #dd6b20; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-row .form-group { flex: 1; min-width: 0; }
        label { display: block; font-weight: 600; 
        margin-bottom: 6px; font-size: 14px; color: #4a5568; }
        input[type="text"], select, textarea { width: 100%; 
        padding: 12px; border: 1px solid #cbd5e0; 
        border-radius: 8px; box-sizing: border-box; 
        font-size: 16px; background-color: #fff; }
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border: none; 
        border-radius: 8px; font-size: 16px; font-weight: bold; 
        cursor: pointer; }
        .btn-submit { background-color: #2b6cb0; color: white; }
        .btn-nav { background-color: #718096; color: white; }
        .btn-export { background-color: #38a169; color: white; }
        .btn-home { background-color: #1a365d; color: white; 
        margin-top: 20px; width: 100%; display: block; }
        .preview-container { margin-top: 10px; display: none; 
        text-align: center; }
        .preview-container img { max-width: 100%; 
        max-height: 200px; border-radius: 8px; }
        .history { margin-top: 20px; }
        .history-header { display: flex; 
        justify-content: space-between; align-items: center; 
        margin-bottom: 15px; }
        .history h2 { font-size: 18px; margin: 0; color: #4a5568; }
        .data-card { background: #f7fafc; padding: 15px; 
        border-radius: 10px; margin-bottom: 12px; 
        border-left: 6px solid #2b6cb0; font-size: 14px; 
        position: relative; }
        .data-card img { max-width: 150px; display: block; 
        margin-top: 10px; border-radius: 6px; }
        .delete-btn { position: absolute; top: 15px; right: 15px; 
        color: #e53e3e; cursor: pointer; font-weight: bold; 
        border: none; background: none; font-size: 15px; }
        .card-sync-tag { display: inline-block; font-size: 11px; 
        padding: 2px 6px; border-radius: 4px; font-weight: bold; 
        margin-left: 8px; }
        .tag-unsynced { background: #feebc8; color: #c05621; }
        .tag-synced { background: #c6f6d5; color: #22543d; }
    </style>
</head>

<body>
<div class="container">
    <h1>🏛️ 艋舺龍山寺屋面傳統裝飾普查系統</h1>
    <div style="text-align: center; color: #718096; 
    font-size: 14px; margin-bottom: 15px;">本機優先離線同步版</div>
    
    <div class="code-preview-box">
        <div id="networkStatus" class="sync-status-badge">
            <span class="dot"></span> <span id="statusText">檢測中...</span>
        </div>
        <label>當前選擇的完整編號</label>
        <div class="generated-code" id="codePreview"></div>
    </div>

    <!-- 🌐 【頁面一：目錄導覽首頁】 -->
    <div id="section-menu" class="main-section active">
        <div class="menu-grid">
            <div class="menu-item" onclick="window.switchSection('log')">
                <h3>➕ 數據登錄工具</h3>
                <p>在本機平板極速儲存裝飾普查，選項鎖定，流水號自動+1。</p>
            </div>
            <div class="menu-item" onclick="window.switchSection('query')">
                <h3>🔍 查詢歷史數據</h3>
                <p>翻看當前平板內所有卡片，可即時查看同步狀態或刪除。</p>
            </div>
            <div class="menu-item sync-card full-width" 
            onclick="window.triggerFirebaseSync()">
                <h3>🔄 點擊同步至雲端資料庫</h3>
                <p>回到有網路的地方時點選此處，將卡片一次性批量推送到雲端。</p>
            </div>
        </div>
    </div>

    <!-- 🌐 【頁面二：數據登錄頁面】 -->
    <div id="section-log" class="main-section">
        <form id="recordForm">
            <!-- 📄 登錄第一頁：宏觀部位 -->
            <div id="page1" class="page active">
                <h3 style="color:#2b6cb0; margin-bottom:15px; 
                border-left:4px solid #2b6cb0; padding-left:8px;">
                第一步：選擇主要建築部位</h3>
                <div class="form-row">
                    <div class="form-group" style="flex: 0 0 80px;">
                        <label>寺廟代號</label>
                        <input type="text" id="prefix" value="LS" 
                        disabled style="background-color: #edf2f7; 
                        text-align: center; font-weight: bold;">
                    </div>
                    <div class="form-group">
                        <label>建築區域 [殿區]</label>
                        <select id="area" onchange="window.updateCodePreview()">
                            <option value="SH" selected>三川殿 (SH)</option>
                            <option value="FL">前殿龍門 (FL)</option>
                            <option value="FR">前殿虎門 (FR)</option>
                            <option value="RL">後殿龍門 (RL)</option>
                            <option value="RR">後殿虎門 (RR)</option>
                            <option value="TH">天上聖母殿 (TH)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>屋面部位</label>
                        <select id="roofPos" onchange="window.updateCodePreview()">
                            <option value="MR" selected>正脊 (MR)</option>
                            <option value="DR">垂脊 (DR)</option>
                            <option value="HR">戧脊 (HR)</option>
                        </select>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-nav" 
                    onclick="window.switchSection('menu')">🏠 回目錄</button>
                    <button type="button" class="btn-submit" 
                    onclick="window.switchPage(2)">下一步 ➡️</button>
                </div>
            </div>

            <!-- 📄 登錄第二頁：細部紀錄與現場拍照（原地留守，選項鎖定） -->
            <div id="page2" class="page">
                <h3 style="color:#2b6cb0; margin-bottom:15px; 
                border-left:4px solid #2b6cb0; padding-left:8px;">
                第二步：詳細數據與影像紀錄</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>構件細部分類</label>
                        <select id="compCode" onchange="window.updateCodePreview()">
                            <option value="11" selected>脊堵/脊肚 (11)</option>
                            <option value="16">排頭 (16)</option>
                            <option value="08">西施脊 (08)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>屋面朝向 [方位]</label>
                        <select id="direction" onchange="window.updateCodePreview()">
                            <option value="W" selected>西 West (W)</option>
                            <option value="E">東 East (E)</option>
                            <option value="S">南 South (S)</option>
                            <option value="N">北 North (N)</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>作品流水號</label>
                        <input type="text" id="serial" value="001" 
                        oninput="window.updateCodePreview()" required 
                        style="font-family: monospace;">
                    </div>
                    <div class="form-group">
                        <label>照片型別+序號</label>
                        <input type="text" id="photoType" value="O01" 
                        oninput="window.updateCodePreview()" required 
                        style="font-family: monospace;">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>工藝形式</label>
                        <select id="craft">
                            <option value="CP" selected>剪黏工藝 (CP)</option>
                            <option value="JP">交趾陶工藝 (JP)</option>
                            <option value="CS">泥塑工藝 (CS)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>📷 調查影像 (選填)</label>
                    <input type="file" id="photo" accept="image/*">
                    <div class="preview-container" id="previewContainer">
                        <img id="imagePreview" src="" alt="預覽">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>📝 題材內容 / 保存狀況備註</label>
                    <textarea id="note" rows="2" 
                    placeholder="請輸入細部觀察描述..."></textarea>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn-nav" 
                    onclick="window.switchPage(1)">⬅️ 返回第一步</button>
                    <button type="submit" class="btn-submit">
                    💾 儲存至當前平板本機</button>
                </div>
                <button type="button" class="btn-home" 
                onclick="window.switchSection('menu')" 
                style="background-color:#4a5568;">🏠 結束登錄</button>
            </div>
        </form>
    </div>

    <!-- 🌐 【頁面三：獨立數據查詢與下載頁面】 -->
    <div id="section-query" class="main-section">
        <div class="history">
            <div class="history-header">
                <h2>📋 平板本機已快取數據總覽</h2>
                <button type="button" id="exportBtn" 
                class="btn-export">🍏 匯出 Excel (CSV)</button>
            </div>
            <div id="dataList"></div>
        </div>
        <button type="button" class="btn-home" 
        onclick="window.switchSection('menu')">🏠 返回目錄</button>
    </div>
</div>
<script>
    // --- 換Section大目錄 ---
    window.switchSection = function(id) {
        document.getElementById('section-menu')
            .classList.remove('active');
        document.getElementById('section-log')
            .classList.remove('active');
        document.getElementById('section-query')
            .classList.remove('active');
        document.getElementById('section-' + id)
            .classList.add('active');
        if (id === 'log') { window.switchPage(1); }
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    // --- 換Form分頁 ---
    window.switchPage = function(num) {
        document.getElementById('page1')
            .classList.remove('active');
        document.getElementById('page2')
            .classList.remove('active');
        document.getElementById('page' + num)
            .classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    // --- 即時預覽編碼 ---
    window.updateCodePreview = function() {
        const area = document.getElementById('area').value;
        const dir = document.getElementById('direction').value;
        const roof = document.getElementById('roofPos').value;
        const comp = document.getElementById('compCode').value;
        const ser = document.getElementById('serial')
            .value.trim() || '？';
        const pType = document.getElementById('photoType')
            .value.trim() || '？';
        document.getElementById('codePreview').innerText = 
        `LS-${area}-${dir}-${roof}-${comp}-${ser}-${pType}`;
    };

    // --- 流水號自動遞增 ---
    window.autoIncrementSerial = function() {
        const el = document.getElementById('serial');
        const val = parseInt(el.value, 10);
        if (!isNaN(val)) { 
            el.value = String(val + 1).padStart(3, '0'); 
        }
    };

    // --- 刪除與同步的中轉管道 ---
    window.triggerDeleteRecord = function(id) {
        if (window.deleteLocalRecordFunction) {
            window.deleteLocalRecordFunction(id);
        }
    };
    window.triggerFirebaseSync = function() {
        if (window.syncToFirebaseFunction) {
            window.syncToFirebaseFunction();
        } else { alert("資料庫初始化中..."); }
    };

    // --- 照片讀取轉碼 ---
    window.onload = function() {
        window.updateCodePreview();
        document.getElementById('photo').onchange = 
        function(e) {
            if (e.target.files && e.target.files[0]) {
                const rdr = new FileReader();
                rdr.onload = function(evt) {
                    window.base64ImageSaved = evt.target.result;
                    document.getElementById('imagePreview')
                        .src = evt.target.result;
                    document.getElementById('previewContainer')
                        .style.display = 'block';
                };
                rdr.readAsDataURL(e.target.files[0]);
            }
        };
    };
    window.base64ImageSaved = "";
    window.allRecordsSaved = [];
    window.deleteLocalRecordFunction = null;
    window.syncToFirebaseFunction = null;
</script>
<script type="module">
    import { initializeApp } from 
    "https://gstatic.com";
    import { getFirestore, collection, addDoc } from 
    "https://gstatic.com";

    // 完美切齊的極窄版雲端金鑰
    const config = {
        apiKey: "AIzaSyCcQwZq42FnlL5_V0HCQ1mjNZaulQrRh1w",
        authDomain: "://firebaseapp.com",
        projectId: "qqbase-39057",
        storageBucket: "qqbase-39057.firebasestorage.app",
        messagingSenderId: "173614464944",
        appId: "1:173614464944:web:aeb38060c576cf495aa075",
        measurementId: "G-KF50RT64YM"
    };

    let localDB = null, cloudCollection = null;

    function toggleBadge(on) {
        const b = document.getElementById('networkStatus');
        const t = document.getElementById('statusText');
        if(!b || !t) return;
        b.className = on ? 
            "sync-status-badge online" : "sync-status-badge";
        t.innerText = on ? "網路已連線" : "離線優先模式";
    }

    // 啟動本機 IndexedDB 資料庫
    const req = indexedDB.open("LongshanLocalDatabase", 1);
    req.onupgradeneeded = function(e) {
        let d = e.target.result;
        if (!d.objectStoreNames.contains("local_records")) {
            d.createObjectStore("local_records", 
            { keyPath: "id", autoIncrement: true });
        }
    };
    req.onsuccess = function(e) { 
        localDB = e.target.result; renderList(); 
    };

    // 啟動 Firebase 連線
    try {
        const app = initializeApp(config);
        cloudCollection = collection(
            getFirestore(app), "survey_records"
        );
        toggleBadge(navigator.onLine);
    } catch(err) { console.error(err); }

    window.addEventListener('online', () => toggleBadge(true));
    window.addEventListener('offline', () => toggleBadge(false));

    // 讀取並渲染本機普查清單
    function renderList() {
        const box = document.getElementById('dataList');
        if (!box || !localDB) return;
        box.innerHTML = ""; window.allRecordsSaved = [];
        
        const tx = localDB.transaction(
            ["local_records"], "readonly"
        );
        tx.objectStore("local_records").openCursor(null, "prev")
        .onsuccess = function(e) {
            const cur = e.target.result;
            if (cur) {
                const v = cur.value; 
                window.allRecordsSaved.push(v);
                const tag = v.synced === 1 ? 
                `<span class="card-sync-tag tag-synced">☁️ 已同步</span>` : 
                `<span class="card-sync-tag tag-unsynced">⏳ 暫存中</span>`;
                
                const card = document.createElement('div');
                card.className = 'data-card';
                card.innerHTML = `
                    <button type="button" class="delete-btn" 
                    onclick="window.triggerDeleteRecord(${v.id})">❌</button>
                    <strong>🔍 編碼：${v.fullCode}</strong>${tag}<br>
                    <span style="color:#718096; font-size:12px;">
                    🕒 時間：${v.timestamp}</span><br>
                    ${v.note ? `<div style="margin-top:5px; background:#fff; 
                    padding:6px; border:1px solid #edf2f7;">
                    📝 備註：${v.note}</div>` : ''}
                    ${v.photo ? `<img src="${v.photo}">` : ''}
                `;
                box.appendChild(card); cur.continue();
            } else if (window.allRecordsSaved.length === 0) {
                box.innerHTML = "<p style='color:#a0aec0; " +
                "text-align:center;'>目前本機尚無普查數據</p>";
            }
        };
    }

    // 本機卡片單獨移除
    window.deleteLocalRecordFunction = function(id) {
        if (!confirm("⚠️ 確定要從平板本機刪除嗎？")) return;
        const tx = localDB.transaction(
            ["local_records"], "readwrite"
        );
        tx.objectStore("local_records").delete(id);
        tx.oncomplete = function() { 
            alert("🗑️ 數據已自本機移除！"); renderList(); 
        };
    };

    // 手動批量同步上傳雲端
    window.syncToFirebaseFunction = async function() {
        if (!navigator.onLine) { 
            alert("🚨 同步失敗：目前平板沒有網路！"); return; 
        }
        if (!cloudCollection) { 
            alert("🚨 雲端連線失敗！"); return; 
        }
        alert("📡 正在將平板離線數據發送至雲端...");

        const tx = localDB.transaction(
            ["local_records"], "readwrite"
        );
        const store = tx.objectStore("local_records");
        let unsynced = 0, success = 0;

        store.openCursor().onsuccess = async function(e) {
            const cur = e.target.result;
            if (cur) {
                const r = cur.value;
                if (r.synced === 0) {
                    unsynced++;
                    try {
                        const clean = {
                            fullCode: r.fullCode, area: r.area, 
                            direction: r.direction, roofPos: r.roofPos, 
                            compCode: r.compCode, serial: r.serial,
                            photoType: r.photoType, craft: r.craft, 
                            note: r.note, photo: r.photo, 
                            timestamp: r.timestamp
                        };
                        await addDoc(cloudCollection, clean);
                        r.synced = 1; cur.update(r); success++;
                    } catch(err) { console.error(err); }
                }
                cur.continue();
            } else {
                if (unsynced === 0) { 
                    alert("☁️ 所有資料皆已同步，無新增項目。"); 
                } else { 
                    alert(`🎉 同步成功！\n上傳了 ${success} 筆暫存！`); 
                }
                renderList();
            }
        };
    };

    // 表單本機極速儲存 (原地留守、欄位鎖定、流水號+1)
    document.getElementById('recordForm').onsubmit = function(e) {
        e.preventDefault(); if (!localDB) return;
        const r = {
            fullCode: document.getElementById('codePreview').innerText,
            area: document.getElementById('area').value,
            direction: document.getElementById('direction').value,
            roofPos: document.getElementById('roofPos').value,
            compCode: document.getElementById('compCode').value,
            serial: document.getElementById('serial').value,
            photoType: document.getElementById('photoType').value,
            craft: document.getElementById('craft').value,
            note: document.getElementById('note').value,
            photo: window.base64ImageSaved, synced: 0,
            timestamp: new Date().toLocaleString()
        };
        const tx = localDB.transaction(
            ["local_records"], "readwrite"
        );
        tx.objectStore("local_records").add(r);
        tx.oncomplete = function() {
            alert("💾 數據已存入本機！\n編碼：" + r.fullCode);
            document.getElementById('note').value = "";
            document.getElementById('photo').value = "";
            document.getElementById('previewContainer')
                .style.display = 'none';
            window.base64ImageSaved = "";
            window.autoIncrementSerial(); 
            window.updateCodePreview(); 
            renderList();
        };
    };

    // 極窄版 Excel (CSV) 匯出功能
    document.getElementById('exportBtn').onclick = function() {
        if (window.allRecordsSaved.length === 0) { 
            alert("目前本機沒有數據！"); return; 
        }
        let csv = "\uFEFF";
        csv += "完整登錄編碼,建築區域,方位,屋面部位," +
               "細部分類,流水號,照片序號,工藝,備註,同步狀態,登記時間\n";
        
        window.allRecordsSaved.forEach(r => {
            const txt = r.synced === 1 ? "已同步" : "僅本機暫存";
            const row = [
                r.fullCode, r.area, r.direction, r.roofPos, r.compCode,
                r.serial, r.photoType, r.craft, r.note || '', txt, 
                r.timestamp
            ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(",");
            csv += row + "\n";
        });
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); 
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", 
            `龍山寺普查表_${new Date().toLocaleDateString()}.csv`);
        document.body.appendChild(link); 
        link.click(); 
        document.body.removeChild(link);
    };
</script>
</body>
